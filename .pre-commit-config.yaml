repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # sqlfluff usa o templater dbt (.sqlfluff), que precisa do projeto e do dbt-duckdb do venv: por
  # isso hook local via `uv run`, e não o repo remoto do sqlfluff (ambiente isolado sem o templater).
  # Regras vêm só do .sqlfluff (sem códigos legados L0xx). Macros são ignoradas pelo sqlfluff.
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint (models + tests dbt)
        entry: bash -c 'export DATA_ROOT="${DATA_ROOT:-$PWD/.tmp/lint}"; mkdir -p "$DATA_ROOT"; uv run sqlfluff lint transform/models transform/tests'
        language: system
        pass_filenames: false
        files: ^(transform/(models|tests|macros)/.+\.sql|\.sqlfluff)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^docs/referencia-original/
      - id: check-yaml
        exclude: ^transform/packages\.yml$

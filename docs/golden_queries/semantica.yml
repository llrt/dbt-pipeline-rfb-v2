    armadilhas:
      - "Recorte sem MEI sai vazio (null), não zero."
      - "`qtd_ativos_mei` conta estabelecimentos (há MEI com filial no dado real)."
    variacoes:
      - "Uma UF: `--where \"{{ Dimension('municipio__sigla_uf') }} = 'ES'\"`."
    resposta_esperada_fixtures:
      colunas: [metric_time__month, municipio__sigla_uf, qtd_ativos_mei, qtd_ativos, pct_mei_entre_ativos]
      linhas:

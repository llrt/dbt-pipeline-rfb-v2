# Golden queries da camada semântica (ADR-0023): comandos `mf query` (MetricFlow) sobre as métricas e as consultas
# salvas de transform/models. Mesmo cabeçalho de metadados das golden queries SQL de transform/analyses/golden/.
# Cada entrada usa `saved_query` OU `metricas` (+ `group_by`, `where`). O comando roda em `transform/`:
#   uv run mf query --metrics <metricas> --group-by <group_by> --where "<where>"
#   uv run mf query --saved-query <saved_query>
# `resposta_esperada_fixtures` é a saída do `mf query --csv` nas fixtures do `make ci`, com as linhas ORDENADAS
# (o MetricFlow não garante a ordem e as consultas salvas não usam `order_by`, ADR-0017): datas sem a hora,
# números como número, vazio como null. O `make golden` grava no catálogo o SQL que o MetricFlow gera para cada
# entrada (`mf query --explain`, campo `sql`), e o teste `test_golden_queries.py` executa esse SQL somente leitura e
# compara (RGQ-01).
# Depois de editar, rode `make golden`.

golden_queries:
  - id: gq_semantica__empresa_estabelecimento__01
    conceito: empresa_estabelecimento
    camada: semantica
    perguntas:
      - "Quantas empresas e quantos estabelecimentos há por mês?"
      - "Quantos CNPJs ativos existem, e quantas empresas?"
    intencao: "Empresas (matrizes), estabelecimentos e ativos por mês de referência, pelas métricas padrão do resumo mensal."
    metricas: [qtd_matrizes, qtd_estabelecimentos, qtd_ativos]
    group_by: [metric_time__month]
    armadilhas:
      - "`qtd_estabelecimentos` e `qtd_ativos` contam estabelecimentos; empresas = `qtd_matrizes`."
      - "Fotografia mensal: agrupe por mês; sem tempo ou por ano vale o último mês com linhas, nunca a soma."
    variacoes:
      - "Só ativas: `--where \"{{ Dimension('situacao_cadastral__rotulo_situacao_cadastral') }} = 'ATIVA'\"` (conta a matriz ativa)."
      - "Por UF: acrescente `municipio__sigla_uf` ao `--group-by`."
    resposta_esperada_fixtures:
      colunas: [metric_time__month, qtd_matrizes, qtd_estabelecimentos, qtd_ativos]
      linhas:
        - ['2026-08-01', 16, 17, 10]
        - ['2026-09-01', 16, 18, 11]

  - id: gq_semantica__matriz_filial__01
    conceito: matriz_filial
    camada: semantica
    perguntas:
      - "Quantas aberturas e encerramentos foram de matriz e quantos de filial?"
      - "Abrem mais empresas novas ou filiais?"
    intencao: "Aberturas e encerramentos (todos os anos do extrato) separados por matriz e filial."
    metricas: [aberturas, encerramentos]
    group_by: [estabelecimento__eh_matriz]
    armadilhas:
      - "`eh_matriz` é dimensão da fato detalhada: combine com `aberturas`/`encerramentos`, não com as métricas do resumo."
      - "Sem tempo no `--group-by`, soma todos os anos de eventos do extrato corrente."
    variacoes:
      - "Por ano: acrescente `metric_time__year`."
    resposta_esperada_fixtures:
      colunas: [estabelecimento__eh_matriz, aberturas, encerramentos]
      linhas:
        - [false, 2, 1]
        - [true, 15, 5]

  - id: gq_semantica__situacao_cadastral__01
    conceito: situacao_cadastral
    camada: semantica
    perguntas:
      - "Quantos estabelecimentos há em cada situação cadastral por mês?"
      - "Quantos estão suspensos, inaptos ou baixados?"
    intencao: "Estabelecimentos por mês e situação cadastral, agrupando (não filtrando) a situação."
    metricas: [qtd_estabelecimentos]
    group_by: [metric_time__month, situacao_cadastral__rotulo_situacao_cadastral]
    armadilhas:
      - "Agrupe pela situação em vez de filtrá-la: com filtro, o MetricFlow escolhe o último mês DEPOIS do filtro e pode devolver uma fotografia velha (RSEM-01)."
      - "Ativa ≠ em operação."
    variacoes:
      - "Uma UF: `--where \"{{ Dimension('municipio__sigla_uf') }} = 'ES'\"`."
    resposta_esperada_fixtures:
      colunas: [metric_time__month, situacao_cadastral__rotulo_situacao_cadastral, qtd_estabelecimentos]
      linhas:
        - ['2026-08-01', ATIVA, 10]
        - ['2026-08-01', BAIXADA, 5]
        - ['2026-08-01', INAPTA, 1]
        - ['2026-08-01', SUSPENSA, 1]
        - ['2026-09-01', ATIVA, 11]
        - ['2026-09-01', BAIXADA, 6]
        - ['2026-09-01', INAPTA, 1]

  - id: gq_semantica__situacao_cadastral__02
    conceito: situacao_cadastral
    camada: semantica
    perguntas:
      - "Quantas suspensas há na Paraíba hoje?"
      - "Quantos estabelecimentos suspensos tem a PB no mês mais recente?"
    intencao: "Estoque atual com filtro de situação, feito do jeito certo: filtrando também o mês (vazio = nenhum)."
    metricas: [qtd_estabelecimentos]
    group_by: [metric_time__month]
    where: "{{ Dimension('municipio__sigla_uf') }} = 'PB' and {{ Dimension('situacao_cadastral__rotulo_situacao_cadastral') }} = 'SUSPENSA' and {{ TimeDimension('metric_time', 'month') }} = '2026-09-01'"
    armadilhas:
      - "Sem o filtro de mês, a consulta por ano devolve 1 (a fotografia de 2026-08), embora em 2026-09 não haja suspensa na PB: o `MAX(mes)` é escolhido depois do filtro (RSEM-01)."
      - "Resultado vazio aqui quer dizer zero."
    variacoes:
      - "Outro mês: troque a data do filtro de `metric_time` (sempre o 1º dia do mês)."
    resposta_esperada_fixtures:
      colunas: []
      linhas: []

  - id: gq_semantica__porte__01
    conceito: porte
    camada: semantica
    perguntas:
      - "Qual a idade média dos ativos por porte no mês mais recente?"
      - "Quantas microempresas ativas há?"
    intencao: "Ativos e idade média por porte num mês."
    metricas: [qtd_ativos, idade_media_anos]
    group_by: [porte__rotulo_porte]
    where: "{{ TimeDimension('metric_time', 'month') }} = '2026-09-01'"
    armadilhas:
      - "`N/A` (código 00) ≠ `NÃO INFORMADO` (membro -1); o porte é declarado; MEI não é porte."
      - "O ratio soma antes de dividir: idade média ponderada pelos ativos."
    variacoes:
      - "Série: troque o `--where` por `metric_time__month` no `--group-by`."
    resposta_esperada_fixtures:
      colunas: [porte__rotulo_porte, qtd_ativos, idade_media_anos]
      linhas:
        - [DEMAIS, 2, 18.7]
        - [MICRO, 4, 4.275]
        - [N/A, 2, 16.1]
        - [NÃO INFORMADO, 0, null]
        - [PEQUENA, 3, 14.8]

  - id: gq_semantica__natureza_juridica__01
    conceito: natureza_juridica
    camada: semantica
    perguntas:
      - "Quantas aberturas houve por natureza jurídica?"
      - "Quantas sociedades limitadas foram abertas?"
    intencao: "Aberturas (todos os anos do extrato) por natureza jurídica."
    metricas: [aberturas]
    group_by: [natureza_juridica__descricao_natureza_juridica]
    armadilhas:
      - "Natureza jurídica só existe na fato detalhada: só com `aberturas`, `encerramentos` e `baixas`, nunca com as métricas do resumo."
      - "MEI não é natureza jurídica."
    variacoes:
      - "Por ano: acrescente `metric_time__year`."
    resposta_esperada_fixtures:
      colunas: [natureza_juridica__descricao_natureza_juridica, aberturas]
      linhas:
        - [Empresa Individual de Responsabilidade Limitada (de Natureza Empresária), 1]
        - [Empresário (Individual), 5]
        - [Sociedade Empresária Limitada, 11]

  - id: gq_semantica__cnae_principal__01

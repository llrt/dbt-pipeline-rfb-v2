    armadilhas:
      - "'Região' é ambíguo (grande região, metropolitana, intermediária, imediata): `municipio__nome_regiao` é a grande região."
      - "Município homônimo: filtre `municipio__nome_municipio` junto com `municipio__sigla_uf`."
    variacoes:

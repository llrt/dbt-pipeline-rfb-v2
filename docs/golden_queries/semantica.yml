    metricas: [qtd_ativos]
    group_by: [metric_time__month, cnae__descricao_secao]
    where: "{{ TimeDimension('metric_time', 'month') }} = '2026-09-01'"
    armadilhas:
      - "Só o CNAE principal; o secundário não está na camada semântica."
      - "`NÃO INFORMADO` reúne CNAEs sem par na Base dos Dados."
    variacoes:
      - "Uma subclasse: `--where \"{{ Dimension('cnae__codigo_subclasse') }} = '4741500'\"`."
      - "Outros níveis: `cnae__descricao_divisao`, `cnae__descricao_grupo`, `cnae__descricao_classe`."
    resposta_esperada_fixtures:
      colunas: [metric_time__month, cnae__descricao_secao, qtd_ativos]
      linhas:
        - ['2026-09-01', 'Agricultura, pecuaria, producao florestal, pesca e aquicultura', 1]
        - ['2026-09-01', Comercio; reparacao de veiculos automotores e motocicletas, 6]
        - ['2026-09-01', Industrias de transformacao, 3]
        - ['2026-09-01', NÃO INFORMADO, 1]

  - id: gq_semantica__simples_mei__01
    conceito: simples_mei
    camada: semantica

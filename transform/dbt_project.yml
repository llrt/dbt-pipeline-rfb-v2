name: "rfb"
version: "1.0.0"
config-version: 2
profile: "rfb"
require-dbt-version: [">=1.10.5", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

on-run-start:
  - "{{ criar_historico_testes() }}"

on-run-end:
  - "{{ registrar_resultados_testes(results) }}"

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  mes_referencia: null
  data_referencia: null
  ano_populacao: null
  primeiro_dia_calendario: "1900-01-01"  # início de dim_data; antes dele a data é inválida (-2)
  caso_cnae_alvo: "4741500"
  caso_municipio: "FUNDÃO"
  caso_uf: "ES"
  caso_cnaes_fornecedores: ["2071100", "4679601", "4679699"]
  raio_fornecedores_km: 100
  limite_dias_extrato: 65  # `extrato_desatualizado` (RBP-04): idade máxima do extrato RFB mais recente

models:
  rfb:
    staging:
      +materialized: view
      +meta:
        escopo: adicao
      +tags: ["escopo_adicao"]
    intermediate:
      +materialized: table
      +meta:
        escopo: adicao
      +tags: ["escopo_adicao"]
    marts:
      +materialized: external
      original:
        +meta:
          escopo: original
        +tags: ["escopo_original"]
      core:
        +meta:
          escopo: adicao
        +tags: ["escopo_adicao"]
      analytics:
        +meta:
          escopo: adicao
        +tags: ["escopo_adicao"]
    observability:
      +materialized: table
      +meta:
        escopo: adicao
      +tags: ["escopo_adicao"]

seeds:
  rfb:
    +meta:
      escopo: adicao
    +tags: ["escopo_adicao"]

# Testes de dados sem escopo explícito são adição; os do original declaram `meta.escopo: original`
# (e a tag) no próprio teste. Testes genéricos herdam a configuração pelo caminho do YAML em que são
# declarados; só core/, analytics/ e observability/ (100% adição) recebem a tag aqui — nos demais (inclusive os dos seeds,
# cujo FQN não inclui diretório) cada teste declara `meta` + tag (tags são aditivas: uma tag de projeto duplicaria `escopo_original`).
data_tests:
  rfb:
    +meta:
      escopo: adicao
    marts:
      core:
        +tags: ["escopo_adicao"]
      analytics:
        +tags: ["escopo_adicao"]
    observability:
      +tags: ["escopo_adicao"]

unit_tests:
  rfb:
    +meta:
      escopo: adicao
    +tags: ["escopo_adicao"]

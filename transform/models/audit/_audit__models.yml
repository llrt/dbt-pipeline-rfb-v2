version: 2

models:
  - name: audit__bh_empresas_sql_original
    description: >
      SQL do notebook 3 (`bh_empresas`) traduzido literalmente para DuckDB sobre as fontes raw,
      emulando o `inferSchema` do Spark (códigos só de dígitos como inteiro). Efêmero: só existe
      como CTE do teste `paridade_bh_empresas` (ADR-0005). Alinha `cnae_principal` (7 dígitos) e
      `nome` (trim, emenda R2-01; CPF mascarado, ADR-0008 emenda R4-01) no select final.

unit_tests:
  - name: test_audit__bh_empresas_sql_original_joins_por_inteiro
    description: >
      R2-06: a emulação do `inferSchema` casa códigos por valor inteiro, como o Spark: município
      `'0001'` (RFB) × `'1'` (BD) e CNAE `'0111301'` (RFB) × `'111301'` (BD) só casam via cast (um
      join textual os descartaria). Situação `'02'` -> ATIVA; situação não numérica -> INATIVA (no
      Spark, string × int dá NULL; sem o `try_cast`, o DuckDB aborta na conversão implícita).
      `nome` com espaços nas bordas sai com trim (alinhamento R2-01).
    model: audit__bh_empresas_sql_original
    overrides:
      vars:
        mes_referencia: null  # o build real passa --vars mes_referencia; o teste usa o mês das fixtures
    given:
      - input: source('rfb', 'empresas')
        format: sql
        rows: |
          select
              '1' as cnpj_raiz, ' AGRO UM ' as razao_social, '2062' as natureza_jur,
              '01' as porte, '0,00' as capital_soc, '49' as qualificacao_resp,
              null::varchar as ente_fed_resp, '2026-09' as _mes_referencia
      - input: source('rfb', 'estabelecimentos')
        format: sql
        rows: |
          with est(cnpj_ordem, situacao) as (values ('1', '02'), ('2', 'XX'))
          select
              '00000001' as cnpj_raiz, cnpj_ordem, '5' as cnpj_dv,
              null::varchar as nome_fantasia, situacao, '20221015' as dat_inicio_atividade,
              '0111301' as cnae_principal, null::varchar as cnaes_secundarios,
              '0001' as municipio, '2026-09' as _mes_referencia,
              date '2026-09-12' as _data_referencia
          from est
      - input: source('rfb', 'naturezas')
        format: sql
        rows: |
          select
              '02062' as codigo, 'Sociedade Empresária Limitada' as descricao,
              '2026-09' as _mes_referencia
      - input: source('basedosdados', 'cnae_2')
        format: sql
        rows: |
          select
              '111301' as subclasse, 'Cultivo de arroz' as descricao_subclasse,
              'Produção de lavouras temporárias' as descricao_grupo
      - input: source('basedosdados', 'municipio')
        format: sql
        rows: |
          select
              '1' as id_municipio_rf, 'Alta Floresta D''Oeste' as nome,
              'Cacoal' as nome_microrregiao, 'Leste Rondoniense' as nome_mesorregiao,
              'RO' as sigla_uf
    expect:
      rows:
        - cnpj_raiz: "00000001"
          cnpj_completo: "00000001000105"
          nome: "AGRO UM"
          natureza_juridica: "SOCIEDADE EMPRESÁRIA LIMITADA"
          porte: "MICRO"
          cnae_principal: "0111301"
          desc_cnae_principal: "CULTIVO DE ARROZ"
          municipio: "ALTA FLORESTA D'OESTE"
          uf: "RO"
          situacao: "ATIVA"
          idade_atual: 3.9
        - cnpj_raiz: "00000001"
          cnpj_completo: "00000001000205"
          nome: "AGRO UM"
          natureza_juridica: "SOCIEDADE EMPRESÁRIA LIMITADA"
          porte: "MICRO"
          cnae_principal: "0111301"
          desc_cnae_principal: "CULTIVO DE ARROZ"
          municipio: "ALTA FLORESTA D'OESTE"
          uf: "RO"
          situacao: "INATIVA"
          idade_atual: null

  - name: test_audit__bh_empresas_sql_original_cnpj_alfanumerico
    description: >
      B8 (extrato real 2026-09): com um `cnpj_ordem` alfanumérico no mês, o `inferSchema` do Spark
      deixaria a coluna como texto; a emulação faz o mesmo (`inferschema_inteiro_ou_texto`) e o CNPJ
      alfanumérico sai inteiro, igual ao `bh_empresas` (antes virava `'0000000105'`).
    model: audit__bh_empresas_sql_original
    overrides:
      vars:
        mes_referencia: null  # o build real passa --vars mes_referencia; o teste usa o mês das fixtures
    given:
      - input: source('rfb', 'empresas')
        format: sql
        rows: |
          select
              '1' as cnpj_raiz, 'AGRO UM' as razao_social, '2062' as natureza_jur,
              '01' as porte, '0,00' as capital_soc, '49' as qualificacao_resp,
              null::varchar as ente_fed_resp, '2026-09' as _mes_referencia
      - input: source('rfb', 'estabelecimentos')
        format: sql
        rows: |
          with est(cnpj_ordem) as (values ('0001'), ('E08G'))
          select
              '00000001' as cnpj_raiz, cnpj_ordem, '05' as cnpj_dv,
              null::varchar as nome_fantasia, '02' as situacao, '20221015' as dat_inicio_atividade,
              '0111301' as cnae_principal, null::varchar as cnaes_secundarios,
              '0001' as municipio, '2026-09' as _mes_referencia,
              date '2026-09-12' as _data_referencia
          from est
      - input: source('rfb', 'naturezas')
        format: sql
        rows: |
          select '2062' as codigo, 'Sociedade Empresária Limitada' as descricao, '2026-09' as _mes_referencia
      - input: source('basedosdados', 'cnae_2')
        format: sql
        rows: |
          select '111301' as subclasse, 'Cultivo de arroz' as descricao_subclasse, 'Grupo' as descricao_grupo
      - input: source('basedosdados', 'municipio')
        format: sql
        rows: |
          select '1' as id_municipio_rf, 'Alta Floresta' as nome, 'Cacoal' as nome_microrregiao,
              'Leste Rondoniense' as nome_mesorregiao, 'RO' as sigla_uf
    expect:
      rows:
        - { cnpj_completo: "00000001000105" }
        - { cnpj_completo: "00000001E08G05" }

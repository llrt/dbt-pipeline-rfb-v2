version: 2

models:
  - name: mart_concorrencia_municipio
    description: >
      ANA-01 (adição): densidade de concorrência por CNAE principal × município. `ativos` e `inativos`
      pela regra do original (`situacao != 2` = inativo); `ativos_por_10k_hab` = ativos × 10 000 /
      população do `ano_populacao` (NULL sem população); `ranking_uf` ordena municípios da mesma UF e
      CNAE pela densidade. Parquet em `gold/mart_concorrencia_municipio.parquet`.
    data_tests:
      # RBP-13: a densidade é por 10 mil habitantes (N11).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(populacao, 0) = 0 or ativos_por_10k_hab = round(ativos * 10000.0 / populacao, 2)"
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnae_principal, sk_municipio]
    config:
      contract:
        enforced: true
    columns:
      - name: sk_cnae
        description: Chave de `dim_cnae` (R3-20); `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
        data_tests: [not_null]
      - name: desc_cnae_principal
        description: Descrição da subclasse (Base dos Dados).
        data_type: varchar
      - name: sk_municipio
        description: Chave de `dim_municipio`; `-1` para município sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: uf
        description: Sigla da UF.
        data_type: varchar
      - name: populacao
        description: População do município no `ano_populacao`; NULL sem dado.
        data_type: bigint
      - name: ativos
        description: Estabelecimentos ativos (`situacao = 2`) do CNAE no município.
        data_type: bigint
        data_tests: [not_null]
      - name: inativos
        description: Estabelecimentos inativos (`situacao != 2`) do CNAE no município.
        data_type: bigint
        data_tests: [not_null]
      - name: ativos_por_10k_hab
        description: Ativos por 10 mil habitantes (2 casas); NULL quando a população é nula ou zero.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
      - name: ranking_uf
        description: Posição do município na UF para o CNAE por `ativos_por_10k_hab` decrescente (1 = mais denso); NULL sem densidade.
        data_type: bigint

  - name: mart_sobrevivencia_coorte
    description: >
      ANA-02 (adição): sobrevivência por coorte (ano de início da atividade) × CNAE principal × porte × UF,
      a 1, 3 e 5 anos. Elegibilidade pela coorte inteira (`make_date(ano + N, 12, 31) <= data_referencia`);
      sobrevive quem está ativo ou foi encerrado após `dat_inicio + N anos`. Taxa NULL sem elegíveis.
      Invariantes (taxas em [0,1] e monotonicidade) no teste `sobrevivencia_invariantes`.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      contract:
        enforced: true
    columns:
      - name: ano_coorte
        description: Ano de `dat_inicio_atividade` do estabelecimento.
        data_type: bigint
        data_tests: [not_null]
      - name: sk_cnae
        description: Chave de `dim_cnae` (R3-20); `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
        data_tests: [not_null]
      - name: sk_porte
        description: Chave de `dim_porte` (R3-20).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_porte')
                field: sk_porte
      - name: porte
        description: Rótulo do porte (`dim_porte`); NÃO INFORMADO para porte vazio.
        data_type: varchar
      - name: uf
        description: Sigla da UF do município; `NI` para município sem par no BD.
        data_type: varchar
      - name: estabelecimentos
        description: Estabelecimentos do estrato (independente de elegibilidade).
        data_type: bigint
      - name: elegiveis_1a
        description: Estabelecimentos da coorte elegíveis ao horizonte de 1 ano (0 quando a coorte ainda não completou o horizonte).
        data_type: bigint
      - name: sobreviventes_1a
        description: Elegíveis que sobrevivem 1 ano (ativos ou encerrados após `dat_inicio + 1 ano`).
        data_type: bigint
      - name: taxa_1a
        description: sobreviventes_1a / elegiveis_1a; NULL sem elegíveis.
        data_type: double
      - name: elegiveis_3a
        description: Elegíveis ao horizonte de 3 anos.
        data_type: bigint
      - name: sobreviventes_3a
        description: Elegíveis que sobrevivem 3 anos.
        data_type: bigint
      - name: taxa_3a
        description: sobreviventes_3a / elegiveis_3a; NULL sem elegíveis.
        data_type: double
      - name: elegiveis_5a
        description: Elegíveis ao horizonte de 5 anos.
        data_type: bigint
      - name: sobreviventes_5a
        description: Elegíveis que sobrevivem 5 anos.
        data_type: bigint
      - name: taxa_5a
        description: sobreviventes_5a / elegiveis_5a; NULL sem elegíveis.
        data_type: double

  - name: mart_dinamica_mercado
    description: >
      ANA-03 (adição): aberturas, encerramentos e saldo por ano × CNAE principal × município.
      Abertura = ano de `dat_inicio`; encerramento = ano de `dat_situacao` de inativos (`situacao != 2`).
      Datas nulas não geram evento.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      contract:
        enforced: true
    columns:
      - name: ano
        description: Ano calendário do evento (abertura ou encerramento).
        data_type: integer
        data_tests: [not_null]
      - name: sk_cnae
        description: Chave de `dim_cnae` (R3-20); `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: sk_municipio
        description: Chave de `dim_municipio` (R3-20); `-1` para município sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
        data_tests: [not_null]
      - name: desc_cnae_principal
        description: Descrição da subclasse (Base dos Dados).
        data_type: varchar
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: uf
        description: Sigla da UF.
        data_type: varchar
      - name: aberturas
        description: Estabelecimentos com início de atividade no ano.
        data_type: bigint
        data_tests: [not_null]
      - name: encerramentos
        description: Estabelecimentos inativos com data da situação no ano.
        data_type: bigint
        data_tests: [not_null]
      - name: saldo
        description: aberturas − encerramentos.
        data_type: bigint
        data_tests: [not_null]

  - name: mart_fornecedores_proximos
    description: >
      ANA-04 (adição): fornecedores ATIVOS do município do caso (vars `caso_municipio`/`caso_uf`) cujo
      CNAE principal ou secundário está em `caso_cnaes_fornecedores`, a até `raio_fornecedores_km` do
      centroide do município (haversine entre centroides da Base dos Dados). Uma linha por
      estabelecimento; `via` indica se casou pelo CNAE principal ou por um secundário.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      contract:
        enforced: true
    columns:
      - name: cnpj_completo
        description: CNPJ de 14 dígitos do fornecedor.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: nome
        description: >
          Nome fantasia ou, na falta, razão social (sem dados de contato, ADR-0008), com o CPF do
          empresário individual/MEI mascarado como `***.***.***-**` (todo trecho de exatamente 11
          dígitos, no fim ou no meio; `mascarar_cpf_no_nome`; ADR-0008, emenda R4-01).
        data_type: varchar
        data_tests: [sem_cpf_no_nome]
      - name: sk_cnae
        description: Chave de `dim_cnae` do CNAE fornecido (R3-20); `-1` se o CNAE não existe na dimensão.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: cnae_fornecido
        description: CNAE (7 dígitos) que qualificou o fornecedor (principal; senão o menor secundário que casa).
        data_type: varchar
        data_tests: [not_null]
      - name: via
        description: "`principal` ou `secundario`."
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: [principal, secundario] }
      - name: sk_municipio
        description: Chave de `dim_municipio` do município do fornecedor (R3-20).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: municipio
        description: Município do fornecedor.
        data_type: varchar
      - name: uf
        description: UF do fornecedor.
        data_type: varchar
      - name: distancia_km
        description: Distância haversine (km, 2 casas) do centroide do município do caso.
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }

  - name: mart_concorrencia_area_mercado
    description: >
      ENR-03 (incremento `enriquecimento_bd`, ADR-0015): concorrência na área de mercado por CNAE
      principal × município: os pares com estabelecimento no município (como
      `mart_concorrencia_municipio`) e os vazios de mercado (P23), isto é, municípios sem o CNAE
      cujos vizinhos ou região metropolitana têm ao menos um ativo (`tem_estabelecimento_local` =
      false, ativos = inativos = 0, indicadores locais 0 com denominador). Traz ativos e inativos
      no município, nos vizinhos (`bridge_municipio_vizinho`) e na região metropolitana (município
      incluído; NULL fora de região metropolitana), e ativos por mil domicílios e por km² (Censo
      2022) do município e da área de mercado (município + vizinhos). Indicador NULL quando falta
      o denominador (município ou algum vizinho sem Censo), nunca zero. Parquet em
      `gold/mart_concorrencia_area_mercado.parquet`.
    config:
      contract:
        enforced: true
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_cnae, sk_municipio]
          config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
    columns:
      - name: sk_cnae
        description: Chave de `dim_cnae`; `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
      - name: desc_cnae_principal
        description: Descrição da subclasse (Base dos Dados).
        data_type: varchar
      - name: sk_municipio
        description: Chave de `dim_municipio`; `-1` para município sem par no BD.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: uf
        description: Sigla da UF.
        data_type: varchar
      - name: nome_regiao_metropolitana
        description: Região metropolitana do município; `NÃO PERTENCE` fora de região metropolitana.
        data_type: varchar
      - name: domicilios_2022
        description: Domicílios do município (Censo 2022); NULL sem dado.
        data_type: bigint
      - name: area_km2
        description: Área do município em km² (Censo 2022); NULL sem dado.
        data_type: double
      - name: tem_estabelecimento_local
        description: >
          true se o município tem ao menos um estabelecimento (ativo ou inativo) do CNAE; false nos
          vazios de mercado (vizinhos ou região metropolitana têm ativo, o município não).
        data_type: boolean
        meta: { incremento: enriquecimento_bd }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos
        description: Estabelecimentos ativos do CNAE no município (0 nos vazios de mercado).
        data_type: bigint
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: inativos
        description: Estabelecimentos inativos do CNAE no município (0 nos vazios de mercado).
        data_type: bigint
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: qtd_vizinhos
        description: Municípios vizinhos do município (0 se nenhum).
        data_type: bigint
      - name: ativos_vizinhos
        description: Estabelecimentos ativos do CNAE nos municípios vizinhos (o município fica fora).
        data_type: bigint
      - name: inativos_vizinhos
        description: Estabelecimentos inativos do CNAE nos municípios vizinhos.
        data_type: bigint
      - name: ativos_regiao_metropolitana
        description: Ativos do CNAE na região metropolitana do município (ele incluído); NULL fora de região metropolitana.
        data_type: bigint
      - name: inativos_regiao_metropolitana
        description: Inativos do CNAE na região metropolitana do município (ele incluído); NULL fora de região metropolitana.
        data_type: bigint
      - name: ativos_por_mil_domicilios
        description: Ativos do município por mil domicílios (6 casas); 0 nos vazios de mercado; NULL sem domicílios.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos_por_km2
        description: Ativos do município por km² (6 casas); 0 nos vazios de mercado; NULL sem área.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos_area_por_mil_domicilios
        description: Ativos do município e dos vizinhos por mil domicílios dos mesmos municípios; NULL se algum não tem Censo.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos_area_por_km2
        description: Ativos do município e dos vizinhos por km² dos mesmos municípios; NULL se algum não tem Censo.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }

unit_tests:
  - name: test_mart_sobrevivencia_coorte_elegibilidade_e_sobrevivencia
    description: >
      ANA-02: coorte 2020 (data_referencia 2026-09-12) é elegível a 1/3/5 anos; X ativo sobrevive sempre,
      Y encerrado após 1 ano só sobrevive a 1a, Z encerrado antes de 1 ano nunca. Coorte 2025 não é
      elegível a nenhum horizonte (censura) e fica com taxas NULL.
    model: mart_sobrevivencia_coorte
    overrides:
      vars:
        data_referencia: "2026-09-12"
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - &fct_base { sk_cnae: 4741500, sk_porte: 1, sk_municipio: 3202207, eh_ativa: true, sk_data_inicio_atividade: 20200101, sk_data_situacao: 20200101 }
          - { <<: *fct_base, eh_ativa: false, sk_data_situacao: 20210601 }
          - { <<: *fct_base, eh_ativa: false, sk_data_situacao: 20200601 }
          - { <<: *fct_base, sk_data_inicio_atividade: 20250301, sk_data_situacao: 20250301 }
      - input: ref('dim_data')
        rows:
          - { sk_data: 20200101, data: "2020-01-01" }
          - { sk_data: 20200601, data: "2020-06-01" }
          - { sk_data: 20210601, data: "2021-06-01" }
          - { sk_data: 20250301, data: "2025-03-01" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1, rotulo_porte: "MICRO" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, sigla_uf: "ES" }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows: []
    expect:
      rows:
        - { ano_coorte: 2020, estabelecimentos: 3, elegiveis_1a: 3, sobreviventes_1a: 2, taxa_1a: 0.6666666666666666, elegiveis_3a: 3, sobreviventes_3a: 1, taxa_3a: 0.3333333333333333, elegiveis_5a: 3, sobreviventes_5a: 1, taxa_5a: 0.3333333333333333 }
        - { ano_coorte: 2025, estabelecimentos: 1, elegiveis_1a: 0, sobreviventes_1a: 0, taxa_1a: null, elegiveis_3a: 0, sobreviventes_3a: 0, taxa_3a: null, elegiveis_5a: 0, sobreviventes_5a: 0, taxa_5a: null }

  - name: test_mart_sobrevivencia_coorte_limites_de_elegibilidade_e_aniversario
    description: >
      ANA-02 (R3-07): fronteiras da regra. Com data_referencia 2026-09-12, a coorte 2023 é elegível a 1 ano
      (31/12/2024 já passou) e NÃO a 3 anos (31/12/2026 é futuro). Um membro baixado exatamente no
      aniversário (dat_inicio + 1 ano, dat_inicio + 3 anos) sobrevive àquele horizonte (>=), mas não ao
      seguinte (a coorte 2020 é elegível a 5 anos).
    model: mart_sobrevivencia_coorte
    overrides:
      vars:
        data_referencia: "2026-09-12"
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - &fct_limite { sk_cnae: 4741500, sk_porte: 1, sk_municipio: 3202207, eh_ativa: false, sk_data_inicio_atividade: 20200310, sk_data_situacao: 20230310 }
          - { <<: *fct_limite, sk_data_inicio_atividade: 20230601, sk_data_situacao: 20240601 }
      - input: ref('dim_data')
        rows:
          - { sk_data: 20200310, data: "2020-03-10" }
          - { sk_data: 20230310, data: "2023-03-10" }
          - { sk_data: 20230601, data: "2023-06-01" }
          - { sk_data: 20240601, data: "2024-06-01" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1, rotulo_porte: "MICRO" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, sigla_uf: "ES" }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows: []
    expect:
      rows:
        - { ano_coorte: 2020, estabelecimentos: 1, elegiveis_1a: 1, sobreviventes_1a: 1, taxa_1a: 1.0, elegiveis_3a: 1, sobreviventes_3a: 1, taxa_3a: 1.0, elegiveis_5a: 1, sobreviventes_5a: 0, taxa_5a: 0.0 }
        - { ano_coorte: 2023, estabelecimentos: 1, elegiveis_1a: 1, sobreviventes_1a: 1, taxa_1a: 1.0, elegiveis_3a: 0, sobreviventes_3a: 0, taxa_3a: null, elegiveis_5a: 0, sobreviventes_5a: 0, taxa_5a: null }

  - name: test_mart_sobrevivencia_coorte_sem_data_de_inicio_fica_fora
    description: >
      ANA-02 (Fix 6 da R4): estabelecimento sem `dat_inicio_atividade` (membro -1 de `dim_data`) ou com
      data inválida (-2) não tem coorte e fica fora de toda linha, inclusive da contagem
      `estabelecimentos`; só o membro com início válido forma a coorte 2020.
    model: mart_sobrevivencia_coorte
    overrides:
      vars:
        data_referencia: "2026-09-12"
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - &fct_sem_inicio { sk_cnae: 4741500, sk_porte: 1, sk_municipio: 3202207, eh_ativa: true, sk_data_inicio_atividade: -1, sk_data_situacao: -1 }
          - { <<: *fct_sem_inicio, eh_ativa: false, sk_data_inicio_atividade: -2, sk_data_situacao: 20200101 }
          - { <<: *fct_sem_inicio, sk_data_inicio_atividade: 20200101, sk_data_situacao: 20200101 }
      - input: ref('dim_data')
        rows:
          - { sk_data: -1, data: null }
          - { sk_data: -2, data: null }
          - { sk_data: 20200101, data: "2020-01-01" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1, rotulo_porte: "MICRO" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, sigla_uf: "ES" }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows: []
    expect:
      rows:
        - { ano_coorte: 2020, estabelecimentos: 1, elegiveis_1a: 1, sobreviventes_1a: 1, taxa_1a: 1.0, elegiveis_3a: 1, sobreviventes_3a: 1, taxa_3a: 1.0, elegiveis_5a: 1, sobreviventes_5a: 1, taxa_5a: 1.0 }

  - name: test_mart_fornecedores_proximos_haversine_e_via
    description: >
      ANA-04: com o caso em (0,0) e raio 150 km, F (CNAE principal, 1 grau de longitude ≈ 111.2 km)
      entra com via principal; H (CNAE secundário, mesmo município do caso) entra com distância 0;
      G (2 graus ≈ 222.4 km) fica fora do raio; I (inativo) é excluído. R3-08: o estabelecimento com o CNAE
      de fornecedor no principal e no secundário sai via principal; o que tem dois secundários que casam
      fica com o menor.
    model: mart_fornecedores_proximos
    overrides:
      vars:
        caso_municipio: "CASO"
        caso_uf: "ES"
        caso_cnaes_fornecedores: ["2071100", "4679699"]
        raio_fornecedores_km: 150
    given:
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 2071100, codigo_subclasse: "2071100" }
          - { sk_cnae: 4679699, codigo_subclasse: "4679699" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 1, nome_municipio: "Caso", sigla_uf: "ES", latitude: 0.0, longitude: 0.0 }
          - { sk_municipio: 2, nome_municipio: "Perto", sigla_uf: "ES", latitude: 0.0, longitude: 1.0 }
          - { sk_municipio: 3, nome_municipio: "Longe", sigla_uf: "ES", latitude: 0.0, longitude: 2.0 }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows:
          - { cnpj_completo: "00000000000001", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000002", cnae_principal: "4711302" }
          - { cnpj_completo: "00000000000003", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000004", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000005", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000006", cnae_principal: "4711302" }
      - input: ref('bridge_estabelecimento_cnae_secundario')
        rows:
          - { cnpj_completo: "00000000000002", codigo_cnae_secundario: "4679699" }
          - { cnpj_completo: "00000000000005", codigo_cnae_secundario: "4679699" }
          - { cnpj_completo: "00000000000006", codigo_cnae_secundario: "4679699" }
          - { cnpj_completo: "00000000000006", codigo_cnae_secundario: "2071100" }
      - input: ref('fct_estabelecimentos')
        rows:
          - { cnpj_completo: "00000000000001", sk_municipio: 2, eh_ativa: true }
          - { cnpj_completo: "00000000000002", sk_municipio: 1, eh_ativa: true }
          - { cnpj_completo: "00000000000003", sk_municipio: 3, eh_ativa: true }
          - { cnpj_completo: "00000000000004", sk_municipio: 2, eh_ativa: false }
          - { cnpj_completo: "00000000000005", sk_municipio: 2, eh_ativa: true }
          - { cnpj_completo: "00000000000006", sk_municipio: 2, eh_ativa: true }
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { cnpj_completo: "00000000000001", cnpj_raiz: "00000000", nome_fantasia: "F" }
          - { cnpj_completo: "00000000000002", cnpj_raiz: "00000000", nome_fantasia: null }
          - { cnpj_completo: "00000000000005", cnpj_raiz: "00000000", nome_fantasia: "P" }
          - { cnpj_completo: "00000000000006", cnpj_raiz: "00000000", nome_fantasia: "S" }
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "00000000", razao_social: "RAZAO" }
    expect:
      rows:
        - { cnpj_completo: "00000000000001", nome: "F", sk_cnae: 2071100, sk_municipio: 2, cnae_fornecido: "2071100", via: "principal", municipio: "Perto", uf: "ES", distancia_km: 111.2 }
        - { cnpj_completo: "00000000000002", nome: "RAZAO", sk_cnae: 4679699, sk_municipio: 1, cnae_fornecido: "4679699", via: "secundario", municipio: "Caso", uf: "ES", distancia_km: 0.0 }
        # R3-08: CNAE de fornecedor no principal e no secundário -> principal; dois secundários -> o menor
        - { cnpj_completo: "00000000000005", nome: "P", sk_cnae: 2071100, sk_municipio: 2, cnae_fornecido: "2071100", via: "principal", municipio: "Perto", uf: "ES", distancia_km: 111.2 }
        - { cnpj_completo: "00000000000006", nome: "S", sk_cnae: 2071100, sk_municipio: 2, cnae_fornecido: "2071100", via: "secundario", municipio: "Perto", uf: "ES", distancia_km: 111.2 }

  - name: test_mart_concorrencia_area_mercado_vizinhos_e_regiao
    description: >
      ENR-03: A (RM X, 1 ativo, 2000 dom., 100 km²) vizinha de B (RM X, 2 ativos, 3000 dom.,
      200 km²) e de C (sem RM, 0 ativos mas 1 inativo, sem Censo). Município: A 0,5 por mil
      domicílios; área de A (A+B) = 3 ativos / 5000 dom.; C sem Censo → indicadores NULL; RM só
      para A e B (ativos 3 = 1 + 2).
    model: mart_concorrencia_area_mercado
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    given:
      - input: ref('mart_concorrencia_municipio')
        rows:
          - { sk_cnae: 1, cnae_principal: "1", desc_cnae_principal: "x", sk_municipio: 10, municipio: "A", uf: "ES", ativos: 1, inativos: 0 }
          - { sk_cnae: 1, cnae_principal: "1", desc_cnae_principal: "x", sk_municipio: 20, municipio: "B", uf: "ES", ativos: 2, inativos: 1 }
          - { sk_cnae: 1, cnae_principal: "1", desc_cnae_principal: "x", sk_municipio: 30, municipio: "C", uf: "ES", ativos: 0, inativos: 1 }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 10, nome_municipio: "A", sigla_uf: "ES", nome_regiao_metropolitana: "RM X", domicilios_2022: 2000, area_km2: 100.0 }
          - { sk_municipio: 20, nome_municipio: "B", sigla_uf: "ES", nome_regiao_metropolitana: "RM X", domicilios_2022: 3000, area_km2: 200.0 }
          - { sk_municipio: 30, nome_municipio: "C", sigla_uf: "ES", nome_regiao_metropolitana: "NÃO PERTENCE", domicilios_2022: null, area_km2: null }
      - input: ref('bridge_municipio_vizinho')
        rows:
          - { sk_municipio: 10, sk_municipio_vizinho: 20 }
          - { sk_municipio: 20, sk_municipio_vizinho: 10 }
          - { sk_municipio: 20, sk_municipio_vizinho: 30 }
          - { sk_municipio: 30, sk_municipio_vizinho: 20 }
    expect:
      rows:
        - { sk_municipio: 10, tem_estabelecimento_local: true, qtd_vizinhos: 1, ativos_vizinhos: 2, inativos_vizinhos: 1, ativos_regiao_metropolitana: 3, inativos_regiao_metropolitana: 1, ativos_por_mil_domicilios: 0.5, ativos_por_km2: 0.01, ativos_area_por_mil_domicilios: 0.6, ativos_area_por_km2: 0.01 }
        - { sk_municipio: 20, tem_estabelecimento_local: true, qtd_vizinhos: 2, ativos_vizinhos: 1, inativos_vizinhos: 1, ativos_regiao_metropolitana: 3, inativos_regiao_metropolitana: 1, ativos_por_mil_domicilios: 0.666667, ativos_por_km2: 0.01, ativos_area_por_mil_domicilios: null, ativos_area_por_km2: null }
        - { sk_municipio: 30, tem_estabelecimento_local: true, qtd_vizinhos: 1, ativos_vizinhos: 2, inativos_vizinhos: 1, ativos_regiao_metropolitana: null, inativos_regiao_metropolitana: null, ativos_por_mil_domicilios: null, ativos_por_km2: null, ativos_area_por_mil_domicilios: null, ativos_area_por_km2: null }

  - name: test_mart_concorrencia_area_mercado_vazio_de_mercado
    description: >
      ENR-03 (P23): CNAE 1 tem ativo só em B (RM X). Os vazios aparecem com 0 local e
      `tem_estabelecimento_local` false: A (vizinho de B e da mesma RM, com Censo → indicador local 0,
      área = 1 ativo / 5000 dom.), D (só da RM X, sem vizinho com o CNAE; sem Censo → NULL) e E
      (sem Censo, vizinho de B → NULL). F (sem vizinho nem RM com o CNAE) fica fora, e o CNAE 2,
      que só tem inativo em B, não cria vazio algum (só ativos contam).
    model: mart_concorrencia_area_mercado
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    given:
      - input: ref('mart_concorrencia_municipio')
        rows:
          - { sk_cnae: 1, cnae_principal: "1", desc_cnae_principal: "x", sk_municipio: 20, municipio: "B", uf: "ES", ativos: 1, inativos: 0 }
          - { sk_cnae: 2, cnae_principal: "2", desc_cnae_principal: "y", sk_municipio: 20, municipio: "B", uf: "ES", ativos: 0, inativos: 3 }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 10, nome_municipio: "A", sigla_uf: "ES", nome_regiao_metropolitana: "RM X", domicilios_2022: 2000, area_km2: 100.0 }
          - { sk_municipio: 20, nome_municipio: "B", sigla_uf: "ES", nome_regiao_metropolitana: "RM X", domicilios_2022: 3000, area_km2: 200.0 }
          - { sk_municipio: 40, nome_municipio: "D", sigla_uf: "ES", nome_regiao_metropolitana: "RM X", domicilios_2022: null, area_km2: null }
          - { sk_municipio: 50, nome_municipio: "E", sigla_uf: "ES", nome_regiao_metropolitana: "NÃO PERTENCE", domicilios_2022: null, area_km2: null }
          - { sk_municipio: 60, nome_municipio: "F", sigla_uf: "ES", nome_regiao_metropolitana: "NÃO PERTENCE", domicilios_2022: 1000, area_km2: 10.0 }
      - input: ref('bridge_municipio_vizinho')
        rows:
          - { sk_municipio: 10, sk_municipio_vizinho: 20 }
          - { sk_municipio: 20, sk_municipio_vizinho: 10 }
          - { sk_municipio: 20, sk_municipio_vizinho: 50 }
          - { sk_municipio: 50, sk_municipio_vizinho: 20 }
    expect:
      rows:
        - { sk_cnae: 1, sk_municipio: 20, tem_estabelecimento_local: true, ativos: 1, inativos: 0, qtd_vizinhos: 2, ativos_vizinhos: 0, ativos_regiao_metropolitana: 1, ativos_por_mil_domicilios: 0.333333, ativos_area_por_mil_domicilios: null }
        - { sk_cnae: 1, sk_municipio: 10, tem_estabelecimento_local: false, ativos: 0, inativos: 0, qtd_vizinhos: 1, ativos_vizinhos: 1, ativos_regiao_metropolitana: 1, ativos_por_mil_domicilios: 0.0, ativos_area_por_mil_domicilios: 0.2 }
        - { sk_cnae: 1, sk_municipio: 40, tem_estabelecimento_local: false, ativos: 0, inativos: 0, qtd_vizinhos: 0, ativos_vizinhos: 0, ativos_regiao_metropolitana: 1, ativos_por_mil_domicilios: null, ativos_area_por_mil_domicilios: null }
        - { sk_cnae: 1, sk_municipio: 50, tem_estabelecimento_local: false, ativos: 0, inativos: 0, qtd_vizinhos: 1, ativos_vizinhos: 1, ativos_regiao_metropolitana: null, ativos_por_mil_domicilios: null, ativos_area_por_mil_domicilios: null }
        - { sk_cnae: 2, sk_municipio: 20, tem_estabelecimento_local: true, ativos: 0, inativos: 3, qtd_vizinhos: 2, ativos_vizinhos: 0, ativos_regiao_metropolitana: 0, ativos_por_mil_domicilios: 0.0, ativos_area_por_mil_domicilios: null }

  - name: test_mart_concorrencia_municipio_densidade_por_10k_e_ranking
    description: >
      RBP-13 (N11): densidade = ativos × 10 000 / população (arredondada a 2 casas); município sem
      população fica sem densidade e sem ranking; `ranking_uf` ordena a densidade dentro da UF e do CNAE.
    model: mart_concorrencia_municipio
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: true }
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: true }
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: true }
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: false }
          - { sk_cnae: 1, sk_municipio: 2, eh_ativa: true }
          - { sk_cnae: 1, sk_municipio: 3, eh_ativa: true }
          - { sk_cnae: 1, sk_municipio: 3, eh_ativa: true }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 1, codigo_subclasse: "4741500", descricao_subclasse: "Tintas" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 1, nome_municipio: "Alfa", sigla_uf: "ES", populacao: 20000 }
          - { sk_municipio: 2, nome_municipio: "Beta", sigla_uf: "ES", populacao: null }
          - { sk_municipio: 3, nome_municipio: "Gama", sigla_uf: "ES", populacao: 30000 }
    expect:
      rows:
        - { sk_municipio: 1, ativos: 3, inativos: 1, populacao: 20000, ativos_por_10k_hab: 1.5, ranking_uf: 1 }
        - { sk_municipio: 2, ativos: 1, inativos: 0, populacao: null, ativos_por_10k_hab: null, ranking_uf: null }
        - { sk_municipio: 3, ativos: 2, inativos: 0, populacao: 30000, ativos_por_10k_hab: 0.67, ranking_uf: 2 }

  - name: test_mart_dinamica_mercado_aberturas_encerramentos_e_saldo
    description: >
      RBP-13: abertura no ano de início; encerramento no ano da situação só de inativos; data sem ano
      (`-1`) não gera evento; `saldo` = aberturas − encerramentos.
    model: mart_dinamica_mercado
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: true, sk_data_inicio_atividade: 20200101, sk_data_situacao: 20200101 }
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: false, sk_data_inicio_atividade: 20200505, sk_data_situacao: 20220301 }
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: false, sk_data_inicio_atividade: 20210101, sk_data_situacao: 20220301 }
          - { sk_cnae: 1, sk_municipio: 1, eh_ativa: true, sk_data_inicio_atividade: -1, sk_data_situacao: -1 }
      - input: ref('dim_data')
        rows:
          - { sk_data: 20200101, ano: 2020 }
          - { sk_data: 20200505, ano: 2020 }
          - { sk_data: 20210101, ano: 2021 }
          - { sk_data: 20220301, ano: 2022 }
          - { sk_data: -1, ano: null }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 1, codigo_subclasse: "4741500", descricao_subclasse: "Tintas" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 1, nome_municipio: "Alfa", sigla_uf: "ES" }
    expect:
      rows:
        - { ano: 2020, aberturas: 2, encerramentos: 0, saldo: 2 }
        - { ano: 2021, aberturas: 1, encerramentos: 0, saldo: 1 }
        - { ano: 2022, aberturas: 0, encerramentos: 2, saldo: -2 }

version: 2

models:
  - name: mart_concorrencia_municipio
    description: >
      Densidade de concorrência por CNAE principal × município. `ativos` e `inativos`
      pela regra do original (`situacao != 2` = inativo); `ativos_por_10k_hab` = ativos × 10 000 /
      população do `ano_populacao` (NULL sem população); `ranking_uf` ordena municípios da mesma UF e
      CNAE pela densidade. Parquet em `gold/mart_concorrencia_municipio.parquet`.
    data_tests:
      # RBP-13: a densidade é por 10 mil habitantes (N11).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(populacao, 0) = 0 or ativos_por_10k_hab = round(ativos * 10000.0 / populacao, 2)"
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnae_principal, sk_municipio]
    config:
      meta: { grao: "CNAE principal × município (`cnae_principal`, `sk_municipio`)" }
      contract:
        enforced: true
    columns:
      - name: sk_cnae
        description: Chave de `dim_cnae`; `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
        data_tests: [not_null]
      - name: desc_cnae_principal
        description: Descrição da subclasse (Base dos Dados).
        data_type: varchar
      - name: sk_municipio
        description: Chave de `dim_municipio`; `-1` para município sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: uf
        description: Sigla da UF do município (`dim_municipio.sigla_uf`; `NI` para município sem par na Base dos Dados).
        data_type: varchar
      - name: populacao
        description: População do município no `ano_populacao`; NULL sem dado.
        data_type: bigint
      - name: ativos
        description: Estabelecimentos ativos (`situacao = 2`) do CNAE no município.
        data_type: bigint
        data_tests: [not_null]
      - name: inativos
        description: Estabelecimentos inativos (`situacao != 2`) do CNAE no município.
        data_type: bigint
        data_tests: [not_null]
      - name: ativos_por_10k_hab
        description: Ativos por 10 mil habitantes (2 casas); NULL quando a população é nula ou zero.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
      - name: ranking_uf
        description: Posição do município na UF para o CNAE por `ativos_por_10k_hab` decrescente (1 = mais denso); NULL sem densidade.
        data_type: bigint

  - name: mart_sobrevivencia_coorte
    description: >
      Sobrevivência por coorte (ano de início da atividade) × CNAE principal × porte × UF,
      a 1, 3 e 5 anos. Elegibilidade pela coorte inteira (`make_date(ano + N, 12, 31) <= data_referencia`);
      sobrevive quem está ativo ou foi encerrado após `dat_inicio + N anos`. Taxa NULL sem elegíveis.
      Invariantes (taxas em [0,1] e monotonicidade) no teste `sobrevivencia_invariantes`.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      meta: { grao: "coorte × CNAE principal × porte × UF (`ano_coorte`, `sk_cnae`, `sk_porte`, `uf`)" }
      contract:
        enforced: true
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    primary_entity: coorte_sobrevivencia
    agg_time_dimension: coorte
    derived_semantics:
      dimensions:
        - name: coorte
          type: time
          granularity: year
          description: Ano de início de atividade da coorte (1º de janeiro).
          expr: make_date(cast(ano_coorte as integer), 1, 1)
    metrics:
      - name: elegiveis_1a
        description: Estabelecimentos da coorte elegíveis ao horizonte de 1 ano(s).
        type: simple
        agg: sum
        expr: elegiveis_1a
        config: { meta: { escopo: adicao } }
      - name: sobreviventes_1a
        description: >
          Elegíveis que seguiam ativos 1 ano(s) depois da abertura: ativos no extrato ou encerrados a partir do
          aniversário de 1 ano(s) da abertura. Não é "ainda ativo".
        type: simple
        agg: sum
        expr: sobreviventes_1a
        config: { meta: { escopo: adicao } }
      - name: taxa_sobrevivencia_1a
        label: Taxa de Sobrevivência 1a
        description: >
          Sobreviventes / elegíveis a 1 ano(s), somando os estratos antes de dividir (não é a média das taxas).
          Sobrevivente = ativo no extrato ou encerrado a partir do aniversário de 1 ano(s), não só "ainda ativo".
        type: ratio
        numerator: sobreviventes_1a
        denominator: elegiveis_1a
        config: { meta: { escopo: adicao } }
      - name: elegiveis_3a
        description: Estabelecimentos da coorte elegíveis ao horizonte de 3 ano(s).
        type: simple
        agg: sum
        expr: elegiveis_3a
        config: { meta: { escopo: adicao } }
      - name: sobreviventes_3a
        description: >
          Elegíveis que seguiam ativos 3 ano(s) depois da abertura: ativos no extrato ou encerrados a partir do
          aniversário de 3 ano(s) da abertura. Não é "ainda ativo".
        type: simple
        agg: sum
        expr: sobreviventes_3a
        config: { meta: { escopo: adicao } }
      - name: taxa_sobrevivencia_3a
        label: Taxa de Sobrevivência 3a
        description: >
          Sobreviventes / elegíveis a 3 ano(s), somando os estratos antes de dividir (não é a média das taxas).
          Sobrevivente = ativo no extrato ou encerrado a partir do aniversário de 3 ano(s), não só "ainda ativo".
        type: ratio
        numerator: sobreviventes_3a
        denominator: elegiveis_3a
        config: { meta: { escopo: adicao } }
      - name: elegiveis_5a
        description: Estabelecimentos da coorte elegíveis ao horizonte de 5 ano(s).
        type: simple
        agg: sum
        expr: elegiveis_5a
        config: { meta: { escopo: adicao } }
      - name: sobreviventes_5a
        description: >
          Elegíveis que seguiam ativos 5 ano(s) depois da abertura: ativos no extrato ou encerrados a partir do
          aniversário de 5 ano(s) da abertura. Não é "ainda ativo".
        type: simple
        agg: sum
        expr: sobreviventes_5a
        config: { meta: { escopo: adicao } }
      - name: taxa_sobrevivencia_5a
        label: Taxa de Sobrevivência 5a
        description: >
          Sobreviventes / elegíveis a 5 ano(s), somando os estratos antes de dividir (não é a média das taxas).
          Sobrevivente = ativo no extrato ou encerrado a partir do aniversário de 5 ano(s), não só "ainda ativo".
        type: ratio
        numerator: sobreviventes_5a
        denominator: elegiveis_5a
        config: { meta: { escopo: adicao } }
    columns:
      - name: ano_coorte
        description: Ano de `dat_inicio_atividade` do estabelecimento.
        data_type: bigint
        data_tests: [not_null]
      - name: sk_cnae
        description: Chave de `dim_cnae`; `-1` para CNAE sem par no BD.
        data_type: integer
        entity: { type: foreign, name: cnae }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
        data_tests: [not_null]
      - name: sk_porte
        description: Chave de `dim_porte`.
        data_type: integer
        entity: { type: foreign, name: porte }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_porte')
                field: sk_porte
      - name: porte
        description: Rótulo do porte (`dim_porte`); NÃO INFORMADO para porte vazio.
        data_type: varchar
      - name: uf
        description: Sigla da UF do município; `NI` para município sem par no BD.
        data_type: varchar
        dimension: categorical
      - name: estabelecimentos
        description: Estabelecimentos do estrato (independente de elegibilidade).
        data_type: bigint
      - name: elegiveis_1a
        description: Estabelecimentos da coorte elegíveis ao horizonte de 1 ano (0 quando a coorte ainda não completou o horizonte).
        data_type: bigint
      - name: sobreviventes_1a
        description: Elegíveis que sobrevivem 1 ano (ativos ou encerrados após `dat_inicio + 1 ano`).
        data_type: bigint
      - name: taxa_1a
        description: sobreviventes_1a / elegiveis_1a; NULL sem elegíveis.
        data_type: double
      - name: elegiveis_3a
        description: Elegíveis ao horizonte de 3 anos.
        data_type: bigint
      - name: sobreviventes_3a
        description: Elegíveis que sobrevivem 3 anos.
        data_type: bigint
      - name: taxa_3a
        description: sobreviventes_3a / elegiveis_3a; NULL sem elegíveis.
        data_type: double
      - name: elegiveis_5a
        description: Elegíveis ao horizonte de 5 anos.
        data_type: bigint
      - name: sobreviventes_5a
        description: Elegíveis que sobrevivem 5 anos.
        data_type: bigint
      - name: taxa_5a
        description: sobreviventes_5a / elegiveis_5a; NULL sem elegíveis.
        data_type: double

  - name: mart_dinamica_mercado
    description: >
      Dinâmica de mercado: aberturas, encerramentos e saldo por ano × CNAE principal × município.
      Abertura = ano de `dat_inicio`; encerramento = ano de `dat_situacao` de inativos (`situacao != 2`).
      Datas nulas não geram evento.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      meta: { grao: "ano × CNAE principal × município (`ano`, `sk_cnae`, `sk_municipio`)" }
      contract:
        enforced: true
    columns:
      - name: ano
        description: Ano calendário do evento (abertura ou encerramento).
        data_type: integer
        data_tests: [not_null]
      - name: sk_cnae
        description: Chave de `dim_cnae`; `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: sk_municipio
        description: Chave de `dim_municipio`; `-1` para município sem par no BD.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
        data_tests: [not_null]
      - name: desc_cnae_principal
        description: Descrição da subclasse (Base dos Dados).
        data_type: varchar
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: uf
        description: Sigla da UF do município (`dim_municipio.sigla_uf`; `NI` para município sem par na Base dos Dados).
        data_type: varchar
      - name: aberturas
        description: Estabelecimentos com início de atividade no ano.
        data_type: bigint
        data_tests: [not_null]
      - name: encerramentos
        description: Estabelecimentos inativos com data da situação no ano.
        data_type: bigint
        data_tests: [not_null]
      - name: saldo
        description: aberturas − encerramentos.
        data_type: bigint
        data_tests: [not_null]

  - name: mart_fornecedores_proximos
    description: >
      Fornecedores próximos: fornecedores ATIVOS do município do caso (vars `caso_municipio`/`caso_uf`) cujo
      CNAE principal ou secundário está em `caso_cnaes_fornecedores`, a até `raio_fornecedores_km` do
      centroide do município (haversine entre centroides da Base dos Dados). Uma linha por
      estabelecimento; `via` indica se casou pelo CNAE principal ou por um secundário.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      meta: { grao: "estabelecimento fornecedor (`cnpj_completo`)" }
      contract:
        enforced: true
    columns:
      - name: cnpj_completo
        description: CNPJ de 14 dígitos do fornecedor.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: nome
        description: >
          Nome fantasia ou, na falta, razão social (sem dados de contato, ADR-0008), com o CPF do
          empresário individual/MEI mascarado como `***.***.***-**` (todo trecho de exatamente 11
          dígitos, no fim ou no meio; `mascarar_cpf_no_nome`; ADR-0008).
        data_type: varchar
        data_tests: [sem_cpf_no_nome]
      - name: sk_cnae
        description: Chave de `dim_cnae` do CNAE fornecido; `-1` se o CNAE não existe na dimensão.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: cnae_fornecido
        description: CNAE (7 dígitos) que qualificou o fornecedor (principal; senão o menor secundário que casa).
        data_type: varchar
        data_tests: [not_null]
      - name: via
        description: "`principal` ou `secundario`."
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: [principal, secundario] }
      - name: sk_municipio
        config: { meta: { membro_desconhecido: false } }
        description: >
          Chave de `dim_municipio` do município do fornecedor. Sem chave `-1`: fornecedor sem município na dimensão ou sem centroide fica de fora do mart.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: municipio
        description: Município do fornecedor.
        data_type: varchar
      - name: uf
        description: Sigla da UF do município do fornecedor (`dim_municipio.sigla_uf`).
        data_type: varchar
      - name: distancia_km
        description: Distância haversine (km, 2 casas) do centroide do município do caso.
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }

  - name: mart_concorrencia_area_mercado
    description: >
      Concorrência na área de mercado (incremento `enriquecimento_bd`, ADR-0015) por CNAE
      principal × município: os pares com estabelecimento no município (como
      `mart_concorrencia_municipio`) e os vazios de mercado, isto é, municípios sem o CNAE
      cujos vizinhos ou região metropolitana têm ao menos um ativo (`tem_estabelecimento_local` =
      false, ativos = inativos = 0, indicadores locais 0 com denominador). Traz ativos e inativos
      no município, nos vizinhos (`bridge_municipio_vizinho`) e na região metropolitana (município
      incluído; NULL fora de região metropolitana), e ativos por mil domicílios e por km² (Censo
      2022) do município e da área de mercado (município + vizinhos). Indicador NULL quando falta
      o denominador (município ou algum vizinho sem Censo), nunca zero. Colunas aditivas do
      incremento `enriquecimento_ibge` (ADR-0022): o polo de compras do município (REGIC 2018) e os
      ativos do CNAE nele (`ativos_no_polo`). Parquet em `gold/mart_concorrencia_area_mercado.parquet`.
    config:
      meta: { grao: "CNAE principal × município (`sk_cnae`, `sk_municipio`), incluindo os vazios de mercado", incremento: enriquecimento_bd }
      contract:
        enforced: true
      tags: [incremento_enriquecimento_bd]
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_cnae, sk_municipio]
          config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
    columns:
      - name: sk_cnae
        description: Chave de `dim_cnae`; `-1` para CNAE sem par no BD.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: cnae_principal
        description: Código da subclasse CNAE (7 dígitos); `-1` para CNAE sem par no BD.
        data_type: varchar
      - name: desc_cnae_principal
        description: Descrição da subclasse (Base dos Dados).
        data_type: varchar
      - name: sk_municipio
        description: Chave de `dim_municipio`; `-1` para município sem par no BD.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: uf
        description: Sigla da UF do município (`dim_municipio.sigla_uf`; `NI` para município sem par na Base dos Dados).
        data_type: varchar
      - name: nome_regiao_metropolitana
        description: Região metropolitana do município; `NÃO PERTENCE` fora de região metropolitana.
        data_type: varchar
      - name: domicilios_2022
        description: Domicílios do município (Censo 2022); NULL sem dado.
        data_type: bigint
      - name: area_km2
        description: Área do município em km² (Censo 2022); NULL sem dado.
        data_type: double
      - name: tem_estabelecimento_local
        description: >
          true se o município tem ao menos um estabelecimento (ativo ou inativo) do CNAE; false nos
          vazios de mercado (vizinhos ou região metropolitana têm ativo, o município não).
        data_type: boolean
        config: { meta: { incremento: enriquecimento_bd } }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos
        description: Estabelecimentos ativos do CNAE no município (0 nos vazios de mercado).
        data_type: bigint
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: inativos
        description: Estabelecimentos inativos do CNAE no município (0 nos vazios de mercado).
        data_type: bigint
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: qtd_vizinhos
        description: Municípios vizinhos do município (0 se nenhum).
        data_type: bigint
      - name: ativos_vizinhos
        description: Estabelecimentos ativos do CNAE nos municípios vizinhos (o município fica fora).
        data_type: bigint
      - name: inativos_vizinhos
        description: Estabelecimentos inativos do CNAE nos municípios vizinhos.
        data_type: bigint
      - name: ativos_regiao_metropolitana
        description: Ativos do CNAE na região metropolitana do município (ele incluído); NULL fora de região metropolitana.
        data_type: bigint
      - name: inativos_regiao_metropolitana
        description: Inativos do CNAE na região metropolitana do município (ele incluído); NULL fora de região metropolitana.
        data_type: bigint
      - name: ativos_por_mil_domicilios
        description: Ativos do município por mil domicílios (6 casas); 0 nos vazios de mercado; NULL sem domicílios.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos_por_km2
        description: Ativos do município por km² (6 casas); 0 nos vazios de mercado; NULL sem área.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos_area_por_mil_domicilios
        description: Ativos do município e dos vizinhos por mil domicílios dos mesmos municípios; NULL se algum não tem Censo.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: ativos_area_por_km2
        description: Ativos do município e dos vizinhos por km² dos mesmos municípios; NULL se algum não tem Censo.
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      # incremento: enriquecimento_ibge (ADR-0022): polo de compras da REGIC 2018
      - name: id_municipio_polo_compras
        description: >
          Código IBGE do polo de compras do município (`dim_municipio.id_municipio_polo_compras`: maior % em móveis e eletroeletrônicos, Q2, da REGIC 2018); NULL sem polo. Incremento `enriquecimento_ibge`.
        data_type: varchar
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.id_municipio_polo_compras`" } }
      - name: nome_municipio_polo_compras
        description: Nome do polo de compras; NULL sem polo. Incremento `enriquecimento_ibge`.
        data_type: varchar
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.nome_municipio_polo_compras`" } }
      - name: pct_compras_no_polo
        description: "% dos deslocamentos do município para comprar móveis e eletroeletrônicos (Q2) que vão ao polo (0–100); NULL sem polo. Incremento `enriquecimento_ibge`."
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.pct_compras_no_polo`" } }
      - name: ativos_no_polo
        description: >
          Ativos do mesmo CNAE no município polo de compras (0 quando o polo não tem o CNAE; NULL sem polo). É a concorrência que o morador encontra onde já costuma comprar bens duráveis. Incremento `enriquecimento_ibge`.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`mart_concorrencia_municipio.ativos` do CNAE em `sk_municipio` = `id_municipio_polo_compras`" } }

  # incremento: enriquecimento_ibge (ADR-0022)
  - name: mart_emprego_setor_municipio
    description: >
      Tamanho real do setor no município (incremento `enriquecimento_ibge`, ADR-0022): o CEMPRE do
      IBGE (unidades locais, pessoal ocupado, assalariados e salários) ao lado dos CNPJs ativos da
      RFB, por município × classe CNAE (5 dígitos). Só os pares em que o CEMPRE tem unidade local ou
      a RFB tem ativo da classe. Os anos são diferentes: o CEMPRE é do `ano_cempre` (hoje 2024) e a
      RFB do mês do gold (`mes_referencia_rfb`). Sigilo do IBGE (`X`) nunca é imputado: o valor fica
      NULL e `tem_sigilo` true; por isso somas de pessoal ocupado e salários sobre classes ou
      municípios **subestimam** o total (as unidades locais nunca são sigilosas). Um CNPJ ativo não é
      uma unidade com gente trabalhando: o CEMPRE conta organizações formais com CNPJ ativo no ano
      e, para empresas, com atividade (RAIS/eSocial ou pesquisas do IBGE), e a RFB conta todo
      cadastro ativo, inclusive MEI e inativos de fato. Parquet em
      `gold/mart_emprego_setor_municipio.parquet`.
    config:
      meta: { grao: "município × classe CNAE de 5 dígitos (`sk_municipio`, `classe_cnae`)", incremento: enriquecimento_ibge }
      contract:
        enforced: true
      tags: [incremento_enriquecimento_ibge]
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_municipio, classe_cnae]
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(unidades_locais_cempre, 0) > 0 or ativos_rfb > 0"
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ativos_rfb_sem_mei <= ativos_rfb"
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      # sigilo nunca imputado: com `X`, o pessoal e a razão pessoal/unidade ficam NULL
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not tem_sigilo or (pessoal_ocupado_cempre is null and pessoal_por_unidade is null)"
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao, incremento: enriquecimento_ibge } }
    primary_entity: emprego_setor_municipio
    agg_time_dimension: mes_rfb
    derived_semantics:
      dimensions:
        - name: mes_rfb
          type: time
          granularity: month
          description: Mês do extrato RFB do gold (1º dia do mês); o CEMPRE é do `ano_cempre`, outro ano.
          expr: strptime(mes_referencia_rfb || '-01', '%Y-%m-%d')::date
    metrics:
      - name: unidades_locais_cempre
        label: Unidades locais (CEMPRE)
        description: >
          Unidades locais de empresas e outras organizações formais (CEMPRE/IBGE, `ano_cempre`) na classe e no
          município. Nunca sigilosas: a soma é exata.
        type: simple
        agg: sum
        expr: unidades_locais_cempre
        config: { meta: { escopo: adicao, incremento: enriquecimento_ibge } }
      - name: pessoal_ocupado_cempre
        label: Pessoal ocupado (CEMPRE)
        description: >
          Pessoal ocupado total em 31/12 do `ano_cempre` (CEMPRE/IBGE). Células com sigilo ficam fora da soma
          (nunca imputadas): o total de vários municípios ou classes subestima o real.
        type: simple
        agg: sum
        expr: pessoal_ocupado_cempre
        config: { meta: { escopo: adicao, incremento: enriquecimento_ibge } }
      - name: ativos_rfb
        label: Ativos RFB (CEMPRE × RFB)
        description: >
          Estabelecimentos ativos na RFB (mês do gold) cuja subclasse principal é da classe, nos pares do mart
          CEMPRE × RFB; inclui MEI. Mesmo número de `qtd_ativos` somado por classe no mês corrente.
        type: simple
        agg: sum
        expr: ativos_rfb
        config: { meta: { escopo: adicao, incremento: enriquecimento_ibge } }
    columns:
      - name: sk_municipio
        description: Chave de `dim_municipio` (nunca -1).
        data_type: integer
        entity: { type: foreign, name: municipio }
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.sk_municipio` (CEMPRE por `id_municipio_ibge`; RFB por `fct_estabelecimentos.sk_municipio`)", membro_desconhecido: false } }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: id_municipio_ibge
        description: Código IBGE do município (7 dígitos).
        data_type: varchar
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.id_municipio_ibge`" } }
      - name: municipio
        description: Nome do município (acentuado, Base dos Dados); na camada semântica, use `municipio__nome_municipio`.
        data_type: varchar
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.nome_municipio`" } }
      - name: uf
        description: Sigla da UF do município.
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.sigla_uf`" } }
      - name: classe_cnae
        description: >
          Código da classe CNAE 2.0 (5 dígitos, sem pontuação, como `dim_cnae.codigo_classe`; `47415` = 47.41-5).
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_classe.classe_cnae` ou `dim_cnae.codigo_classe` da subclasse dos ativos" } }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: descricao_classe
        description: Descrição da classe CNAE (`dim_cnae.descricao_classe`); NULL se a classe não está na Base dos Dados.
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_cnae.descricao_classe`" } }
      - name: ano_cempre
        description: Ano de referência do CEMPRE (o mais recente baixado; hoje 2024). Diferente do mês da RFB.
        data_type: integer
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "maior `stg_ibge__cempre_municipio_classe.ano`" } }
      - name: unidades_locais_cempre
        description: Unidades locais da classe no município (CEMPRE, variável 706); 0 se o IBGE publica `-`; NULL sem CEMPRE do município.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_classe.unidades_locais`" } }
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: pessoal_ocupado_cempre
        description: Pessoal ocupado total da classe no município (CEMPRE, 707); NULL com sigilo (`tem_sigilo`) ou sem dado.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_classe.pessoal_ocupado`" } }
      - name: pessoal_assalariado_cempre
        description: Pessoal ocupado assalariado da classe no município (CEMPRE, 708); NULL com sigilo ou sem dado.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_classe.pessoal_assalariado`" } }
      - name: salarios_mil_reais
        description: Salários e outras remunerações da classe no município (CEMPRE, 662, R$ mil, nominais do ano); NULL com sigilo ou sem dado.
        data_type: decimal(18, 3)
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_classe.salarios_mil_reais`" } }
      - name: tem_sigilo
        description: true se alguma variável da célula veio com `X` (sigilo do IBGE); o valor fica NULL, nunca imputado.
        data_type: boolean
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_classe.tem_sigilo`; false nos pares só da RFB" } }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: ativos_rfb
        description: Estabelecimentos ativos na RFB (mês do gold) cuja subclasse principal é da classe; inclui MEI.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "contagem de `fct_estabelecimentos` com `eh_ativa`, por `sk_municipio` e `dim_cnae.codigo_classe`" } }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: ativos_rfb_sem_mei
        description: Ativos da classe na RFB sem os de empresa optante pelo MEI (`opcao_mei`).
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "contagem de `fct_estabelecimentos` com `eh_ativa` e `not opcao_mei`" } }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: pessoal_por_unidade
        description: Pessoal ocupado por unidade local (2 casas); NULL com sigilo, sem unidade ou sem dado.
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`pessoal_ocupado_cempre` ÷ `unidades_locais_cempre`, só sem sigilo" } }
      - name: razao_unidades_cempre_ativos_rfb
        description: >
          Unidades locais do CEMPRE por ativo da RFB (4 casas); NULL sem ativo. Abaixo de 1, há mais CNPJs ativos que
          unidades com atividade; acima de 1, o CEMPRE vê unidades que a RFB classifica em outra classe (ou o
          cadastro defasado). Anos diferentes: leia como ordem de grandeza.
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`unidades_locais_cempre` ÷ `ativos_rfb`" } }
      - name: mes_referencia_rfb
        description: Mês do extrato RFB (`AAAA-MM`) dos ativos; o CEMPRE é de `ano_cempre`, outro ano.
        data_type: varchar
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "maior `stg_rfb__estabelecimentos._mes_referencia`" } }

unit_tests:
  - name: test_mart_sobrevivencia_coorte_elegibilidade_e_sobrevivencia
    description: >
      ANA-02: coorte 2020 (data_referencia 2026-09-12) é elegível a 1/3/5 anos; X ativo sobrevive sempre,
      Y encerrado após 1 ano só sobrevive a 1a, Z encerrado antes de 1 ano nunca. Coorte 2025 não é
      elegível a nenhum horizonte (censura) e fica com taxas NULL.
    model: mart_sobrevivencia_coorte
    overrides:
      vars:
        data_referencia: "2026-09-12"
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - &fct_base { sk_cnae: 4741500, sk_porte: 1, sk_municipio: 3202207, eh_ativa: true, sk_data_inicio_atividade: 20200101, sk_data_situacao: 20200101 }
          - { <<: *fct_base, eh_ativa: false, sk_data_situacao: 20210601 }
          - { <<: *fct_base, eh_ativa: false, sk_data_situacao: 20200601 }
          - { <<: *fct_base, sk_data_inicio_atividade: 20250301, sk_data_situacao: 20250301 }
      - input: ref('dim_data')
        rows:
          - { sk_data: 20200101, data: "2020-01-01" }
          - { sk_data: 20200601, data: "2020-06-01" }
          - { sk_data: 20210601, data: "2021-06-01" }
          - { sk_data: 20250301, data: "2025-03-01" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1, rotulo_porte: "MICRO" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, sigla_uf: "ES" }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows: []
    expect:
      rows:
        - { ano_coorte: 2020, estabelecimentos: 3, elegiveis_1a: 3, sobreviventes_1a: 2, taxa_1a: 0.6666666666666666, elegiveis_3a: 3, sobreviventes_3a: 1, taxa_3a: 0.3333333333333333, elegiveis_5a: 3, sobreviventes_5a: 1, taxa_5a: 0.3333333333333333 }
        - { ano_coorte: 2025, estabelecimentos: 1, elegiveis_1a: 0, sobreviventes_1a: 0, taxa_1a: null, elegiveis_3a: 0, sobreviventes_3a: 0, taxa_3a: null, elegiveis_5a: 0, sobreviventes_5a: 0, taxa_5a: null }

  - name: test_mart_sobrevivencia_coorte_limites_de_elegibilidade_e_aniversario
    description: >
      ANA-02 (R3-07): fronteiras da regra. Com data_referencia 2026-09-12, a coorte 2023 é elegível a 1 ano
      (31/12/2024 já passou) e NÃO a 3 anos (31/12/2026 é futuro). Um membro baixado exatamente no
      aniversário (dat_inicio + 1 ano, dat_inicio + 3 anos) sobrevive àquele horizonte (>=), mas não ao
      seguinte (a coorte 2020 é elegível a 5 anos).
    model: mart_sobrevivencia_coorte
    overrides:
      vars:
        data_referencia: "2026-09-12"
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - &fct_limite { sk_cnae: 4741500, sk_porte: 1, sk_municipio: 3202207, eh_ativa: false, sk_data_inicio_atividade: 20200310, sk_data_situacao: 20230310 }
          - { <<: *fct_limite, sk_data_inicio_atividade: 20230601, sk_data_situacao: 20240601 }
      - input: ref('dim_data')
        rows:
          - { sk_data: 20200310, data: "2020-03-10" }
          - { sk_data: 20230310, data: "2023-03-10" }
          - { sk_data: 20230601, data: "2023-06-01" }
          - { sk_data: 20240601, data: "2024-06-01" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1, rotulo_porte: "MICRO" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, sigla_uf: "ES" }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows: []
    expect:
      rows:
        - { ano_coorte: 2020, estabelecimentos: 1, elegiveis_1a: 1, sobreviventes_1a: 1, taxa_1a: 1.0, elegiveis_3a: 1, sobreviventes_3a: 1, taxa_3a: 1.0, elegiveis_5a: 1, sobreviventes_5a: 0, taxa_5a: 0.0 }
        - { ano_coorte: 2023, estabelecimentos: 1, elegiveis_1a: 1, sobreviventes_1a: 1, taxa_1a: 1.0, elegiveis_3a: 0, sobreviventes_3a: 0, taxa_3a: null, elegiveis_5a: 0, sobreviventes_5a: 0, taxa_5a: null }

  - name: test_mart_sobrevivencia_coorte_sem_data_de_inicio_fica_fora
    description: >
      ANA-02 (Fix 6 da R4): estabelecimento sem `dat_inicio_atividade` (membro -1 de `dim_data`) ou com
      data inválida (-2) não tem coorte e fica fora de toda linha, inclusive da contagem
      `estabelecimentos`; só o membro com início válido forma a coorte 2020.
    model: mart_sobrevivencia_coorte
    overrides:
      vars:
        data_referencia: "2026-09-12"
    given:
      - input: ref('fct_estabelecimentos')
        rows:
          - &fct_sem_inicio { sk_cnae: 4741500, sk_porte: 1, sk_municipio: 3202207, eh_ativa: true, sk_data_inicio_atividade: -1, sk_data_situacao: -1 }
          - { <<: *fct_sem_inicio, eh_ativa: false, sk_data_inicio_atividade: -2, sk_data_situacao: 20200101 }
          - { <<: *fct_sem_inicio, sk_data_inicio_atividade: 20200101, sk_data_situacao: 20200101 }
      - input: ref('dim_data')
        rows:
          - { sk_data: -1, data: null }
          - { sk_data: -2, data: null }
          - { sk_data: 20200101, data: "2020-01-01" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1, rotulo_porte: "MICRO" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, sigla_uf: "ES" }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows: []
    expect:
      rows:
        - { ano_coorte: 2020, estabelecimentos: 1, elegiveis_1a: 1, sobreviventes_1a: 1, taxa_1a: 1.0, elegiveis_3a: 1, sobreviventes_3a: 1, taxa_3a: 1.0, elegiveis_5a: 1, sobreviventes_5a: 1, taxa_5a: 1.0 }

  - name: test_mart_fornecedores_proximos_haversine_e_via
    description: >
      ANA-04: com o caso em (0,0) e raio 150 km, F (CNAE principal, 1 grau de longitude ≈ 111.2 km)
      entra com via principal; H (CNAE secundário, mesmo município do caso) entra com distância 0;
      G (2 graus ≈ 222.4 km) fica fora do raio; I (inativo) é excluído. R3-08: o estabelecimento com o CNAE
      de fornecedor no principal e no secundário sai via principal; o que tem dois secundários que casam
      fica com o menor.
    model: mart_fornecedores_proximos
    overrides:
      vars:
        caso_municipio: "CASO"
        caso_uf: "ES"
        caso_cnaes_fornecedores: ["2071100", "4679699"]
        raio_fornecedores_km: 150
    given:
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 2071100, codigo_subclasse: "2071100" }
          - { sk_cnae: 4679699, codigo_subclasse: "4679699" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 1, nome_municipio: "Caso", sigla_uf: "ES", latitude: 0.0, longitude: 0.0 }
          - { sk_municipio: 2, nome_municipio: "Perto", sigla_uf: "ES", latitude: 0.0, longitude: 1.0 }
          - { sk_municipio: 3, nome_municipio: "Longe", sigla_uf: "ES", latitude: 0.0, longitude: 2.0 }
      - input: ref('int_estabelecimentos__enriquecidos')
        rows:
          - { cnpj_completo: "00000000000001", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000002", cnae_principal: "4711302" }
          - { cnpj_completo: "00000000000003", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000004", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000005", cnae_principal: "2071100" }
          - { cnpj_completo: "00000000000006", cnae_principal: "4711302" }
      - input: ref('bridge_estabelecimento_cnae_secundario')
        rows:
          - { cnpj_completo: "00000000000002", codigo_cnae_secundario: "4679699" }
          - { cnpj_completo: "00000000000005", codigo_cnae_secundario: "4679699" }
          - { cnpj_completo: "00000000000006", codigo_cnae_secundario: "4679699" }
          - { cnpj_completo: "00000000000006", codigo_cnae_secundario: "2071100" }

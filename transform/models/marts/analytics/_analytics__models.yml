      - input: ref('dim_data')
        rows:
          - { sk_data: 20200101, ano: 2020 }
          - { sk_data: 20200505, ano: 2020 }
          - { sk_data: 20210101, ano: 2021 }
          - { sk_data: 20220301, ano: 2022 }
          - { sk_data: -1, ano: null }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 1, codigo_subclasse: "4741500", descricao_subclasse: "Tintas" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 1, nome_municipio: "Alfa", sigla_uf: "ES" }

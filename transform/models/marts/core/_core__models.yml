  # incremento: enriquecimento_ibge (ADR-0022)
  - name: test_int_regic_destinos_compras_posto_empate_e_outros
    description: >
      Formato longo da REGIC nos temas Q1 e Q2: ligação com % 0 sai; em Q2, B e C empatam em 40 e o
      posto 1 fica com o menor código (B); "Outros" (60 em Q1, maior que todos) fica sem posto, e o
      posto 1 de Q1 é o maior destino listado (C). Os demais temas (Q3…) não entram.
    model: int_regic__destinos_compras
    config:
      meta: { incremento: enriquecimento_ibge }
      tags: [incremento_enriquecimento_ibge]
    given:
      - input: ref('stg_ibge__regic_ligacoes')
        rows:
          - { id_municipio_origem: "A", id_municipio_destino: "C", destino_outros: false, pct_vestuario_calcados: 30.0, pct_moveis_eletro: 40.0, pct_saude_baixa_media_complexidade: 90.0 }
          - { id_municipio_origem: "A", id_municipio_destino: "B", destino_outros: false, pct_vestuario_calcados: 10.0, pct_moveis_eletro: 40.0 }
          - { id_municipio_origem: "A", id_municipio_destino: "D", destino_outros: false, pct_vestuario_calcados: 0.0, pct_moveis_eletro: 0.0 }
          - { id_municipio_origem: "A", id_municipio_destino: null, destino_outros: true, pct_vestuario_calcados: 60.0, pct_moveis_eletro: 20.0 }
    expect:
      rows:
        - { id_municipio_origem: "A", id_municipio_destino: "C", eh_outros: false, tema: "vestuario_calcados", pct: 30.0, posto: 1 }
        - { id_municipio_origem: "A", id_municipio_destino: "B", eh_outros: false, tema: "vestuario_calcados", pct: 10.0, posto: 2 }
        - { id_municipio_origem: "A", id_municipio_destino: null, eh_outros: true, tema: "vestuario_calcados", pct: 60.0, posto: null }
        - { id_municipio_origem: "A", id_municipio_destino: "B", eh_outros: false, tema: "moveis_eletro", pct: 40.0, posto: 1 }
        - { id_municipio_origem: "A", id_municipio_destino: "C", eh_outros: false, tema: "moveis_eletro", pct: 40.0, posto: 2 }
        - { id_municipio_origem: "A", id_municipio_destino: null, eh_outros: true, tema: "moveis_eletro", pct: 20.0, posto: null }

  - name: test_int_municipios_perfil_ibge_polo_va_e_fontes
    description: >
      Polo de compras = posto 1 em móveis e eletroeletrônicos (Q2), não em vestuário (Q1): Fundão
      compra móveis em Serra (45) e roupa em Vitória (60). Sem ligação (Linhares), polo NULL. `ano_va`
      = 2021, o último ano com as quatro aberturas, mesmo com PIB total de 2023 (independente de
      `ano_pib`); participações sobre a soma das aberturas. Renda, REGIC e CEMPRE (ano mais recente)
      passam; município sem fonte fica NULL.

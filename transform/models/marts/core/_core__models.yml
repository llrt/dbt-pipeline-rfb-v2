version: 2

models:
  - name: int_municipios__conformados
    config:
      meta: { grao: "município IBGE (`sk_municipio`)" }
    description: >
      Município conformado (Base dos Dados + população do `ano_populacao` + PIB do último ano), uma
      linha por município IBGE. Base de `dim_municipio`; não inclui o membro `-1`.
    columns:
      - name: sk_municipio
        description: Código IBGE como inteiro (chave substituta determinística).
        data_tests: [unique, not_null]
      - name: codigo_rfb
        description: Código RFB do município; único (duplicata multiplicaria linhas da fato).
        data_tests:
          - unique:
              config: { severity: warn, store_failures: true }
      - name: id_municipio_ibge
        description: Código IBGE do município (7 dígitos, texto); chave natural da Base dos Dados.
      - name: nome_municipio
        description: Nome do município, acentuado.
      - name: sigla_uf
        description: Sigla da UF do município.
      - name: nome_uf
        description: Nome completo da UF.
      - name: nome_regiao
        description: Nome da grande região (Norte, Nordeste, Sudeste, Sul, Centro-Oeste).
      - name: id_mesorregiao
        description: Código IBGE da mesorregião.
      - name: nome_mesorregiao
        description: Nome da mesorregião.
      - name: id_microrregiao
        description: Código IBGE da microrregião.
      - name: nome_microrregiao
        description: Nome da microrregião.
      - name: id_regiao_intermediaria
        description: Código IBGE da região geográfica intermediária.
      - name: nome_regiao_intermediaria
        description: Nome da região geográfica intermediária.
      - name: id_regiao_imediata
        description: Código IBGE da região geográfica imediata.
      - name: nome_regiao_imediata
        description: Nome da região geográfica imediata.
      - name: latitude
        description: Latitude do centroide do município (graus decimais).
      - name: longitude
        description: Longitude do centroide do município (graus decimais).
      - name: ano_populacao
        description: Ano da população usada (var `ano_populacao` ou o último ano disponível); NULL sem dado.
      - name: populacao
        description: População estimada do município no `ano_populacao`; NULL sem dado.
      - name: ano_pib
        description: Último ano com PIB disponível; NULL sem dado.
      - name: pib
        description: PIB do município (R$) em `ano_pib`; NULL sem dado.

  - name: dim_municipio
    description: >
      Dimensão de município (ADR-0013). Chave `sk_municipio` inteira determinística, hierarquias
      geográficas em colunas, centroide, população e PIB. Membro `-1` "NÃO INFORMADO" para
      estabelecimentos sem município na Base dos Dados (exterior, município criado após a base).
      Incremento `enriquecimento_bd`: Censo 2022 e região metropolitana. Incremento
      `enriquecimento_ibge` (ADR-0022): renda per capita do Censo 2022, valor adicionado por
      atividade (`ano_va`, que pode diferir de `ano_pib`), hierarquia urbana, índice de atração e
      polo de compras da REGIC 2018 e o total do CEMPRE (`ano_cempre`); NULL sem a fonte.
    config:
      meta: { grao: "município (`sk_municipio`), mais o membro `-1`" }
      contract:
        enforced: true
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    columns:
      - name: sk_municipio
        config: { meta: { linhagem: "`int_municipios__conformados.sk_municipio`" } }
        description: >
          Chave substituta inteira (código IBGE do município); `-1` é o membro NÃO INFORMADO. Determinística: não depende da ordem de carga.
        data_type: integer
        entity: { type: primary, name: municipio }
        data_tests: [unique, not_null]
      - name: id_municipio_ibge
        description: >
          Código IBGE do município (7 dígitos). Linhagem: `stg_bd__municipios.id_municipio`.
        data_type: varchar
        dimension: categorical
      - name: codigo_rfb
        description: >
          Código do município na RFB (4 dígitos), usado para casar com os estabelecimentos. Linhagem: `stg_bd__municipios.id_municipio_rf`.
        data_type: varchar
        data_tests:
          # warn: a BD atual (API downloadTable) traz município novo sem código RFB (ex.: Boa
          # Esperança do Norte/MT, 5101837); ele fica na dimensão, só não casa com estabelecimentos.
          - not_null:
              config: { severity: warn, store_failures: true }
          - unique:
              config: { severity: warn, store_failures: true }
      - name: nome_municipio
        config: { meta: { linhagem: "`int_municipios__conformados.nome_municipio`" } }
        description: >
          Nome do município (acentuado, Base dos Dados).
        data_type: varchar
        dimension: categorical
      - name: sigla_uf
        config: { meta: { linhagem: "`int_municipios__conformados.sigla_uf`" } }
        description: >
          Sigla da UF do município.
        data_type: varchar
        dimension: categorical
      - name: nome_uf
        config: { meta: { linhagem: "`int_municipios__conformados.nome_uf`" } }
        description: >
          Nome completo da UF do município (por exemplo, `Espírito Santo`), da Base dos Dados; `NÃO INFORMADO` no membro `-1`.
        data_type: varchar
        dimension: categorical
      - name: nome_regiao
        config: { meta: { linhagem: "`int_municipios__conformados.nome_regiao`" } }
        description: >
          Nome da grande região (Norte, Nordeste, Sudeste, Sul, Centro-Oeste).
        data_type: varchar
        dimension: categorical
      - name: id_mesorregiao
        config: { meta: { linhagem: "`int_municipios__conformados.id_mesorregiao`" } }
        description: >
          Código IBGE da mesorregião.
        data_type: varchar
      - name: nome_mesorregiao
        config: { meta: { linhagem: "`int_municipios__conformados.nome_mesorregiao`" } }
        description: >
          Nome da mesorregião (nível da hierarquia UF → mesorregião → microrregião → município).
        data_type: varchar
        dimension: categorical
      - name: id_microrregiao
        config: { meta: { linhagem: "`int_municipios__conformados.id_microrregiao`" } }
        description: >
          Código IBGE da microrregião.
        data_type: varchar
      - name: nome_microrregiao
        config: { meta: { linhagem: "`int_municipios__conformados.nome_microrregiao`" } }
        description: >
          Nome da microrregião.
        data_type: varchar
        dimension: categorical
      - name: id_regiao_intermediaria
        config: { meta: { linhagem: "`int_municipios__conformados.id_regiao_intermediaria`" } }
        description: >
          Código IBGE da região geográfica intermediária.
        data_type: varchar
      - name: nome_regiao_intermediaria
        config: { meta: { linhagem: "`int_municipios__conformados.nome_regiao_intermediaria`" } }
        description: >
          Nome da região geográfica intermediária (hierarquia alternativa: intermediária → imediata).
        data_type: varchar
        dimension: categorical
      - name: id_regiao_imediata
        config: { meta: { linhagem: "`int_municipios__conformados.id_regiao_imediata`" } }
        description: >
          Código IBGE da região geográfica imediata.
        data_type: varchar
      - name: nome_regiao_imediata
        config: { meta: { linhagem: "`int_municipios__conformados.nome_regiao_imediata`" } }
        description: >
          Nome da região geográfica imediata.
        data_type: varchar
        dimension: categorical
      - name: latitude
        config: { meta: { linhagem: "`int_municipios__conformados.latitude`" } }
        description: >
          Latitude do centroide do município (graus decimais).
        data_type: double
      - name: longitude
        config: { meta: { linhagem: "`int_municipios__conformados.longitude`" } }
        description: >
          Longitude do centroide do município (graus decimais).
        data_type: double
      - name: ano_populacao
        config: { meta: { linhagem: "`int_municipios__conformados.ano_populacao`" } }
        description: >
          Ano da população usada: var `ano_populacao` ou o último ano disponível.
        data_type: integer
      - name: populacao
        config: { meta: { linhagem: "`int_municipios__conformados.populacao`" } }
        description: >
          População estimada do município no `ano_populacao`; NULL sem dado.
        data_type: bigint
      - name: ano_pib
        config: { meta: { linhagem: "`int_municipios__conformados.ano_pib`" } }
        description: >
          Ano do PIB usado (último ano disponível).
        data_type: integer
      - name: pib
        config: { meta: { linhagem: "`int_municipios__conformados.pib`" } }
        description: >
          PIB do município (R$) em `ano_pib`; NULL sem dado.
        data_type: double
      - name: populacao_censo_2022
        description: >
          População residente do Censo 2022; NULL sem dado do Censo.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.populacao`"} }
      - name: domicilios_2022
        description: >
          Domicílios do Censo 2022 (denominador de ativos por mil domicílios); NULL sem dado.
        data_type: bigint
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.domicilios`"} }
      - name: area_km2
        description: >
          Área territorial do município em km² (Censo 2022); NULL sem dado.
        data_type: double
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.area_km2`"} }
      - name: densidade_hab_km2
        description: >
          População do Censo 2022 por km² (2 casas); NULL sem Censo ou sem área, nunca zero.
        data_type: double
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.populacao` ÷ `stg_bd__censo_2022_municipio.area_km2`, arredondado a 2 casas"} }
      - name: taxa_alfabetizacao
        description: >
          Taxa de alfabetização do Censo 2022 (fração de 0 a 1).
        data_type: double
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.taxa_alfabetizacao`"} }
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: idade_mediana
        description: >
          Idade mediana em anos (Censo 2022).
        data_type: double
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.idade_mediana`"} }
      - name: indice_envelhecimento
        description: >
          Índice de envelhecimento (idosos por 100 jovens) do Censo 2022.
        data_type: double
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.indice_envelhecimento`"} }
      - name: razao_sexo
        description: >
          Razão de sexo (homens por 100 mulheres) do Censo 2022.
        data_type: double
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__censo_2022_municipio.razao_sexo`"} }
      - name: nome_regiao_metropolitana
        description: >
          Região metropolitana do município (GeoBR 2017); `NÃO PERTENCE` quando em nenhuma; `NÃO INFORMADO` no membro -1.
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_bd, linhagem: "`stg_bd__regioes_metropolitanas.nome_regiao_metropolitana`; `NÃO PERTENCE` quando o município não consta"} }
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }

      # incremento: enriquecimento_ibge (ADR-0022) — linhagem: `int_municipios__perfil_ibge`
      - name: renda_per_capita_media_2022
        description: >
          Rendimento domiciliar per capita médio (R$, nominal de 2022) do Censo 2022 (incremento `enriquecimento_ibge`); NULL sem dado e no membro -1.
        data_type: decimal(12, 2)
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__renda_municipio.renda_per_capita_media` (ano 2022)" } }
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: renda_per_capita_mediana_2022
        description: >
          Rendimento domiciliar per capita mediano (R$, nominal de 2022) do Censo 2022 (incremento `enriquecimento_ibge`); NULL sem dado: a 10295 publicada tem valor numérico nos 5.570 municípios; um símbolo do IBGE (`...`) viraria NULL.
        data_type: decimal(12, 2)
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__renda_municipio.renda_per_capita_mediana` (ano 2022)" } }
      - name: moradores_renda_2022
        description: >
          Moradores em domicílios particulares permanentes ocupados, a base da renda per capita do Censo 2022 (incremento `enriquecimento_ibge`).
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__renda_municipio.moradores` (ano 2022)" } }
      - name: ano_va
        description: >
          Ano do valor adicionado (VA) por atividade: o último ano com as quatro aberturas preenchidas no PIB dos Municípios (hoje 2021), independente de `ano_pib` — o PIB total e o VA podem ser de anos diferentes (incremento `enriquecimento_ibge`).
        data_type: integer
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "maior `stg_bd__pib.ano` com `va_agropecuaria`, `va_industria`, `va_servicos` e `va_adespss` preenchidos" } }
      - name: va_agropecuaria
        description: >
          Valor adicionado bruto da agropecuária (R$, preços correntes) em `ano_va` (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_bd__pib.va_agropecuaria` em `ano_va`" } }
      - name: va_industria
        description: >
          Valor adicionado bruto da indústria (R$, preços correntes) em `ano_va` (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_bd__pib.va_industria` em `ano_va`" } }
      - name: va_servicos
        description: >
          Valor adicionado bruto dos serviços, exceto administração pública (R$, preços correntes) em `ano_va` (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_bd__pib.va_servicos` em `ano_va`" } }
      - name: va_adm_publica
        description: >
          Valor adicionado bruto da administração, defesa, educação e saúde públicas e seguridade social (R$, preços correntes) em `ano_va` (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_bd__pib.va_adespss` em `ano_va`" } }
      - name: pct_va_agropecuaria
        description: >
          Participação da agropecuária na soma das quatro aberturas do VA (2 casas; 0–100, salvo quando alguma abertura é negativa, o que o IBGE publica); NULL sem VA (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`va_agropecuaria` × 100 ÷ (`va_agropecuaria` + `va_industria` + `va_servicos` + `va_adm_publica`)" } }
        # Só sem abertura negativa: o IBGE publica VA negativo (no real, a indústria de Cachoeira
        # Dourada/GO em 2021), e aí as participações saem de 0–100 sem erro.
        data_tests: &faixa_pct_va
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 100 }
              config: { where: "va_agropecuaria >= 0 and va_industria >= 0 and va_servicos >= 0 and va_adm_publica >= 0", meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: pct_va_industria
        description: >
          Participação da indústria na soma das quatro aberturas do VA (2 casas; 0–100, salvo quando alguma abertura é negativa, o que o IBGE publica); NULL sem VA (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`va_industria` × 100 ÷ soma das quatro aberturas" } }
        data_tests: *faixa_pct_va
      - name: pct_va_servicos
        description: >
          Participação dos serviços (exceto administração pública) na soma das quatro aberturas do VA (2 casas; 0–100, salvo quando alguma abertura é negativa, o que o IBGE publica); NULL sem VA (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`va_servicos` × 100 ÷ soma das quatro aberturas" } }
        data_tests: *faixa_pct_va
      - name: pct_va_adm_publica
        description: >
          Participação da administração pública na soma das quatro aberturas do VA (2 casas; 0–100, salvo quando alguma abertura é negativa, o que o IBGE publica); NULL sem VA (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`va_adm_publica` × 100 ÷ soma das quatro aberturas" } }
        data_tests: *faixa_pct_va
      - name: regic_hierarquia_codigo
        description: >
          Código do nível na hierarquia urbana da REGIC 2018 (`1A` Grande Metrópole Nacional … `5` Centro Local); NULL sem dado (incremento `enriquecimento_ibge`).
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_hierarquia.codigo_hierarquia`" } }
      - name: regic_hierarquia
        description: >
          Nome do nível na hierarquia urbana da REGIC 2018 (Metrópole, Capital Regional, Centro Sub-Regional, Centro de Zona, Centro Local…); integrante de arranjo populacional herda o nível do arranjo (incremento `enriquecimento_ibge`).
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_hierarquia.nome_hierarquia`" } }
      - name: regic_arranjo_populacional
        description: >
          Arranjo populacional da REGIC 2018 de que o município faz parte; NULL quando é município isolado (incremento `enriquecimento_ibge`).
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_hierarquia.nome_arranjo_populacional`" } }
      - name: regic_regiao_influencia
        description: >
          Cidade (ou arranjo) de vinculação imediata do município na rede urbana da REGIC 2018 (incremento `enriquecimento_ibge`).
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_hierarquia.regiao_influencia`" } }
      - name: regic_indice_atracao
        description: >
          Índice de atração geral da REGIC 2018 (deslocamentos recebidos de outros municípios); NULL quando o município não é destino de nenhuma ligação (incremento `enriquecimento_ibge`).
        data_type: double
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_atracao.indice_atracao`" } }
      - name: id_municipio_polo_compras
        description: >
          Código IBGE do polo de compras: o destino listado na REGIC 2018 com o maior % dos deslocamentos para comprar móveis e eletroeletrônicos (Q2, a melhor proxy de bem durável e material de construção). O destino "Outros" nunca é polo; empate fica com o menor código; NULL sem ligação com Q2 > 0 (incremento `enriquecimento_ibge`).
        data_type: varchar
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`int_regic__destinos_compras.id_municipio_destino` com `tema` = `moveis_eletro` e `posto` = 1" } }
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio_ibge
              config: { severity: warn, store_failures: true, meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: nome_municipio_polo_compras
        description: >
          Nome do município polo de compras (`id_municipio_polo_compras`); NULL sem polo (incremento `enriquecimento_ibge`).
        data_type: varchar
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`int_municipios__conformados.nome_municipio` do polo" } }
      - name: pct_compras_no_polo
        description: >
          % dos deslocamentos do município para comprar móveis e eletroeletrônicos (Q2) que vão ao polo (0–100); NULL sem polo (incremento `enriquecimento_ibge`).
        data_type: double
        dimension: categorical
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`int_regic__destinos_compras.pct` do polo" } }
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 100 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: ano_cempre
        description: >
          Ano de referência do CEMPRE baixado (hoje 2024), diferente do mês da RFB; NULL sem dado (incremento `enriquecimento_ibge`).
        data_type: integer
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_total.ano` (o mais recente)" } }
      - name: unidades_locais_cempre
        description: >
          Unidades locais de empresas e outras organizações formais no município, todas as atividades (CEMPRE, Total); NULL sem dado (incremento `enriquecimento_ibge`).
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_total.unidades_locais` em `ano_cempre`" } }
      - name: pessoal_ocupado_cempre
        description: >
          Pessoal ocupado total no município, todas as atividades (CEMPRE, Total, 31/12 do ano); NULL sem dado ou com sigilo (incremento `enriquecimento_ibge`).
        data_type: bigint
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__cempre_municipio_total.pessoal_ocupado` em `ano_cempre`" } }

  - name: dim_cnae
    description: >
      Dimensão de CNAE (ADR-0013) com a hierarquia seção → divisão → grupo → classe → subclasse (Base dos Dados), código e descrição em colunas separadas. Membro `-1` para CNAE sem par no BD.
    config:
      meta: { grao: "subclasse CNAE (`sk_cnae`), mais o membro `-1`" }
      contract:
        enforced: true
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    columns:
      - name: sk_cnae
        config: { meta: { linhagem: "`stg_bd__cnaes.subclasse` convertida para inteiro; `-1` fixo no membro NÃO INFORMADO" } }
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Subclasse como inteiro.
        data_type: integer
        entity: { type: primary, name: cnae }
        data_tests: [unique, not_null]
      - name: codigo_secao
        config: { meta: { linhagem: "`stg_bd__cnaes.secao`" } }
        description: >
          Código da seção (letra).
        data_type: varchar
        dimension: categorical
      - name: descricao_secao
        config: { meta: { linhagem: "`stg_bd__cnaes.descricao_secao`" } }
        description: >
          Descrição da seção CNAE (nível mais alto da hierarquia, uma letra), da Base dos Dados.
        data_type: varchar
        dimension: categorical
      - name: codigo_divisao
        config: { meta: { linhagem: "`stg_bd__cnaes.divisao`" } }
        description: >
          Código da divisão (2 dígitos).
        data_type: varchar
        dimension: categorical
      - name: descricao_divisao
        config: { meta: { linhagem: "`stg_bd__cnaes.descricao_divisao`" } }
        description: >
          Descrição da divisão.
        data_type: varchar
        dimension: categorical
      - name: codigo_grupo
        config: { meta: { linhagem: "`stg_bd__cnaes.grupo`" } }
        description: >
          Código do grupo (3 dígitos).
        data_type: varchar
        dimension: categorical
      - name: descricao_grupo
        config: { meta: { linhagem: "`stg_bd__cnaes.descricao_grupo`" } }
        description: >
          Descrição do grupo CNAE (3 primeiros dígitos da subclasse), da Base dos Dados.
        data_type: varchar
        dimension: categorical
      - name: codigo_classe
        config: { meta: { linhagem: "`stg_bd__cnaes.classe`" } }
        description: >
          Código da classe (5 dígitos).
        data_type: varchar
        dimension: categorical
      - name: descricao_classe
        config: { meta: { linhagem: "`stg_bd__cnaes.descricao_classe`" } }
        description: >
          Descrição da classe CNAE (5 primeiros dígitos da subclasse), da Base dos Dados.
        data_type: varchar
        dimension: categorical
      - name: codigo_subclasse
        config: { meta: { linhagem: "`stg_bd__cnaes.subclasse`" } }
        description: >
          Código da subclasse (7 dígitos, com zeros à esquerda).
        data_type: varchar
        dimension: categorical
        data_tests: [unique, not_null]
      - name: descricao_subclasse
        config: { meta: { linhagem: "`stg_bd__cnaes.descricao_subclasse`" } }
        description: >
          Descrição da subclasse.
        data_type: varchar

        dimension: categorical
  - name: dim_natureza_juridica
    description: >
      Dimensão de natureza jurídica (domínio RFB). Membro `-1` para empresa sem natureza no domínio.
    config:
      meta: { grao: "natureza jurídica (`sk_natureza_juridica`), mais o membro `-1`" }
      contract:
        enforced: true
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    columns:
      - name: sk_natureza_juridica
        config: { meta: { linhagem: "`stg_rfb__naturezas.codigo` convertido para inteiro; `-1` fixo no membro NÃO INFORMADO" } }
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Código como inteiro.
        data_type: integer
        entity: { type: primary, name: natureza_juridica }
        data_tests: [unique, not_null]
      - name: codigo_natureza_juridica
        config: { meta: { linhagem: "`stg_rfb__naturezas.codigo`" } }
        description: >
          Código da natureza jurídica (4 dígitos).
        data_type: varchar
        dimension: categorical
        data_tests: [unique, not_null]
      - name: descricao_natureza_juridica
        config: { meta: { linhagem: "`stg_rfb__naturezas.descricao`" } }
        description: >
          Descrição da natureza jurídica.
        data_type: varchar

        dimension: categorical
  - name: dim_porte
    description: >
      Dimensão de porte da empresa (seed `dominio_porte`). Membro `-1` para porte vazio ou fora do domínio.
    config:
      meta: { grao: "porte da empresa (`sk_porte`), mais o membro `-1`" }
      contract:
        enforced: true
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    columns:
      - name: sk_porte
        config: { meta: { linhagem: "seed `dominio_porte.codigo`; `-1` fixo no membro NÃO INFORMADO", dominio_seed: "dominio_porte.codigo", dominio_membro_desconhecido: "-1"} }
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Código RFB do porte.
        data_type: integer
        entity:
          type: primary
          name: porte
          description: >
            Porte da empresa no cadastro da RFB (00 não informado, 01 ME, 03 EPP, 05 demais), declarado no
            registro, não apurado pela receita. MEI não é um porte: é a opção `opcao_mei`.
        data_tests: [unique, not_null]
      - name: codigo_porte
        config: { meta: { linhagem: "seed `dominio_porte.codigo` como texto", dominio_seed: "dominio_porte.codigo", dominio_membro_desconhecido: "-1"} }
        description: >
          Código RFB do porte da empresa em texto (`0` não informado, `1` micro, `3` pequena, `5` demais; `-1` no membro NÃO INFORMADO). Chave natural, igual a `dominio_porte.codigo`.
        data_type: varchar
        dimension: categorical
        data_tests: [unique, not_null]
      - name: rotulo_porte
        config: { meta: { linhagem: "seed `dominio_porte.rotulo`", dominio_seed: "dominio_porte.rotulo", dominio_membro_desconhecido: "NÃO INFORMADO"} }
        description: >
          Rótulo curto (N/A, MICRO, PEQUENA, DEMAIS).
        data_type: varchar
        dimension: categorical
      - name: descricao_porte
        config: { meta: { linhagem: "seed `dominio_porte.descricao`", dominio_seed: "dominio_porte.descricao", dominio_membro_desconhecido: "NÃO INFORMADO"} }
        description: >
          Descrição por extenso.
        data_type: varchar

  - name: dim_situacao_cadastral
    description: >
      Dimensão de situação cadastral (seed `dominio_situacao_cadastral`). Membro `-1` para código fora do domínio.
    config:
      meta: { grao: "situação cadastral (`sk_situacao_cadastral`), mais o membro `-1`" }
      contract:
        enforced: true
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    columns:
      - name: sk_situacao_cadastral
        config: { meta: { linhagem: "seed `dominio_situacao_cadastral.codigo`; `-1` fixo no membro NÃO INFORMADO", dominio_seed: "dominio_situacao_cadastral.codigo", dominio_membro_desconhecido: "-1"} }
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Código RFB da situação.
        data_type: integer
        entity:
          type: primary
          name: situacao_cadastral
          description: >
            Situação cadastral da inscrição do estabelecimento (IN RFB 2.119/2022, art. 9º). ATIVA é situação
            do cadastro, não prova de operação.
        data_tests: [unique, not_null]
      - name: codigo_situacao_cadastral
        config: { meta: { linhagem: "seed `dominio_situacao_cadastral.codigo` como texto", dominio_seed: "dominio_situacao_cadastral.codigo", dominio_membro_desconhecido: "-1"} }
        description: >
          Código RFB da situação, em texto e sem zero à esquerda (`1`, `2`, `3`, `4`, `8`; `-1` no membro
          NÃO INFORMADO). No raw (`estabelecimentos.situacao`) o mesmo código vem com zero à esquerda
          (`02` = ativa): converta ao filtrar.
        data_type: varchar
        dimension: categorical
        data_tests: [unique, not_null]
      - name: rotulo_situacao_cadastral
        config: { meta: { linhagem: "seed `dominio_situacao_cadastral.rotulo`", dominio_seed: "dominio_situacao_cadastral.rotulo", dominio_membro_desconhecido: "NÃO INFORMADO"} }
        description: >
          Rótulo curto (NULA, ATIVA, SUSPENSA, INAPTA, BAIXADA).
        data_type: varchar
        dimension: categorical
      - name: descricao_situacao_cadastral
        config: { meta: { linhagem: "seed `dominio_situacao_cadastral.descricao`", dominio_seed: "dominio_situacao_cadastral.descricao", dominio_membro_desconhecido: "NÃO INFORMADO"} }
        description: >
          Descrição por extenso.
        data_type: varchar

  - name: dim_data
    description: >
      Calendário (ADR-0013): uma linha por dia de 1900-01-01 até `data_referencia` (ou a
      maior data observada, se maior), com `sk_data = yyyymmdd`. Dimensão de papel duplo na fato
      (`sk_data_inicio_atividade`, `sk_data_situacao`). Membros `-1` NÃO INFORMADO (data nula) e `-2`
      DATA INVÁLIDA (anterior a 1900), com datas contíguas ao calendário (1899-12-31 e 1899-12-30)
      para que a tabela seja marcável como tabela de datas no Power BI; `ano`/`mes` ficam NULL neles.
    config:
      meta: { grao: "dia do calendário (`sk_data`), mais os membros `-1` e `-2`" }
      contract:
        enforced: true
    time_spine: { standard_granularity_column: data }
    columns:
      - name: sk_data
        config: { meta: { linhagem: "`data` no formato yyyymmdd (ano × 10000 + mês × 100 + dia); `-1` e `-2` fixos nos membros especiais" } }
        description: >
          Chave substituta inteira no formato yyyymmdd (ex.: 20000229); `-1` NÃO INFORMADO (data nula) e `-2` DATA INVÁLIDA (anterior a 1900).
        data_type: integer
        data_tests: [unique, not_null]
      - name: data
        config: { meta: { linhagem: "calendário gerado de `primeiro_dia_calendario` (1900-01-01) até a maior entre `data_referencia` e as maiores `dat_inicio_atividade` e `dat_situacao` de `stg_rfb__estabelecimentos`" } }
        description: >
          Data do calendário, nunca nula; os membros `-1` e `-2` usam 1899-12-31 e 1899-12-30.
        data_type: date
        granularity: day
      - name: ano
        config: { meta: { linhagem: "`year(data)`" } }
        description: >
          Ano do dia do calendário (4 dígitos, a partir de 1900).
        data_type: integer
      - name: semestre
        config: { meta: { linhagem: "1 se `mes` ≤ 6, senão 2" } }
        description: >
          Semestre do ano (1 ou 2).
        data_type: integer
      - name: trimestre
        config: { meta: { linhagem: "`quarter(data)`" } }
        description: >
          Trimestre do ano (1 a 4).
        data_type: integer
      - name: mes
        config: { meta: { linhagem: "`month(data)`" } }
        description: >
          Mês do ano do dia do calendário (1 a 12).
        data_type: integer
      - name: nome_mes
        config: { meta: { linhagem: "nome do mês em português, indexado por `mes`" } }
        description: >
          Nome do mês em português (janeiro … dezembro).
        data_type: varchar
      - name: ano_mes
        config: { meta: { linhagem: "`strftime(data, '%Y-%m')`" } }
        description: >
          Ano e mês no formato `AAAA-MM`, usado como rótulo/ordenação mensal e igual a `_mes_referencia`.
        data_type: varchar
      - name: dia
        config: { meta: { linhagem: "`day(data)`" } }
        description: >
          Dia do mês do dia do calendário (1 a 31).
        data_type: integer
      - name: dia_semana_numero
        config: { meta: { linhagem: "`isodow(data)`" } }
        description: >
          Dia da semana ISO (1 segunda … 7 domingo), para ordenar `dia_semana` no BI.
        data_type: integer
      - name: dia_semana
        config: { meta: { linhagem: "nome do dia em português, indexado por `dia_semana_numero`" } }
        description: >
          Nome do dia da semana em português (segunda-feira … domingo).
        data_type: varchar

  - name: int_estabelecimentos__enriquecidos
    config:
      meta: { grao: "estabelecimento (`cnpj_completo`) do mês selecionado" }
    description: >
      Estabelecimentos do mês selecionado com empresa, Simples/MEI e pares nos domínios, por LEFT
      JOIN: nada é descartado (diferente dos inner joins de `bh_empresas`); a ausência de par vira
      as flags `tem_*`. Base da fato e da bridge de CNAEs secundários.
    columns:
      - name: cnpj_completo
        description: CNPJ de 14 dígitos; único por mês.
        data_tests: [unique, not_null]
      - name: matriz_filial_codigo
        description: Indicador matriz (1) / filial (2); validado contra o seed `dominio_matriz_filial`.
        data_tests:
          - relationships:
              arguments:
                to: ref('dominio_matriz_filial')
                field: codigo
              config: { where: "matriz_filial_codigo is not null" }
      - name: cnpj_raiz
        description: 8 primeiros dígitos do CNPJ (FK lógica para `stg_rfb__empresas.cnpj_raiz`).
      - name: situacao_codigo
        description: "Situação cadastral: 1 nula, 2 ativa, 3 suspensa, 4 inapta, 8 baixada."
      - name: dat_inicio_atividade
        description: Data de início de atividade; NULL se `0`, `00000000` ou inválida no raw.
      - name: dat_situacao
        description: Data da situação cadastral atual; NULL se `0`, `00000000` ou inválida no raw.
      - name: cnae_principal
        description: Subclasse CNAE principal, 7 dígitos.
      - name: cnaes_secundarios_lista
        description: CNAEs secundários como lista (cada item com 7 dígitos); lista vazia se não houver.
      - name: municipio_rfb_codigo
        description: Código do município na classificação da RFB, 4 dígitos (não é o código IBGE).
      - name: id_municipio_ibge
        description: Código IBGE do município pareado na Base dos Dados; NULL se `tem_municipio_bd` é falso.
      - name: natureza_juridica_codigo
        description: Código da natureza jurídica da empresa (4 dígitos); NULL sem empresa.
      - name: porte_codigo
        description: "Código de porte da empresa: 0 não informado, 1 micro, 3 pequena, 5 demais; NULL sem empresa."
      - name: capital_social
        description: Capital social da empresa, DECIMAL(18,2); NULL sem empresa ou se inválido no raw.
      - name: opcao_simples
        description: "`true` se a empresa é optante pelo Simples Nacional; sem registro no Simples vira `false`."
      - name: opcao_mei
        description: "`true` se a empresa é optante pelo MEI; sem registro no Simples vira `false`."
      - name: tem_empresa
        description: Diagnóstico do LEFT JOIN. `false` se o estabelecimento não tem a empresa (`cnpj_raiz`) em `stg_rfb__empresas`.
      - name: tem_natureza
        description: Diagnóstico do LEFT JOIN. `false` se a natureza jurídica não tem par em `stg_rfb__naturezas`.
      - name: tem_cnae_bd
        description: Diagnóstico do LEFT JOIN. `false` se o CNAE principal não tem par em `stg_bd__cnaes`.
      - name: tem_municipio_bd
        description: Diagnóstico do LEFT JOIN. `false` se o município RFB não tem par na Base dos Dados (exterior, município novo).
      - name: _mes_referencia
        description: Mês de referência (`YYYY-MM`) do extrato RFB.
      - name: _data_referencia
        description: Data do extrato RFB; base de `idade_anos` e de `data_referencia()`.

  - name: fct_estabelecimentos
    description: >
      Fato detalhada (ADR-0013): uma linha por estabelecimento (`cnpj_completo`, dimensão
      degenerada), só com chaves inteiras para as dimensões, flags e medidas. Sem descartes
      silenciosos: estabelecimento sem par numa dimensão fica com a chave `-1`. Parquet em
      `gold/fct_estabelecimentos.parquet`; para o Power BI use `fct_resumo_mensal` (modo Import).
    config:
      meta: { grao: "estabelecimento (`cnpj_completo`)" }
      contract:
        enforced: true
    data_tests:
      # RBP-13: MEI exige a opção pelo Simples (N20).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not opcao_mei or opcao_simples"
          config: { severity: warn, store_failures: true, meta: { escopo: adicao }, tags: [escopo_adicao] }
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    agg_time_dimension: data_inicio_atividade
    derived_semantics:
      dimensions:
        - name: data_inicio_atividade
          type: time
          granularity: day
          description: Data de início de atividade; nula para as chaves -1 (sem data) e -2 (anterior a 1900).
          expr: case when sk_data_inicio_atividade > 0 then strptime(cast(sk_data_inicio_atividade as varchar), '%Y%m%d')::date end
        - name: data_situacao
          type: time
          granularity: day
          description: Data da situação cadastral atual; nula para as chaves -1 e -2.
          expr: case when sk_data_situacao > 0 then strptime(cast(sk_data_situacao as varchar), '%Y%m%d')::date end
    metrics:
      - name: aberturas
        label: Aberturas
        description: >
          Estabelecimentos do extrato corrente pela data de início de atividade (`metric_time` = início), só com
          data válida (as chaves -1 e -2 não geram evento), como `mart_dinamica_mercado`.
        type: simple
        agg: count
        expr: cnpj_completo
        filter: "{{ TimeDimension('estabelecimento__data_inicio_atividade', 'day') }} is not null"
        config: { meta: { escopo: adicao } }
      - name: encerramentos
        label: Encerramentos
        description: >
          Estabelecimentos não ativos (`not eh_ativa`: baixados, suspensos, inaptos, nulos) pela data da situação
          cadastral (`metric_time` = data da situação), só com data válida; regra de `mart_dinamica_mercado`.
        type: simple
        agg: count
        expr: cnpj_completo
        agg_time_dimension: data_situacao
        filter:
          - "not {{ Dimension('estabelecimento__eh_ativa') }}"
          - "{{ TimeDimension('estabelecimento__data_situacao', 'day') }} is not null"
        config: { meta: { escopo: adicao } }
      - name: baixas
        label: Baixas
        description: >
          Estabelecimentos BAIXADOS pela data da situação cadastral (`metric_time` = data da situação), só com
          data válida: o fechamento definitivo, sem as inaptidões, suspensões e nulidades de `encerramentos`
          (a inaptidão chega em lotes administrativos e pode ser revertida).
        type: simple
        agg: count
        expr: cnpj_completo
        agg_time_dimension: data_situacao
        filter:
          - "{{ Dimension('situacao_cadastral__rotulo_situacao_cadastral') }} = 'BAIXADA'"
          - "{{ TimeDimension('estabelecimento__data_situacao', 'day') }} is not null"
        config: { meta: { escopo: adicao } }
      - name: saldo_aberturas_encerramentos
        label: Saldo (aberturas − encerramentos)
        description: >
          Aberturas menos encerramentos no mesmo período de `metric_time` (o `saldo` de `mart_dinamica_mercado`);
          período com eventos só de um lado conta o outro como 0.
        type: derived
        # coalesce: o dbt-core 1.12.5 descarta `fill_nulls_with` nas métricas do YAML novo.
        expr: coalesce(aberturas, 0) - coalesce(encerramentos, 0)
        input_metrics:
          - { name: aberturas }
          - { name: encerramentos }
        config: { meta: { escopo: adicao } }
    columns:
      - name: cnpj_completo
        config: { meta: { linhagem: "`stg_rfb__estabelecimentos.cnpj_completo` (`cnpj_raiz` || `cnpj_ordem` || `cnpj_dv`), via `int_estabelecimentos__enriquecidos`" } }
        description: CNPJ completo (14 dígitos); dimensão degenerada e chave da linha.
        data_type: varchar
        entity:
          type: primary
          name: estabelecimento
          description: >
            Estabelecimento (CNPJ completo, 14 posições): matriz ou filial. Não é a empresa: a empresa é o
            CNPJ básico (8 primeiros caracteres) e pode ter vários estabelecimentos; para contar empresas use
            as matrizes (`qtd_matrizes`). Ver docs/referencia/camada-semantica.md, Parte A.
        data_tests: [unique, not_null]
      - name: sk_municipio
        config: { meta: { linhagem: "`dim_municipio.sk_municipio`, casando `int_estabelecimentos__enriquecidos.id_municipio_ibge` (de `municipio_rfb_codigo` = `codigo_rfb`); `-1` sem par" } }
        description: >
          Chave de `dim_municipio`; `-1` quando o município RFB não tem par na Base dos Dados (exterior, município novo).
        data_type: integer
        entity: { type: foreign, name: municipio }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: sk_cnae
        config: { meta: { linhagem: "`dim_cnae.sk_cnae`, casando `cnae_principal` com `dim_cnae.codigo_subclasse`; `-1` sem par" } }
        description: >
          Chave de `dim_cnae` (CNAE principal); `-1` quando o CNAE não tem par na Base dos Dados.
        data_type: integer
        entity: { type: foreign, name: cnae }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: sk_natureza_juridica
        config: { meta: { linhagem: "`dim_natureza_juridica.sk_natureza_juridica`, casando `natureza_juridica_codigo` (de `stg_rfb__empresas`); `-1` sem par" } }
        description: >
          Chave de `dim_natureza_juridica`; `-1` quando a empresa não tem natureza no domínio.
        data_type: integer
        entity: { type: foreign, name: natureza_juridica }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_natureza_juridica')
                field: sk_natureza_juridica
      - name: sk_porte
        config: { meta: { linhagem: "`dim_porte.sk_porte`, casando `porte_codigo` (de `stg_rfb__empresas`); `-1` sem par" } }
        description: >
          Chave de `dim_porte`; `-1` quando o porte está vazio ou fora do domínio.
        data_type: integer
        entity: { type: foreign, name: porte }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_porte')
                field: sk_porte
      - name: sk_situacao_cadastral
        config: { meta: { linhagem: "`dim_situacao_cadastral.sk_situacao_cadastral`, casando `situacao_codigo` (de `stg_rfb__estabelecimentos`); `-1` sem par" } }
        description: >
          Chave de `dim_situacao_cadastral`; `-1` quando o código está fora do domínio.
        data_type: integer
        entity: { type: foreign, name: situacao_cadastral }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_situacao_cadastral')
                field: sk_situacao_cadastral
      - name: sk_data_inicio_atividade
        config: { meta: { linhagem: "`dim_data.sk_data`, casando `dat_inicio_atividade` com `dim_data.data`; `-2` se anterior a 1900; `-1` sem par ou nula" } }
        description: >
          Chave de `dim_data` (papel: início de atividade); `-1` quando a data é nula; `-2` quando é anterior a 1900 (DATA INVÁLIDA).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: sk_data
      - name: sk_data_situacao
        config: { meta: { linhagem: "`dim_data.sk_data`, casando `dat_situacao` com `dim_data.data`; `-2` se anterior a 1900; `-1` sem par ou nula" } }
        description: >
          Chave de `dim_data` (papel: data da situação cadastral); `-1` quando a data é nula (ex.: `00000000`); `-2` quando é anterior a 1900 (DATA INVÁLIDA).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: sk_data
      - name: idade_anos
        config: { meta: { linhagem: "`round(dias entre dat_inicio_atividade e data_referencia / 365.25, 1)`, só quando `situacao_codigo` = 2" } }
        description: >
          Idade do estabelecimento em anos (1 casa), relativa a `data_referencia`, só para ativos
          (NULL nos demais), como `bh_empresas.idade_atual`. Aditiva via soma, para médias no BI.
        data_type: double
      - name: opcao_simples
        config: { meta: { linhagem: "`stg_rfb__simples.opcao_simples`; `false` sem registro" } }
        description: Optante pelo Simples Nacional na empresa (false quando não há registro).
        data_type: boolean
        dimension: categorical
      - name: opcao_mei
        config: { meta: { linhagem: "`stg_rfb__simples.opcao_mei`; `false` sem registro" } }
        description: Optante pelo MEI na empresa (false quando não há registro).
        data_type: boolean
        dimension: categorical
      - name: capital_social
        config: { meta: { linhagem: "`stg_rfb__empresas.capital_social`, repetido em cada estabelecimento da raiz" } }
        description: >
          Capital social da EMPRESA (R$), repetido em cada estabelecimento dela; não some por
          estabelecimento (some só a matriz, `eh_matriz`). NULL quando não há empresa.
        data_type: decimal(18,2)
      - name: eh_matriz
        config: { meta: { linhagem: "`matriz_filial_codigo` = 1 (de `stg_rfb__estabelecimentos`, campo IDENTIFICADOR MATRIZ/FILIAL)" } }
        description: Verdadeiro para matriz (`ind_matriz_filial = 1`).
        data_type: boolean
        dimension: categorical
      - name: eh_ativa
        config: { meta: { linhagem: "`situacao_codigo` = 2 (de `stg_rfb__estabelecimentos`)" } }
        description: Verdadeiro para situação cadastral ativa (código 2).
        data_type: boolean

        dimension: categorical
  - name: fct_resumo_mensal
    description: >
      Fato agregada para Power BI em modo Import (ADR-0012/0013). Grão: mês × município × CNAE ×
      porte × situação × MEI (sem ano de início nem natureza, que explodiriam o resumo; ADR-0013). Medidas
      aditivas (idade média = `soma_idade_anos / qtd_ativos`; capital médio =
      `soma_capital_social_matrizes / qtd_matrizes`). Gravada como uma partição Parquet por mês em
      `gold/fct_resumo_mensal/mes_referencia=YYYY-MM/`: reprocessar um mês substitui só a partição dele
      e o histórico sobrevive à remoção do `warehouse.duckdb`. Esta relação lê TODAS as partições
      existentes em disco (série histórica); o mês processado na execução é o `max(_mes_referencia)`
      do staging.
    config:
      meta: { grao: "mês × município × CNAE × porte × situação cadastral × opção MEI (`mes_referencia`, `sk_municipio`, `sk_cnae`, `sk_porte`, `sk_situacao_cadastral`, `opcao_mei`)" }
      contract:
        enforced: true
    # Integridade referencial: testes singulares `fct_resumo_mensal_relacionamentos_mes` (error, só o
    # mês processado: `relationships` genérico não aceita `ref` no `where`) e
    # `fct_resumo_mensal_integridade_historica` (warn, todas as partições) — R3-18.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_referencia
              - sk_municipio
              - sk_cnae
              - sk_porte
              - sk_situacao_cadastral
              - opcao_mei
    semantic_model:
      enabled: true
      config: { meta: { escopo: adicao } }
    primary_entity: resumo_mensal
    agg_time_dimension: mes
    derived_semantics:
      dimensions:
        - name: mes
          type: time
          granularity: month
          description: Mês de referência do extrato RFB (primeiro dia do mês).
          expr: cast(mes_referencia || '-01' as date)
    metrics:
      - name: qtd_estabelecimentos
        label: Qtd Estabelecimentos
        description: 'Estabelecimentos no mês (fotografia: em períodos maiores que o mês vale o último mês, não a soma).'
        type: simple
        agg: sum
        expr: qtd_estabelecimentos
        non_additive_dimension: { name: mes, window_agg: max }
        config: { meta: { escopo: adicao, linhagem: "`count(*)` de `fct_estabelecimentos` no grão"} }
      - name: qtd_ativos
        label: Qtd Ativos
        description: Estabelecimentos com situação cadastral ATIVA no mês (fotografia; não soma meses).
        type: simple
        agg: sum
        expr: qtd_ativos
        non_additive_dimension: { name: mes, window_agg: max }
        config: { meta: { escopo: adicao, linhagem: "contagem de `fct_estabelecimentos.eh_ativa`"} }
      - name: qtd_ativos_mei
        label: Qtd Ativos MEI
        description: Ativos de empresas optantes pelo MEI no mês.
        type: simple
        agg: sum
        expr: qtd_ativos
        non_additive_dimension: { name: mes, window_agg: max }
        filter: "{{ Dimension('resumo_mensal__opcao_mei') }}"
        config: { meta: { escopo: adicao } }
      - name: qtd_matrizes
        label: Qtd Matrizes
        description: Matrizes no mês (uma por empresa); denominador do capital social médio.
        type: simple
        agg: sum
        expr: qtd_matrizes
        non_additive_dimension: { name: mes, window_agg: max }
        config: { meta: { escopo: adicao, linhagem: "contagem de `fct_estabelecimentos.eh_matriz`"} }
      - name: capital_social_total
        label: Capital Social Total (R$)
        description: Capital social somado só nas matrizes, para contar cada empresa uma vez.
        type: simple
        agg: sum
        expr: soma_capital_social_matrizes
        non_additive_dimension: { name: mes, window_agg: max }
        config: { meta: { escopo: adicao } }
      - name: soma_idade_anos_ativos
        description: Soma da idade (anos) dos ativos; numerador de `idade_media_anos`.
        type: simple
        agg: sum
        expr: soma_idade_anos
        non_additive_dimension: { name: mes, window_agg: max }
        config: { meta: { escopo: adicao } }
      - name: pct_ativos
        label: '% Ativos'
        description: Ativos / estabelecimentos.
        type: ratio
        numerator: qtd_ativos
        denominator: qtd_estabelecimentos
        config: { meta: { escopo: adicao } }
      - name: idade_media_anos
        label: Idade Média (anos)
        description: Idade média dos estabelecimentos ativos, em anos.
        type: ratio
        numerator: soma_idade_anos_ativos
        denominator: qtd_ativos
        config: { meta: { escopo: adicao } }
      - name: capital_social_medio
        label: Capital Social Médio (R$)
        description: Capital social médio por empresa (matriz).
        type: ratio
        numerator: capital_social_total
        denominator: qtd_matrizes
        config: { meta: { escopo: adicao } }
      - name: pct_mei_entre_ativos
        label: '% MEI entre Ativos'
        description: Participação do MEI entre os ativos.
        type: ratio
        numerator: qtd_ativos_mei
        denominator: qtd_ativos
        config: { meta: { escopo: adicao } }
      - name: qtd_ativos_mes_anterior
        label: Qtd Ativos Mês Anterior
        description: Ativos no mês anterior ao de `metric_time`.
        type: derived
        expr: ativos_mes_anterior
        input_metrics:
          - { name: qtd_ativos, offset_window: 1 month, alias: ativos_mes_anterior }
        config: { meta: { escopo: adicao } }
      - name: variacao_mensal_ativos
        label: Variação Mensal de Ativos
        description: Ativos no mês menos ativos no mês anterior.
        type: derived
        expr: qtd_ativos - ativos_mes_anterior
        input_metrics:
          - { name: qtd_ativos }
          - { name: qtd_ativos, offset_window: 1 month, alias: ativos_mes_anterior }
        config: { meta: { escopo: adicao } }
      - name: variacao_mensal_ativos_pct
        label: Variação Mensal de Ativos (%)
        description: Variação relativa dos ativos frente ao mês anterior; nula sem ativos no mês anterior.
        type: derived
        expr: (qtd_ativos - ativos_mes_anterior) / nullif(ativos_mes_anterior, 0)
        input_metrics:
          - { name: qtd_ativos }
          - { name: qtd_ativos, offset_window: 1 month, alias: ativos_mes_anterior }
        config: { meta: { escopo: adicao } }
    columns:
      - name: mes_referencia
        config: { meta: { linhagem: "`max(_mes_referencia)` de `stg_rfb__estabelecimentos`" } }
        description: Mês de referência `YYYY-MM` (coluna de partição Hive).
        data_type: varchar
        data_tests: [not_null]
      - name: sk_mes_referencia
        config: { meta: { linhagem: "`mes_referencia` como `AAAAMM01`", fk_declarada: "dim_data.sk_data", membro_desconhecido: false } }
        description: >
          Primeiro dia do mês como `yyyymm01`; mesma chave de `dim_data.sk_data` (relacionamento 1:* no BI). Nunca `-1`: é sempre o mês do extrato.
        data_type: integer
        data_tests: [not_null]
      - name: sk_municipio
        config: { meta: { linhagem: "`fct_estabelecimentos.sk_municipio` (coluna do grão)" } }
        description: Chave de `dim_municipio` (`-1` = NÃO INFORMADO).
        data_type: integer
        entity: { type: foreign, name: municipio }
        data_tests: [not_null]
      - name: sk_cnae
        config: { meta: { linhagem: "`fct_estabelecimentos.sk_cnae` (coluna do grão)" } }
        description: Chave de `dim_cnae` (CNAE principal; `-1` = NÃO INFORMADO).
        data_type: integer
        entity: { type: foreign, name: cnae }
        data_tests:
          - not_null
      - name: sk_porte
        config: { meta: { linhagem: "`fct_estabelecimentos.sk_porte` (coluna do grão)" } }
        description: Chave de `dim_porte`.
        data_type: integer
        entity: { type: foreign, name: porte }
        data_tests:
          - not_null
      - name: sk_situacao_cadastral
        config: { meta: { linhagem: "`fct_estabelecimentos.sk_situacao_cadastral` (coluna do grão)" } }
        description: Chave de `dim_situacao_cadastral`.
        data_type: integer
        entity: { type: foreign, name: situacao_cadastral }
        data_tests:
          - not_null
      - name: opcao_mei
        config: { meta: { linhagem: "`fct_estabelecimentos.opcao_mei` (coluna do grão)" } }
        description: Optante pelo MEI.
        data_type: boolean
        dimension: categorical
        data_tests: [not_null]
      - name: qtd_estabelecimentos
        description: Quantidade de estabelecimentos no grão.
        data_type: bigint
        data_tests: [not_null]
      - name: qtd_ativos
        description: Quantidade de estabelecimentos ativos (situação 2) no grão.
        data_type: bigint
        data_tests: [not_null]
      - name: soma_idade_anos
        config: { meta: { linhagem: "`sum(fct_estabelecimentos.idade_anos)`; 0 sem valor" } }
        description: Soma da idade (anos) dos estabelecimentos ativos; divida por `qtd_ativos` para a média.
        data_type: double
      - name: qtd_matrizes
        description: Quantidade de matrizes no grão (uma por empresa); denominador do capital médio.
        data_type: bigint
        data_tests: [not_null]
      - name: soma_capital_social_matrizes
        config: { meta: { linhagem: "`sum(fct_estabelecimentos.capital_social)` só onde `eh_matriz`; 0 sem valor" } }
        description: >
          Soma do capital social (R$) só das matrizes (uma por empresa, sem repetição por filial).
        data_type: decimal(18,2)

  - name: int_cnaes_secundarios__explodidos
    config:
      meta: { grao: "estabelecimento e CNAE secundário (`cnpj_completo`, `codigo_cnae_secundario`)" }
    description: >
      Uma linha por (estabelecimento, CNAE secundário), a partir de `cnaes_secundarios_lista`.
    columns:
      - name: cnpj_completo
        description: CNPJ completo do estabelecimento.
      - name: codigo_cnae_secundario
        description: Subclasse CNAE secundária (7 dígitos).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnpj_completo, codigo_cnae_secundario]

  - name: bridge_estabelecimento_cnae_secundario
    description: >
      Bridge (ADR-0013): CNAEs secundários por estabelecimento (muitos-para-muitos entre
      `fct_estabelecimentos` e `dim_cnae`). Lista vazia não gera linhas. Opcional no BI.
    config:
      meta: { grao: "estabelecimento e CNAE secundário (`cnpj_completo`, `codigo_cnae_secundario`)" }
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnpj_completo, codigo_cnae_secundario]
    columns:
      - name: cnpj_completo
        config: { meta: { linhagem: "`int_cnaes_secundarios__explodidos.cnpj_completo`" } }
        description: CNPJ completo; FK para `fct_estabelecimentos.cnpj_completo`.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_estabelecimentos')
                field: cnpj_completo
      - name: sk_cnae
        config: { meta: { linhagem: "`dim_cnae.sk_cnae`, casando `codigo_cnae_secundario` com `dim_cnae.codigo_subclasse`; `-1` sem par" } }
        description: Chave de `dim_cnae` (CNAE secundário); `-1` quando sem par na Base dos Dados.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: codigo_cnae_secundario
        config: { meta: { linhagem: "um item de `stg_rfb__estabelecimentos.cnaes_secundarios` (lista separada por vírgula), sem repetição por estabelecimento" } }
        description: Subclasse CNAE secundária (7 dígitos) como veio da RFB, normalizada com zeros à esquerda.
        data_type: varchar

  - name: bridge_municipio_vizinho
    description: >
      Vizinhança entre municípios (incremento `enriquecimento_bd`, ADR-0015): pares
      (`sk_municipio`, `sk_municipio_vizinho`) do ano mais recente da Base dos Dados, simétricos,
      sem autopares nem duplicatas. Base de `mart_concorrencia_area_mercado`; opcional no BI.
    config:
      meta: { grao: "par de municípios vizinhos do ano mais recente, nos dois sentidos (`sk_municipio`, `sk_municipio_vizinho`)", incremento: enriquecimento_bd }
      contract:
        enforced: true
      tags: [incremento_enriquecimento_bd]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_municipio, sk_municipio_vizinho]
          config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
    columns:
      - name: sk_municipio
        config: { meta: { linhagem: "`dim_municipio.sk_municipio` do primeiro município do par de `stg_bd__vizinhanca` (ano mais recente, nos dois sentidos)", membro_desconhecido: false } }
        description: >
          Município; FK para `dim_municipio.sk_municipio`. Sem chave `-1`: par com município fora de `dim_municipio` é descartado.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: sk_municipio_vizinho
        config: { meta: { linhagem: "`dim_municipio.sk_municipio` do segundo município do par de `stg_bd__vizinhanca` (ano mais recente, nos dois sentidos)", membro_desconhecido: false } }
        description: >
          Município vizinho; FK para `dim_municipio.sk_municipio`. Sem chave `-1`: par com município fora de `dim_municipio` é descartado.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }

  # incremento: enriquecimento_ibge (ADR-0022)
  - name: int_regic__destinos_compras
    description: >
      REGIC 2018 em formato longo (incremento `enriquecimento_ibge`): para cada município de origem,
      os destinos aonde os moradores vão comprar vestuário e calçados (`vestuario_calcados`, Q1) e
      móveis e eletroeletrônicos (`moveis_eletro`, Q2), com o % dos deslocamentos (> 0) e o `posto`
      do destino (1 = principal destino listado; empate fica com o menor código IBGE). O destino
      "Outros" (lugares não listados) fica com `eh_outros` e sem posto. Base do polo de compras de
      `dim_municipio` e de `bridge_municipio_destino_compras`.
    config:
      meta: { grao: "origem × destino × tema (`id_municipio_origem`, `id_municipio_destino`, `tema`); o destino \"Outros\" tem `id_municipio_destino` NULL", incremento: enriquecimento_ibge }
      tags: [incremento_enriquecimento_ibge]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_municipio_origem, id_municipio_destino, tema]
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
    columns:
      - name: id_municipio_origem
        description: Código IBGE do município de origem dos deslocamentos.
      - name: id_municipio_destino
        description: Código IBGE do destino; NULL no destino "Outros".
      - name: eh_outros
        description: true no destino "Outros / Não circula jornal" (lugares não listados na REGIC).
      - name: tema
        description: "`vestuario_calcados` (Q1) ou `moveis_eletro` (Q2)."
        data_tests:
          - accepted_values:
              arguments: { values: [vestuario_calcados, moveis_eletro] }
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: pct
        description: "% dos deslocamentos da origem que vão ao destino no tema (0–100, > 0)."
      - name: posto
        description: Posição do destino entre os listados da origem no tema (1 = maior %, empate pelo menor código); NULL no destino "Outros".

  - name: int_municipios__perfil_ibge
    description: >
      Perfil do município com as fontes do IBGE (incremento `enriquecimento_ibge`, ADR-0022), uma
      linha por município de `int_municipios__conformados`: renda do Censo 2022, valor adicionado
      por atividade (`ano_va` próprio, independente de `ano_pib`), hierarquia urbana, índice de
      atração e polo de compras (REGIC 2018) e o total do CEMPRE. NULL onde a fonte não tem o
      município ou está vazia (modo offline sem `ibge/`). Base das colunas novas de `dim_municipio`.
    config:
      meta: { grao: "município IBGE (`id_municipio_ibge`)", incremento: enriquecimento_ibge }
      tags: [incremento_enriquecimento_ibge]
    columns:
      - name: id_municipio_ibge
        description: Código IBGE do município (7 dígitos).
        data_tests:
          - unique:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: renda_per_capita_media_2022
        description: Rendimento domiciliar per capita médio (R$) do Censo 2022.
      - name: renda_per_capita_mediana_2022
        description: Rendimento domiciliar per capita mediano (R$) do Censo 2022.
      - name: moradores_renda_2022
        description: Moradores (base da renda per capita) do Censo 2022.
      - name: ano_va
        description: Último ano com as quatro aberturas do VA preenchidas.
      - name: va_agropecuaria
        description: VA da agropecuária em `ano_va`.
      - name: va_industria
        description: VA da indústria em `ano_va`.
      - name: va_servicos
        description: VA dos serviços (exceto administração pública) em `ano_va`.
      - name: va_adm_publica
        description: VA da administração, defesa, educação e saúde públicas e seguridade social em `ano_va`.
      - name: pct_va_agropecuaria
        description: Participação da agropecuária na soma das quatro aberturas (0–100).
      - name: pct_va_industria
        description: Participação da indústria na soma das quatro aberturas (0–100).
      - name: pct_va_servicos
        description: Participação dos serviços na soma das quatro aberturas (0–100).
      - name: pct_va_adm_publica
        description: Participação da administração pública na soma das quatro aberturas (0–100).
      - name: regic_hierarquia_codigo
        description: Código do nível da hierarquia urbana (REGIC 2018).
      - name: regic_hierarquia
        description: Nome do nível da hierarquia urbana (REGIC 2018).
      - name: regic_arranjo_populacional
        description: Arranjo populacional do município (REGIC 2018); NULL se isolado.
      - name: regic_regiao_influencia
        description: Vinculação imediata do município na rede urbana (REGIC 2018).
      - name: regic_indice_atracao
        description: Índice de atração geral (REGIC 2018); NULL se não é destino.
      - name: id_municipio_polo_compras
        description: Código IBGE do polo de compras (maior Q2 entre os destinos listados).
      - name: nome_municipio_polo_compras
        description: Nome do polo de compras.
      - name: pct_compras_no_polo
        description: "% dos deslocamentos para móveis e eletroeletrônicos (Q2) que vão ao polo."
      - name: ano_cempre
        description: Ano do CEMPRE (o mais recente baixado).
      - name: unidades_locais_cempre
        description: Unidades locais, todas as atividades (CEMPRE, Total).
      - name: pessoal_ocupado_cempre
        description: Pessoal ocupado total, todas as atividades (CEMPRE, Total).

  - name: bridge_municipio_destino_compras
    description: >
      Para onde os moradores de cada município vão comprar (incremento `enriquecimento_ibge`,
      ADR-0022), da REGIC 2018, em tabela longa: grão = origem × destino × tema, nos temas de
      compra `vestuario_calcados` (Q1) e `moveis_eletro` (Q2), só ligações com % > 0. `posto` 1 é o
      principal destino listado da origem no tema. O destino "Outros" (lugares não listados) é a
      linha com `sk_municipio_destino` = -1 e `eh_outros`, sem posto: com ela a soma de `pct` por
      origem e tema bate ~100 (teste `destino_compras_soma_100`, warn). A REGIC é de 2018: municípios criados depois não aparecem como origem.
      Parquet em `gold/bridge_municipio_destino_compras.parquet`; opcional no BI.
    config:
      meta: { grao: "origem × destino × tema (`sk_municipio_origem`, `sk_municipio_destino`, `tema`)", incremento: enriquecimento_ibge }
      contract:
        enforced: true
      tags: [incremento_enriquecimento_ibge]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sk_municipio_origem, sk_municipio_destino, tema]
          config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
    columns:
      - name: sk_municipio_origem
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.sk_municipio` da origem (`stg_ibge__regic_ligacoes.id_municipio_origem`)", membro_desconhecido: false } }
        description: >
          Município de origem dos deslocamentos; FK para `dim_municipio.sk_municipio`. Sem `-1`: origem fora de `dim_municipio` fica de fora.
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: sk_municipio_destino
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`dim_municipio.sk_municipio` do destino (`stg_ibge__regic_ligacoes.id_municipio_destino`); `-1` no destino \"Outros\"" } }
        description: >
          Município de destino; FK para `dim_municipio.sk_municipio`. `-1` no destino "Outros" (lugares não listados, `eh_outros`).
        data_type: integer
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: eh_outros
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_ligacoes.destino_outros`" } }
        description: >
          true na linha do destino "Outros / Não circula jornal" da REGIC: a parcela dos deslocamentos para lugares não listados.
        data_type: boolean
      - name: tema
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "coluna Q1 (`vestuario_calcados`) ou Q2 (`moveis_eletro`) de `stg_ibge__regic_ligacoes`" } }
        description: >
          Tema de compra do questionário da REGIC: `vestuario_calcados` (Q1, vestuário e calçados) ou `moveis_eletro` (Q2, móveis e eletroeletrônicos).
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: [vestuario_calcados, moveis_eletro] }
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: pct
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "`stg_ibge__regic_ligacoes.pct_vestuario_calcados` ou `.pct_moveis_eletro`" } }
        description: >
          % dos deslocamentos da origem para comprar no tema que vão a este destino (0–100).
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 100, inclusive: true }
              config: { meta: { escopo: adicao, incremento: enriquecimento_ibge }, tags: [escopo_adicao, incremento_enriquecimento_ibge] }
      - name: posto
        config: { meta: { incremento: enriquecimento_ibge, linhagem: "ordem de `pct` decrescente entre os destinos listados da origem no tema (empate: menor código IBGE)" } }
        description: >
          Posição do destino entre os listados da origem no tema (1 = principal destino, o polo em `moveis_eletro`); NULL no destino "Outros".
        data_type: bigint

unit_tests:
  - name: test_int_municipios_conformados_ano_mais_recente
    description: "CORE-01: sem a var `ano_populacao`, usa o último ano de população (2024: 20000, não 2023: 19000); PIB do último ano."
    model: int_municipios__conformados
    given:
      - input: ref('stg_bd__municipios')
        rows:
          - { id_municipio: "3202207", id_municipio_rf: "5643", nome: "Fundão", sigla_uf: "ES" }
          - { id_municipio: "3203205", id_municipio_rf: "5663", nome: "Linhares", sigla_uf: "ES" }
      - input: ref('stg_bd__populacao')
        rows:
          - { id_municipio: "3202207", ano: 2023, populacao: 19000 }
          - { id_municipio: "3202207", ano: 2024, populacao: 20000 }
          - { id_municipio: "3203205", ano: 2023, populacao: 170000 }
      - input: ref('stg_bd__pib')
        rows:
          - { id_municipio: "3202207", ano: 2020, pib: 1.0 }
          - { id_municipio: "3202207", ano: 2021, pib: 350000.0 }
    expect:
      rows:
        - { sk_municipio: 3202207, codigo_rfb: "5643", ano_populacao: 2024, populacao: 20000, ano_pib: 2021, pib: 350000.0 }
        - { sk_municipio: 3203205, codigo_rfb: "5663", ano_populacao: null, populacao: null, ano_pib: null, pib: null }

  - name: test_int_municipios_conformados_var_ano_populacao
    description: "CORE-01: a var `ano_populacao` sobrescreve o último ano (2023: 19000)."
    model: int_municipios__conformados
    overrides:
      vars:
        ano_populacao: 2023
    given:
      - input: ref('stg_bd__municipios')
        rows:
          - { id_municipio: "3202207", id_municipio_rf: "5643", nome: "Fundão", sigla_uf: "ES" }
      - input: ref('stg_bd__populacao')
        rows:
          - { id_municipio: "3202207", ano: 2023, populacao: 19000 }
          - { id_municipio: "3202207", ano: 2024, populacao: 20000 }
      - input: ref('stg_bd__pib')
        rows:
          - { id_municipio: "3202207", ano: 2021, pib: 350000.0 }
    expect:
      rows:
        - { sk_municipio: 3202207, ano_populacao: 2023, populacao: 19000 }

  - name: test_dim_municipio_membro_nao_informado
    description: "ADR-0013: além dos municípios, existe o membro `-1` NÃO INFORMADO (nunca nulo nas chaves e hierarquias)."
    model: dim_municipio
    given:
      - input: ref('int_municipios__conformados')
        rows:
          - { sk_municipio: 3202207, id_municipio_ibge: "3202207", codigo_rfb: "5643", nome_municipio: "Fundão", sigla_uf: "ES", populacao: 20000 }
      # incremento: enriquecimento_bd — entradas novas do `dim_municipio`, sem linhas neste teste
      - input: ref('stg_bd__censo_2022_municipio')
        rows: []
      - input: ref('stg_bd__regioes_metropolitanas')
        rows: []
      - input: ref('int_municipios__perfil_ibge')  # incremento: enriquecimento_ibge
        rows: []
    expect:
      rows:
        - { sk_municipio: 3202207, codigo_rfb: "5643", nome_municipio: "Fundão", sigla_uf: "ES", nome_uf: null, populacao: 20000 }
        - { sk_municipio: -1, codigo_rfb: "-1", nome_municipio: "NÃO INFORMADO", sigla_uf: "NI", nome_uf: "NÃO INFORMADO", populacao: null }

  - name: test_dim_cnae_sk_inteira_e_membro_nao_informado
    description: "ADR-0013: `sk_cnae` é a subclasse como inteiro ('0111301' → 111301, zero à esquerda preservado em `codigo_subclasse`) e existe o membro `-1`."
    model: dim_cnae
    given:
      - input: ref('stg_bd__cnaes')
        rows:
          - { subclasse: "0111301", descricao_subclasse: "Cultivo de arroz", classe: "01113", grupo: "011", divisao: "01", secao: "A" }
    expect:
      rows:
        - { sk_cnae: 111301, codigo_subclasse: "0111301", codigo_classe: "01113", codigo_grupo: "011", codigo_divisao: "01", codigo_secao: "A" }
        - { sk_cnae: -1, codigo_subclasse: "-1", codigo_classe: "-1", codigo_grupo: "-1", codigo_divisao: "-1", codigo_secao: "-1" }

  - name: test_dim_natureza_juridica_sk_e_membro_nao_informado
    description: "ADR-0013: `sk_natureza_juridica` = código inteiro (`0000` → 0) e existe o membro `-1`."
    model: dim_natureza_juridica
    given:
      - input: ref('stg_rfb__naturezas')
        rows:
          - { codigo: "2062", descricao: "Sociedade Empresária Limitada" }
          - { codigo: "0000", descricao: "Natureza Jurídica não informada" }
    expect:
      rows:
        - { sk_natureza_juridica: 2062, codigo_natureza_juridica: "2062" }
        - { sk_natureza_juridica: 0, codigo_natureza_juridica: "0000" }
        - { sk_natureza_juridica: -1, codigo_natureza_juridica: "-1" }

  - name: test_dim_data_calendario_continuo_com_atributos_em_portugues
    description: >
      BI-01/R3-03: uma linha por dia do `primeiro_dia_calendario` (aqui 2000-02-29, bissexto; padrão
      1900-01-01) até `data_referencia` (2000-03-02), `sk_data = yyyymmdd`, nomes em português; mais
      os membros `-1` (NÃO INFORMADO) e `-2` (DATA INVÁLIDA) com datas contíguas e `ano` NULL.
    model: dim_data
    overrides:
      vars:
        primeiro_dia_calendario: "2000-02-29"
    given:
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { dat_inicio_atividade: "2000-02-29", dat_situacao: "2000-03-01", _data_referencia: "2000-03-02" }
          - { dat_inicio_atividade: "2000-03-01", dat_situacao: null, _data_referencia: "2000-03-02" }
    expect:
      rows:
        - { sk_data: 20000229, data: "2000-02-29", ano: 2000, semestre: 1, trimestre: 1, mes: 2, nome_mes: "fevereiro", ano_mes: "2000-02", dia: 29, dia_semana_numero: 2, dia_semana: "terça-feira" }
        - { sk_data: 20000301, data: "2000-03-01", ano: 2000, semestre: 1, trimestre: 1, mes: 3, nome_mes: "março", ano_mes: "2000-03", dia: 1, dia_semana_numero: 3, dia_semana: "quarta-feira" }
        - { sk_data: 20000302, data: "2000-03-02", ano: 2000, semestre: 1, trimestre: 1, mes: 3, nome_mes: "março", ano_mes: "2000-03", dia: 2, dia_semana_numero: 4, dia_semana: "quinta-feira" }
        - { sk_data: -1, data: "2000-02-28", ano: null, semestre: null, trimestre: null, mes: null, nome_mes: "NÃO INFORMADO", ano_mes: "NÃO INFORMADO", dia: null, dia_semana_numero: null, dia_semana: "NÃO INFORMADO" }
        - { sk_data: -2, data: "2000-02-27", ano: null, semestre: null, trimestre: null, mes: null, nome_mes: "DATA INVÁLIDA", ano_mes: "DATA INVÁLIDA", dia: null, dia_semana_numero: null, dia_semana: "DATA INVÁLIDA" }

  - name: test_int_estabelecimentos_enriquecidos_flags_e_nada_descartado
    description: >
      CORE-01: LEFT JOINs — estabelecimento sem empresa, sem CNAE no BD ou sem município no BD
      permanece, com a flag `tem_*` falsa; Simples ausente vira `opcao_*` false; optante do Simples que não é MEI
      fica `opcao_simples` true e `opcao_mei` false (RBP-13, N20).
    model: int_estabelecimentos__enriquecidos
    given:
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { cnpj_completo: "11111111000191", cnpj_raiz: "11111111", cnae_principal: "4741500", municipio_rfb_codigo: "5643" }
          - { cnpj_completo: "14141414000100", cnpj_raiz: "14141414", cnae_principal: "3511500", municipio_rfb_codigo: "5699" }
          - { cnpj_completo: "15151515000100", cnpj_raiz: "15151515", cnae_principal: "4711302", municipio_rfb_codigo: "1182" }
          - { cnpj_completo: "99999999000100", cnpj_raiz: "99999999", cnae_principal: "4741500", municipio_rfb_codigo: "5643" }
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "11111111", natureza_juridica_codigo: "2135", porte_codigo: 1 }
          - { cnpj_raiz: "14141414", natureza_juridica_codigo: "2062", porte_codigo: 5 }
          - { cnpj_raiz: "15151515", natureza_juridica_codigo: "2135", porte_codigo: 1 }
      - input: ref('stg_rfb__simples')
        rows:
          - { cnpj_raiz: "11111111", opcao_simples: true, opcao_mei: true }
          - { cnpj_raiz: "14141414", opcao_simples: true, opcao_mei: false }
      - input: ref('stg_rfb__naturezas')
        rows:
          - { codigo: "2135", descricao: "Empresário (Individual)" }
          - { codigo: "2062", descricao: "Sociedade Empresária Limitada" }
      - input: ref('stg_bd__cnaes')
        rows:
          - { subclasse: "4741500" }
          - { subclasse: "4711302" }
      - input: ref('int_municipios__conformados')
        rows:
          - { id_municipio_ibge: "3202207", codigo_rfb: "5643" }
          - { id_municipio_ibge: "3205002", codigo_rfb: "5699" }
    expect:
      rows:
        - { cnpj_completo: "11111111000191", id_municipio_ibge: "3202207", opcao_simples: true, opcao_mei: true, tem_empresa: true, tem_natureza: true, tem_cnae_bd: true, tem_municipio_bd: true }
        - { cnpj_completo: "14141414000100", id_municipio_ibge: "3205002", opcao_simples: true, opcao_mei: false, tem_empresa: true, tem_natureza: true, tem_cnae_bd: false, tem_municipio_bd: true }
        - { cnpj_completo: "15151515000100", id_municipio_ibge: null, opcao_simples: false, opcao_mei: false, tem_empresa: true, tem_natureza: true, tem_cnae_bd: true, tem_municipio_bd: false }
        - { cnpj_completo: "99999999000100", id_municipio_ibge: "3202207", opcao_simples: false, opcao_mei: false, tem_empresa: false, tem_natureza: false, tem_cnae_bd: true, tem_municipio_bd: true }

  - name: test_fct_estabelecimentos_chaves_inteiras_e_menos_um
    description: >
      CORE-01/BI-01/R3-03: sk's vêm das dimensões, `-1` quando falta par ou a data é nula, `-2` para data
      anterior a 1900 (início 1194-08-15 e situação 1899-12-31 de "V"); `idade_anos`

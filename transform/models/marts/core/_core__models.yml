version: 2

models:
  - name: int_municipios__conformados
    description: >
      Município conformado (Base dos Dados + população do `ano_populacao` + PIB do último ano), uma
      linha por município IBGE. Base de `dim_municipio`; não inclui o membro `-1`.
    columns:
      - name: sk_municipio
        description: Código IBGE como inteiro (chave substituta determinística).
        data_tests: [unique, not_null]
      - name: codigo_rfb
        description: Código RFB do município; único (duplicata multiplicaria linhas da fato).
        data_tests:
          - unique:
              config: { severity: warn, store_failures: true }

  - name: dim_municipio
    description: >
      Dimensão de município (ADR-0013). Chave `sk_municipio` inteira determinística, hierarquias
      geográficas em colunas, centroide, população e PIB. Membro `-1` "NÃO INFORMADO" para
      estabelecimentos sem município na Base dos Dados (exterior, município criado após a base).
    config:
      contract:
        enforced: true
    columns:
      - name: sk_municipio
        description: >
          Chave substituta inteira (código IBGE do município); `-1` é o membro NÃO INFORMADO. Determinística: não depende da ordem de carga.
        data_type: integer
        data_tests: [unique, not_null]
      - name: id_municipio_ibge
        description: >
          Código IBGE do município (7 dígitos). Linhagem: `stg_bd__municipios.id_municipio`.
        data_type: varchar
      - name: codigo_rfb
        description: >
          Código do município na RFB (4 dígitos), usado para casar com os estabelecimentos. Linhagem: `stg_bd__municipios.id_municipio_rf`.
        data_type: varchar
        data_tests:
          - not_null
          - unique:
              config: { severity: warn, store_failures: true }
      - name: nome_municipio
        description: >
          Nome do município (acentuado, Base dos Dados).
        data_type: varchar
      - name: sigla_uf
        description: >
          Sigla da UF do município.
        data_type: varchar
      - name: nome_uf
        description: >
          Nome da UF.
        data_type: varchar
      - name: nome_regiao
        description: >
          Nome da grande região (Norte, Nordeste, Sudeste, Sul, Centro-Oeste).
        data_type: varchar
      - name: id_mesorregiao
        description: >
          Código IBGE da mesorregião.
        data_type: varchar
      - name: nome_mesorregiao
        description: >
          Nome da mesorregião (nível da hierarquia UF → mesorregião → microrregião → município).
        data_type: varchar
      - name: id_microrregiao
        description: >
          Código IBGE da microrregião.
        data_type: varchar
      - name: nome_microrregiao
        description: >
          Nome da microrregião.
        data_type: varchar
      - name: id_regiao_intermediaria
        description: >
          Código IBGE da região geográfica intermediária.
        data_type: varchar
      - name: nome_regiao_intermediaria
        description: >
          Nome da região geográfica intermediária (hierarquia alternativa: intermediária → imediata).
        data_type: varchar
      - name: id_regiao_imediata
        description: >
          Código IBGE da região geográfica imediata.
        data_type: varchar
      - name: nome_regiao_imediata
        description: >
          Nome da região geográfica imediata.
        data_type: varchar
      - name: latitude
        description: >
          Latitude do centroide do município (graus decimais).
        data_type: double
      - name: longitude
        description: >
          Longitude do centroide do município (graus decimais).
        data_type: double
      - name: ano_populacao
        description: >
          Ano da população usada: var `ano_populacao` ou o último ano disponível.
        data_type: integer
      - name: populacao
        description: >
          População estimada do município no `ano_populacao`; NULL sem dado.
        data_type: bigint
      - name: ano_pib
        description: >
          Ano do PIB usado (último ano disponível).
        data_type: integer
      - name: pib
        description: >
          PIB do município (R$) em `ano_pib`; NULL sem dado.
        data_type: double

  - name: dim_cnae
    description: >
      Dimensão de CNAE (ADR-0013) com a hierarquia seção → divisão → grupo → classe → subclasse (Base dos Dados), código e descrição em colunas separadas. Membro `-1` para CNAE sem par no BD.
    config:
      contract:
        enforced: true
    columns:
      - name: sk_cnae
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Subclasse como inteiro.
        data_type: integer
        data_tests: [unique, not_null]
      - name: codigo_secao
        description: >
          Código da seção (letra).
        data_type: varchar
      - name: descricao_secao
        description: >
          Descrição da seção.
        data_type: varchar
      - name: codigo_divisao
        description: >
          Código da divisão (2 dígitos).
        data_type: varchar
      - name: descricao_divisao
        description: >
          Descrição da divisão.
        data_type: varchar
      - name: codigo_grupo
        description: >
          Código do grupo (3 dígitos).
        data_type: varchar
      - name: descricao_grupo
        description: >
          Descrição do grupo.
        data_type: varchar
      - name: codigo_classe
        description: >
          Código da classe (5 dígitos).
        data_type: varchar
      - name: descricao_classe
        description: >
          Descrição da classe.
        data_type: varchar
      - name: codigo_subclasse
        description: >
          Código da subclasse (7 dígitos, com zeros à esquerda).
        data_type: varchar
        data_tests: [unique, not_null]
      - name: descricao_subclasse
        description: >
          Descrição da subclasse.
        data_type: varchar

  - name: dim_natureza_juridica
    description: >
      Dimensão de natureza jurídica (domínio RFB). Membro `-1` para empresa sem natureza no domínio.
    config:
      contract:
        enforced: true
    columns:
      - name: sk_natureza_juridica
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Código como inteiro.
        data_type: integer
        data_tests: [unique, not_null]
      - name: codigo_natureza_juridica
        description: >
          Código da natureza jurídica (4 dígitos).
        data_type: varchar
        data_tests: [unique, not_null]
      - name: descricao_natureza_juridica
        description: >
          Descrição da natureza jurídica.
        data_type: varchar

  - name: dim_porte
    description: >
      Dimensão de porte da empresa (seed `dominio_porte`). Membro `-1` para porte vazio ou fora do domínio.
    config:
      contract:
        enforced: true
    columns:
      - name: sk_porte
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Código RFB do porte.
        data_type: integer
        data_tests: [unique, not_null]
      - name: codigo_porte
        description: >
          Código RFB do porte.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: rotulo_porte
        description: >
          Rótulo curto (N/A, MICRO, PEQUENA, DEMAIS).
        data_type: varchar
      - name: descricao_porte
        description: >
          Descrição por extenso.
        data_type: varchar

  - name: dim_situacao_cadastral
    description: >
      Dimensão de situação cadastral (seed `dominio_situacao_cadastral`). Membro `-1` para código fora do domínio.
    config:
      contract:
        enforced: true
    columns:
      - name: sk_situacao_cadastral
        description: >
          Chave substituta inteira determinística (derivada do código natural); `-1` é o membro NÃO INFORMADO. Código RFB da situação.
        data_type: integer
        data_tests: [unique, not_null]
      - name: codigo_situacao_cadastral
        description: >
          Código RFB da situação.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: rotulo_situacao_cadastral
        description: >
          Rótulo curto (NULA, ATIVA, SUSPENSA, INAPTA, BAIXADA).
        data_type: varchar
      - name: descricao_situacao_cadastral
        description: >
          Descrição por extenso.
        data_type: varchar

  - name: dim_data
    description: >
      Calendário (ADR-0013, emenda R3-03): uma linha por dia de 1900-01-01 até `data_referencia` (ou a
      maior data observada, se maior), com `sk_data = yyyymmdd`. Dimensão de papel duplo na fato
      (`sk_data_inicio_atividade`, `sk_data_situacao`). Membros `-1` NÃO INFORMADO (data nula) e `-2`
      DATA INVÁLIDA (anterior a 1900), com datas contíguas ao calendário (1899-12-31 e 1899-12-30)
      para que a tabela seja marcável como tabela de datas no Power BI; `ano`/`mes` ficam NULL neles.
    config:
      contract:
        enforced: true
    columns:
      - name: sk_data
        description: >
          Chave substituta inteira no formato yyyymmdd (ex.: 20000229); `-1` NÃO INFORMADO (data nula) e `-2` DATA INVÁLIDA (anterior a 1900).
        data_type: integer
        data_tests: [unique, not_null]
      - name: data
        description: >
          Data do calendário, nunca nula; os membros `-1` e `-2` usam 1899-12-31 e 1899-12-30.
        data_type: date
      - name: ano
        description: >
          Ano (4 dígitos).
        data_type: integer
      - name: semestre
        description: >
          Semestre do ano (1 ou 2).
        data_type: integer
      - name: trimestre
        description: >
          Trimestre do ano (1 a 4).
        data_type: integer
      - name: mes
        description: >
          Mês do ano (1 a 12).
        data_type: integer
      - name: nome_mes
        description: >
          Nome do mês em português (janeiro … dezembro).
        data_type: varchar
      - name: ano_mes
        description: >
          Ano e mês no formato `AAAA-MM`, usado como rótulo/ordenação mensal e igual a `_mes_referencia`.
        data_type: varchar
      - name: dia
        description: >
          Dia do mês (1 a 31).
        data_type: integer
      - name: dia_semana_numero
        description: >
          Dia da semana ISO (1 segunda … 7 domingo), para ordenar `dia_semana` no BI.
        data_type: integer
      - name: dia_semana
        description: >
          Nome do dia da semana em português (segunda-feira … domingo).
        data_type: varchar

  - name: int_estabelecimentos__enriquecidos
    description: >
      Estabelecimentos do mês selecionado com empresa, Simples/MEI e pares nos domínios, por LEFT
      JOIN: nada é descartado (diferente dos inner joins de `bh_empresas`); a ausência de par vira
      as flags `tem_*`. Base da fato e da bridge de CNAEs secundários.
    columns:
      - name: cnpj_completo
        description: CNPJ de 14 dígitos; único por mês.
        data_tests: [unique, not_null]
      - name: matriz_filial_codigo
        description: Indicador matriz (1) / filial (2); validado contra o seed `dominio_matriz_filial`.
        data_tests:
          - relationships:
              arguments:
                to: ref('dominio_matriz_filial')
                field: codigo
              config: { where: "matriz_filial_codigo is not null" }

  - name: fct_estabelecimentos
    description: >
      Fato detalhada (ADR-0013): uma linha por estabelecimento (`cnpj_completo`, dimensão
      degenerada), só com chaves inteiras para as dimensões, flags e medidas. Sem descartes
      silenciosos: estabelecimento sem par numa dimensão fica com a chave `-1`. Parquet em
      `gold/fct_estabelecimentos.parquet`; para o Power BI use `fct_resumo_mensal` (modo Import).
    config:
      contract:
        enforced: true
    columns:
      - name: cnpj_completo
        description: CNPJ completo (14 dígitos); dimensão degenerada e chave da linha.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: sk_municipio
        description: >
          Chave de `dim_municipio`; `-1` quando o município RFB não tem par na Base dos Dados (exterior, município novo).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: sk_municipio
      - name: sk_cnae
        description: >
          Chave de `dim_cnae` (CNAE principal); `-1` quando o CNAE não tem par na Base dos Dados.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: sk_natureza_juridica
        description: >
          Chave de `dim_natureza_juridica`; `-1` quando a empresa não tem natureza no domínio.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_natureza_juridica')
                field: sk_natureza_juridica
      - name: sk_porte
        description: >
          Chave de `dim_porte`; `-1` quando o porte está vazio ou fora do domínio.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_porte')
                field: sk_porte
      - name: sk_situacao_cadastral
        description: >
          Chave de `dim_situacao_cadastral`; `-1` quando o código está fora do domínio.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_situacao_cadastral')
                field: sk_situacao_cadastral
      - name: sk_data_inicio_atividade
        description: >
          Chave de `dim_data` (papel: início de atividade); `-1` quando a data é nula; `-2` quando é anterior a 1900 (DATA INVÁLIDA).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: sk_data
      - name: sk_data_situacao
        description: >
          Chave de `dim_data` (papel: data da situação cadastral); `-1` quando a data é nula (ex.: `00000000`); `-2` quando é anterior a 1900 (DATA INVÁLIDA).
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: sk_data
      - name: idade_anos
        description: >
          Idade do estabelecimento em anos (1 casa), relativa a `data_referencia`, só para ativos
          (NULL nos demais), como `bh_empresas.idade_atual`. Aditiva via soma, para médias no BI.
        data_type: double
      - name: opcao_simples
        description: Optante pelo Simples Nacional na empresa (false quando não há registro).
        data_type: boolean
      - name: opcao_mei
        description: Optante pelo MEI na empresa (false quando não há registro).
        data_type: boolean
      - name: capital_social
        description: >
          Capital social da EMPRESA (R$), repetido em cada estabelecimento dela; não some por
          estabelecimento (some só a matriz, `eh_matriz`). NULL quando não há empresa.
        data_type: decimal(18,2)
      - name: eh_matriz
        description: Verdadeiro para matriz (`ind_matriz_filial = 1`).
        data_type: boolean
      - name: eh_ativa
        description: Verdadeiro para situação cadastral ativa (código 2).
        data_type: boolean

  - name: fct_resumo_mensal
    description: >
      Fato agregada para Power BI em modo Import (ADR-0012/0013). Grão: mês × município × CNAE ×
      porte × situação × MEI (sem ano de início nem natureza: emenda R3-02 do ADR-0013). Medidas
      aditivas (idade média = `soma_idade_anos / qtd_ativos`; capital médio =
      `soma_capital_social_matrizes / qtd_matrizes`). Gravada como uma partição Parquet por mês em
      `gold/fct_resumo_mensal/mes_referencia=YYYY-MM/`: reprocessar um mês substitui só a partição dele
      e o histórico sobrevive à remoção do `warehouse.duckdb`. Esta relação lê TODAS as partições
      existentes em disco (série histórica); o mês processado na execução é o `max(_mes_referencia)`
      do staging.
    config:
      contract:
        enforced: true
    # Integridade referencial: testes singulares `fct_resumo_mensal_relacionamentos_mes` (error, só o
    # mês processado: `relationships` genérico não aceita `ref` no `where`) e
    # `fct_resumo_mensal_integridade_historica` (warn, todas as partições) — R3-18.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_referencia
              - sk_municipio
              - sk_cnae
              - sk_porte
              - sk_situacao_cadastral
              - opcao_mei
    columns:
      - name: mes_referencia
        description: Mês de referência `YYYY-MM` (coluna de partição Hive).
        data_type: varchar
        data_tests: [not_null]
      - name: sk_mes_referencia
        description: >
          Primeiro dia do mês como `yyyymm01`; mesma chave de `dim_data.sk_data` (relacionamento 1:* no BI).
        data_type: integer
        data_tests: [not_null]
      - name: sk_municipio
        description: Chave de `dim_municipio` (`-1` = NÃO INFORMADO).
        data_type: integer
        data_tests: [not_null]
      - name: sk_cnae
        description: Chave de `dim_cnae` (CNAE principal; `-1` = NÃO INFORMADO).
        data_type: integer
        data_tests:
          - not_null
      - name: sk_porte
        description: Chave de `dim_porte`.
        data_type: integer
        data_tests:
          - not_null
      - name: sk_situacao_cadastral
        description: Chave de `dim_situacao_cadastral`.
        data_type: integer
        data_tests:
          - not_null
      - name: opcao_mei
        description: Optante pelo MEI.
        data_type: boolean
        data_tests: [not_null]
      - name: qtd_estabelecimentos
        description: Quantidade de estabelecimentos no grão.
        data_type: bigint
        data_tests: [not_null]
      - name: qtd_ativos
        description: Quantidade de estabelecimentos ativos (situação 2) no grão.
        data_type: bigint
        data_tests: [not_null]
      - name: soma_idade_anos
        description: Soma da idade (anos) dos estabelecimentos ativos; divida por `qtd_ativos` para a média.
        data_type: double
      - name: qtd_matrizes
        description: Quantidade de matrizes no grão (uma por empresa); denominador do capital médio.
        data_type: bigint
        data_tests: [not_null]
      - name: soma_capital_social_matrizes
        description: >
          Soma do capital social (R$) só das matrizes (uma por empresa, sem repetição por filial).
        data_type: decimal(18,2)

  - name: int_cnaes_secundarios__explodidos
    description: >
      Uma linha por (estabelecimento, CNAE secundário), a partir de `cnaes_secundarios_lista`.
    columns:
      - name: cnpj_completo
        description: CNPJ completo do estabelecimento.
      - name: codigo_cnae_secundario
        description: Subclasse CNAE secundária (7 dígitos).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnpj_completo, codigo_cnae_secundario]

  - name: bridge_estabelecimento_cnae_secundario
    description: >
      Bridge (ADR-0013): CNAEs secundários por estabelecimento (muitos-para-muitos entre
      `fct_estabelecimentos` e `dim_cnae`). Lista vazia não gera linhas. Opcional no BI.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnpj_completo, codigo_cnae_secundario]
    columns:
      - name: cnpj_completo
        description: CNPJ completo; FK para `fct_estabelecimentos.cnpj_completo`.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_estabelecimentos')
                field: cnpj_completo
      - name: sk_cnae
        description: Chave de `dim_cnae` (CNAE secundário); `-1` quando sem par na Base dos Dados.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cnae')
                field: sk_cnae
      - name: codigo_cnae_secundario
        description: Subclasse CNAE secundária (7 dígitos) como veio da RFB, normalizada com zeros à esquerda.
        data_type: varchar

unit_tests:
  - name: test_int_municipios_conformados_ano_mais_recente
    description: "CORE-01: sem a var `ano_populacao`, usa o último ano de população (2024: 20000, não 2023: 19000); PIB do último ano."
    model: int_municipios__conformados
    given:
      - input: ref('stg_bd__municipios')
        rows:
          - { id_municipio: "3202207", id_municipio_rf: "5643", nome: "Fundão", sigla_uf: "ES" }
          - { id_municipio: "3203205", id_municipio_rf: "5663", nome: "Linhares", sigla_uf: "ES" }
      - input: ref('stg_bd__populacao')
        rows:
          - { id_municipio: "3202207", ano: 2023, populacao: 19000 }
          - { id_municipio: "3202207", ano: 2024, populacao: 20000 }
          - { id_municipio: "3203205", ano: 2023, populacao: 170000 }
      - input: ref('stg_bd__pib')
        rows:
          - { id_municipio: "3202207", ano: 2020, pib: 1.0 }
          - { id_municipio: "3202207", ano: 2021, pib: 350000.0 }
    expect:
      rows:
        - { sk_municipio: 3202207, codigo_rfb: "5643", ano_populacao: 2024, populacao: 20000, ano_pib: 2021, pib: 350000.0 }
        - { sk_municipio: 3203205, codigo_rfb: "5663", ano_populacao: null, populacao: null, ano_pib: null, pib: null }

  - name: test_int_municipios_conformados_var_ano_populacao
    description: "CORE-01: a var `ano_populacao` sobrescreve o último ano (2023: 19000)."
    model: int_municipios__conformados
    overrides:
      vars:
        ano_populacao: 2023
    given:
      - input: ref('stg_bd__municipios')
        rows:
          - { id_municipio: "3202207", id_municipio_rf: "5643", nome: "Fundão", sigla_uf: "ES" }
      - input: ref('stg_bd__populacao')
        rows:
          - { id_municipio: "3202207", ano: 2023, populacao: 19000 }
          - { id_municipio: "3202207", ano: 2024, populacao: 20000 }
      - input: ref('stg_bd__pib')
        rows:

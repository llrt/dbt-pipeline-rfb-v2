        - { cnpj_completo: "H", codigo_cnae_secundario: "4679699" }
        - { cnpj_completo: "H", codigo_cnae_secundario: "4744099" }
        - { cnpj_completo: "Y", codigo_cnae_secundario: "0111301" }

  - name: test_bridge_estabelecimento_cnae_secundario_sk_e_menos_um
    description: "ADR-0013: `sk_cnae` vem de `dim_cnae`; CNAE secundário sem par recebe `-1` mantendo o código original."

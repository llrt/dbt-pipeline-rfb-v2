  - name: test_dim_data_calendario_continuo_com_atributos_em_portugues
    description: >
      BI-01/R3-03: uma linha por dia do `primeiro_dia_calendario` (aqui 2000-02-29, bissexto; padrão
      1900-01-01) até `data_referencia` (2000-03-02), `sk_data = yyyymmdd`, nomes em português; mais
      os membros `-1` (NÃO INFORMADO) e `-2` (DATA INVÁLIDA) com datas contíguas e `ano` NULL.
    model: dim_data
    overrides:
      vars:
        primeiro_dia_calendario: "2000-02-29"
    given:
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { dat_inicio_atividade: "2000-02-29", dat_situacao: "2000-03-01", _data_referencia: "2000-03-02" }
          - { dat_inicio_atividade: "2000-03-01", dat_situacao: null, _data_referencia: "2000-03-02" }
    expect:
      rows:
        - { sk_data: 20000229, data: "2000-02-29", ano: 2000, semestre: 1, trimestre: 1, mes: 2, nome_mes: "fevereiro", ano_mes: "2000-02", dia: 29, dia_semana_numero: 2, dia_semana: "terça-feira" }
        - { sk_data: 20000301, data: "2000-03-01", ano: 2000, semestre: 1, trimestre: 1, mes: 3, nome_mes: "março", ano_mes: "2000-03", dia: 1, dia_semana_numero: 3, dia_semana: "quarta-feira" }
        - { sk_data: 20000302, data: "2000-03-02", ano: 2000, semestre: 1, trimestre: 1, mes: 3, nome_mes: "março", ano_mes: "2000-03", dia: 2, dia_semana_numero: 4, dia_semana: "quinta-feira" }
        - { sk_data: -1, data: "2000-02-28", ano: null, semestre: null, trimestre: null, mes: null, nome_mes: "NÃO INFORMADO", ano_mes: "NÃO INFORMADO", dia: null, dia_semana_numero: null, dia_semana: "NÃO INFORMADO" }
        - { sk_data: -2, data: "2000-02-27", ano: null, semestre: null, trimestre: null, mes: null, nome_mes: "DATA INVÁLIDA", ano_mes: "DATA INVÁLIDA", dia: null, dia_semana_numero: null, dia_semana: "DATA INVÁLIDA" }

  - name: test_int_estabelecimentos_enriquecidos_flags_e_nada_descartado
    description: >
      CORE-01: LEFT JOINs — estabelecimento sem empresa, sem CNAE no BD ou sem município no BD
      permanece, com a flag `tem_*` falsa; Simples ausente vira `opcao_*` false.
    model: int_estabelecimentos__enriquecidos
    given:
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { cnpj_completo: "11111111000191", cnpj_raiz: "11111111", cnae_principal: "4741500", municipio_rfb_codigo: "5643" }
          - { cnpj_completo: "14141414000100", cnpj_raiz: "14141414", cnae_principal: "3511500", municipio_rfb_codigo: "5699" }
          - { cnpj_completo: "15151515000100", cnpj_raiz: "15151515", cnae_principal: "4711302", municipio_rfb_codigo: "1182" }
          - { cnpj_completo: "99999999000100", cnpj_raiz: "99999999", cnae_principal: "4741500", municipio_rfb_codigo: "5643" }
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "11111111", natureza_juridica_codigo: "2135", porte_codigo: 1 }
          - { cnpj_raiz: "14141414", natureza_juridica_codigo: "2062", porte_codigo: 5 }
          - { cnpj_raiz: "15151515", natureza_juridica_codigo: "2135", porte_codigo: 1 }
      - input: ref('stg_rfb__simples')
        rows:
          - { cnpj_raiz: "11111111", opcao_simples: true, opcao_mei: true }
      - input: ref('stg_rfb__naturezas')
        rows:
          - { codigo: "2135", descricao: "Empresário (Individual)" }
          - { codigo: "2062", descricao: "Sociedade Empresária Limitada" }
      - input: ref('stg_bd__cnaes')
        rows:
          - { subclasse: "4741500" }
          - { subclasse: "4711302" }
      - input: ref('int_municipios__conformados')
        rows:
          - { id_municipio_ibge: "3202207", codigo_rfb: "5643" }
          - { id_municipio_ibge: "3205002", codigo_rfb: "5699" }
    expect:
      rows:
        - { cnpj_completo: "11111111000191", id_municipio_ibge: "3202207", opcao_mei: true, tem_empresa: true, tem_natureza: true, tem_cnae_bd: true, tem_municipio_bd: true }
        - { cnpj_completo: "14141414000100", id_municipio_ibge: "3205002", opcao_mei: false, tem_empresa: true, tem_natureza: true, tem_cnae_bd: false, tem_municipio_bd: true }
        - { cnpj_completo: "15151515000100", id_municipio_ibge: null, opcao_mei: false, tem_empresa: true, tem_natureza: true, tem_cnae_bd: true, tem_municipio_bd: false }
        - { cnpj_completo: "99999999000100", id_municipio_ibge: "3202207", opcao_mei: false, tem_empresa: false, tem_natureza: false, tem_cnae_bd: true, tem_municipio_bd: true }

  - name: test_fct_estabelecimentos_chaves_inteiras_e_menos_um
    description: >
      CORE-01/BI-01/R3-03: sk's vêm das dimensões, `-1` quando falta par ou a data é nula, `-2` para data
      anterior a 1900 (início 1194-08-15 e situação 1899-12-31 de "V"); `idade_anos`
      só para ativa (início 2022-10-15, referência 2026-09-12 → 3.9); flags `eh_matriz`/`eh_ativa`.
    model: fct_estabelecimentos
    given:
      - input: ref('int_estabelecimentos__enriquecidos')
        rows:
          - { cnpj_completo: "A", matriz_filial_codigo: 1, situacao_codigo: 2, dat_inicio_atividade: "2022-10-15", dat_situacao: "2022-10-15", cnae_principal: "4741500", id_municipio_ibge: "3202207", natureza_juridica_codigo: "2135", porte_codigo: 1, opcao_simples: false, opcao_mei: true, _data_referencia: "2026-09-12" }
          - { cnpj_completo: "M", matriz_filial_codigo: 2, situacao_codigo: 8, dat_inicio_atividade: "2023-12-01", dat_situacao: null, cnae_principal: "3511500", id_municipio_ibge: null, natureza_juridica_codigo: "9999", porte_codigo: null, opcao_simples: false, opcao_mei: false, _data_referencia: "2026-09-12" }
          - { cnpj_completo: "V", matriz_filial_codigo: 1, situacao_codigo: 8, dat_inicio_atividade: "1194-08-15", dat_situacao: "1899-12-31", cnae_principal: "4741500", id_municipio_ibge: "3202207", natureza_juridica_codigo: "2135", porte_codigo: 1, opcao_simples: false, opcao_mei: false, _data_referencia: "2026-09-12" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 3202207, id_municipio_ibge: "3202207" }
          - { sk_municipio: -1, id_municipio_ibge: "-1" }
      - input: ref('dim_cnae')
        rows:
          - { sk_cnae: 4741500, codigo_subclasse: "4741500" }
          - { sk_cnae: -1, codigo_subclasse: "-1" }
      - input: ref('dim_natureza_juridica')
        rows:
          - { sk_natureza_juridica: 2135, codigo_natureza_juridica: "2135" }
          - { sk_natureza_juridica: -1, codigo_natureza_juridica: "-1" }
      - input: ref('dim_porte')
        rows:
          - { sk_porte: 1 }
          - { sk_porte: -1 }
      - input: ref('dim_situacao_cadastral')
        rows:
          - { sk_situacao_cadastral: 2 }
          - { sk_situacao_cadastral: 8 }
      - input: ref('dim_data')
        rows:
          - { sk_data: 20221015, data: "2022-10-15" }
          - { sk_data: 20231201, data: "2023-12-01" }
          - { sk_data: -1, data: "1899-12-31" }
          - { sk_data: -2, data: "1899-12-30" }
    expect:
      rows:
        - { cnpj_completo: "A", sk_municipio: 3202207, sk_cnae: 4741500, sk_natureza_juridica: 2135, sk_porte: 1, sk_situacao_cadastral: 2, sk_data_inicio_atividade: 20221015, sk_data_situacao: 20221015, idade_anos: 3.9, opcao_mei: true, eh_matriz: true, eh_ativa: true }
        - { cnpj_completo: "M", sk_municipio: -1, sk_cnae: -1, sk_natureza_juridica: -1, sk_porte: -1, sk_situacao_cadastral: 8, sk_data_inicio_atividade: 20231201, sk_data_situacao: -1, idade_anos: null, opcao_mei: false, eh_matriz: false, eh_ativa: false }
        - { cnpj_completo: "V", sk_municipio: 3202207, sk_cnae: 4741500, sk_natureza_juridica: 2135, sk_porte: 1, sk_situacao_cadastral: 8, sk_data_inicio_atividade: -2, sk_data_situacao: -2, idade_anos: null, opcao_mei: false, eh_matriz: true, eh_ativa: false }

  - name: test_int_cnaes_secundarios_explodidos
    description: "CORE-01: lista com 2 códigos gera 2 linhas; lista vazia gera 0; código repetido conta uma vez."

          - { ano: 2020, id_municipio_1: "A", id_municipio_2: "B" }
          - { ano: 2020, id_municipio_1: "B", id_municipio_2: "B" }
          - { ano: 2020, id_municipio_1: "B", id_municipio_2: "Z" }
      - input: ref('dim_municipio')
        rows:
          - { sk_municipio: 1, id_municipio_ibge: "A" }
          - { sk_municipio: 2, id_municipio_ibge: "B" }
          - { sk_municipio: 3, id_municipio_ibge: "C" }
    expect:
      rows:
        - { sk_municipio: 1, sk_municipio_vizinho: 2 }
        - { sk_municipio: 2, sk_municipio_vizinho: 1 }


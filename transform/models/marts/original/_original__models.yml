version: 2

models:
  - name: bh_empresas
    description: >
      **BH Empresas** (flat table granular do notebook 3; bh = base humanizada): uma linha por
      estabelecimento (CNPJ completo), com os dados de domínio (natureza jurídica RFB, CNAE e
      município da Base dos Dados) já juntados e humanizados. Mesmas regras e mesmos **inner
      joins** do SQL original — estabelecimentos sem par em algum domínio ficam de fora (teste
      `bh_empresas_descartes_inner_join`). Paridade verificada contra a tradução literal do SQL
      original (`audit__bh_empresas_sql_original`, teste `paridade_bh_empresas`). Parquet em
      `gold/bh_empresas.parquet`.
    config:
      contract:
        enforced: true
    columns:
      - name: cnpj_raiz
        description: >
          8 primeiros dígitos de CNPJ da empresa. Linhagem: `empresas.cnpj_raiz`, prefixado (lpad)
          com '0'. Domínio: caracteres numéricos, prefixado com 0s se necessário.
        data_type: varchar
      - name: cnpj_completo
        description: >
          CNPJ completo da empresa, com 14 dígitos. Linhagem: `estabelecimentos.cnpj_raiz`,
          `cnpj_ordem`, `cnpj_dv`, cada um prefixado (lpad) com '0'.
        data_type: varchar
        data_tests:
          - unique:
              config: { meta: { escopo: original }, tags: [escopo_original] }
          - not_null:
              config: { meta: { escopo: original }, tags: [escopo_original] }
      - name: nome
        description: >
          Nome da empresa. Linhagem: `estabelecimentos.nome_fantasia`; `empresas.razao_social`
          apenas se `nome_fantasia` for null; upper case para padronizar. **Adaptado** (ADR-0005,
          emenda R2-01): sem espaços nas bordas (`trim` do staging), que o original mantinha
          (fev/2025: ~752 razões sociais com espaço à esquerda); o teste
          `bh_empresas_nome_alterado_por_trim` (warn) conta as linhas afetadas. **Adaptado**
          (ADR-0008, emenda R4-01, decisão do usuário): o CPF que encerra a razão social do
          empresário individual/MEI (todo trecho de exatamente 11 dígitos, no fim ou no meio do
          nome, sem exigir DV: 908 CPFs reais vêm no meio) sai como `***.***.***-**`
          (`mascarar_cpf_no_nome`; 2026-09: 12,5 M nomes); o teste
          `sem_cpf_no_nome` (error) barra CPF com DV válido.
        data_type: varchar
        meta:
          escopo: adaptado
        data_tests:
          - sem_cpf_no_nome:
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
      - name: natureza_juridica
        description: >
          Natureza jurídica da empresa, i.e. uma espécie de "tipo" (em termos jurídicos e fiscais).
          Linhagem: `natureza_juridica.descricao` com `codigo = empresas.natureza_jur`; upper case.
        data_type: varchar
      - name: porte
        description: >
          Porte da empresa, i.e. uma espécie de "tamanho" (em termos de faturamento). Linhagem:
          `empresas.porte`, mapeado 0 → "N/A", 1 → "MICRO", 3 → "PEQUENA", 5 → "DEMAIS"; outro
          valor ou vazio → NULL.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["N/A", "MICRO", "PEQUENA", "DEMAIS"]
              config: { meta: { escopo: original }, tags: [escopo_original] }
      - name: cnae_principal
        description: >
          Subclasse do CNAE (código nacional de atividade econômica) principal da empresa.
          Linhagem: `estabelecimentos.CNAE_principal`, sem transformação. Domínio: 7 caracteres
          numéricos (classificação IBGE).
        data_type: varchar
        data_tests:
          - tamanho_exato:
              arguments:
                tamanho: 7
              config: { meta: { escopo: original }, tags: [escopo_original] }
      - name: desc_cnae_principal
        description: >
          Descrição textual da subclasse do CNAE principal. Linhagem: `cnae_bd.descricao_subclasse`
          com `subclasse = estabelecimentos.CNAE_principal`; upper case.
        data_type: varchar
      - name: grupo_cnae_principal
        description: >
          Descrição textual do grupo (3 primeiros dígitos do CNAE) do CNAE principal. Linhagem:
          `cnae_bd.descricao_grupo` com `subclasse = estabelecimentos.CNAE_principal`; upper case.
        data_type: varchar
      - name: cnaes_secundarios
        description: >
          Subclasses dos CNAEs secundários, separadas por vírgula. Linhagem:
          `estabelecimentos.CNAEs_secundarios`, sem transformação.
        data_type: varchar
      - name: municipio
        description: >
          Nome do município do estabelecimento. Linhagem: `municipio_bd.nome` com
          `id_municipio_rf = estabelecimentos.municipio`; upper case.
        data_type: varchar
      - name: microrregiao_municipio
        description: >
          Nome da microrregião (agregado de municípios vizinhos) do município. Linhagem:
          `municipio_bd.nome_microrregiao`; upper case.
        data_type: varchar
      - name: mesorregiao_municipio
        description: >
          Nome da mesorregião (agregado de microrregiões vizinhas) do município. Linhagem:
          `municipio_bd.nome_mesorregiao`; upper case.
        data_type: varchar
      - name: uf
        description: >
          Sigla da UF do município (`UF` no original). Linhagem: `municipio_bd.sigla_UF`; upper case.
        data_type: varchar
      - name: situacao
        description: >
          Situação da empresa, se ativa ou inativa. Linhagem: `estabelecimentos.situacao`, mapeado
          2 → "ATIVA", qualquer outro código → "INATIVA".
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["ATIVA", "INATIVA"]
              config: { meta: { escopo: original }, tags: [escopo_original] }
      - name: idade_atual
        description: >
          Idade da empresa em anos (1 casa decimal), apenas se ATIVA; NULL se INATIVA. Linhagem:
          `estabelecimentos.dat_inicio_atividade`; `round(dias até data_referencia / 365.25, 1)`.
          **Adaptado** (ADR-0004): o original usava `now()`; aqui a idade é relativa à data do
          extrato (`data_referencia`), para ser determinística. Fora de [0, 200] anos é dado absurdo
          da RFB (fev/2025: 2 ativos, inícios em 1199 e 1601): avisa (warn) e só falha acima de 100
          linhas (spec Original AC 12, emenda R2-02). A data não é anulada no staging, para manter
          a paridade.
        data_type: double
        meta:
          escopo: adaptado
        data_tests:
          # warn_if/error_if só valem com severity error (padrão): 1..100 linhas -> WARN, >100 -> ERROR.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200
              config:
                warn_if: "!=0"
                error_if: ">100"
                store_failures: true
                meta: { escopo: original }
                tags: [escopo_original]

  - name: agg_empresas
    description: >
      **Agg Empresas** (flat table agregada do notebook 3): `bh_empresas` agrupada pelas 10
      dimensões do original (município, microrregião, mesorregião, UF, CNAE principal, descrição
      e grupo do CNAE, natureza jurídica, porte e situação), com a contagem de empresas e a
      idade média do estrato. Reconciliada com `bh_empresas` (teste
      `agg_empresas_reconciliacao`). Parquet em `gold/agg_empresas.parquet`.
    config:
      contract:
        enforced: true
    columns:
      - name: municipio
        description: >
          Nome do município. Linhagem: `bh_empresas.municipio`, sem transformação.
        data_type: varchar
      - name: microrregiao_municipio
        description: >
          Nome da microrregião do município. Linhagem: `bh_empresas.microrregiao_municipio`, sem transformação.
        data_type: varchar
      - name: mesorregiao_municipio
        description: >
          Nome da mesorregião do município. Linhagem: `bh_empresas.mesorregiao_municipio`, sem transformação.
        data_type: varchar
      - name: uf
        description: >
          Sigla da UF do município. Linhagem: `bh_empresas.uf`, sem transformação.
        data_type: varchar
      - name: cnae_principal
        description: >
          Subclasse do CNAE principal (7 caracteres numéricos). Linhagem: `bh_empresas.cnae_principal`, sem transformação.
        data_type: varchar
      - name: desc_cnae_principal
        description: >
          Descrição da subclasse do CNAE principal. Linhagem: `bh_empresas.desc_cnae_principal`, sem transformação.
        data_type: varchar
      - name: grupo_cnae_principal
        description: >
          Descrição do grupo (3 primeiros dígitos) do CNAE principal. Linhagem: `bh_empresas.grupo_cnae_principal`, sem transformação.
        data_type: varchar
      - name: natureza_juridica
        description: >
          Natureza jurídica da empresa. Linhagem: `bh_empresas.natureza_juridica`, sem transformação.
        data_type: varchar
      - name: porte
        description: >
          Porte da empresa (N/A, MICRO, PEQUENA, DEMAIS ou NULL). Linhagem: `bh_empresas.porte`, sem transformação.
        data_type: varchar
      - name: situacao
        description: >
          Situação da empresa (ATIVA ou INATIVA). Linhagem: `bh_empresas.situacao`, sem transformação.
        data_type: varchar
      - name: qtd_empresas
        description: >
          Número de estabelecimentos no estrato (combinação das 10 dimensões). Linhagem:
          `bh_empresas.cnpj_completo`; contagem (`count`).
        data_type: bigint
        data_tests:
          - not_null:
              config: { meta: { escopo: original }, tags: [escopo_original] }
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
              config: { meta: { escopo: original }, tags: [escopo_original] }
      - name: media_idade
        description: >
          Idade média, em anos, dos estabelecimentos do estrato. Linhagem: `bh_empresas.idade_atual`;
          média simples (`avg`). NULL em estratos só de INATIVAS (a idade só existe para ATIVA).
          Valores acima de 200 anos são dado absurdo da RFB (ver `bh_empresas.idade_atual`).
        data_type: double

unit_tests:
  - name: test_bh_empresas_porte
    description: "Original AC 3: porte 0/1/3/5 -> N/A/MICRO/PEQUENA/DEMAIS; vazio (NULL) ou outro código -> NULL."
    model: bh_empresas
    given:
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "00000000", razao_social: "E0", natureza_juridica_codigo: "2062", porte_codigo: 0 }
          - { cnpj_raiz: "00000001", razao_social: "E1", natureza_juridica_codigo: "2062", porte_codigo: 1 }
          - { cnpj_raiz: "00000003", razao_social: "E3", natureza_juridica_codigo: "2062", porte_codigo: 3 }
          - { cnpj_raiz: "00000005", razao_social: "E5", natureza_juridica_codigo: "2062", porte_codigo: 5 }
          - { cnpj_raiz: "00000009", razao_social: "EV", natureza_juridica_codigo: "2062", porte_codigo: null }
          - { cnpj_raiz: "00000007", razao_social: "E7", natureza_juridica_codigo: "2062", porte_codigo: 7 }
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - &est_base
            cnpj_raiz: "00000000"
            cnpj_completo: "00000000000100"
            situacao_codigo: 8
            dat_inicio_atividade: "2020-01-01"
            cnae_principal: "4741500"
            municipio_rfb_codigo: "5643"
            _data_referencia: "2026-09-12"
          - { <<: *est_base, cnpj_raiz: "00000001", cnpj_completo: "00000001000100" }
          - { <<: *est_base, cnpj_raiz: "00000003", cnpj_completo: "00000003000100" }
          - { <<: *est_base, cnpj_raiz: "00000005", cnpj_completo: "00000005000100" }
          - { <<: *est_base, cnpj_raiz: "00000009", cnpj_completo: "00000009000100" }
          - { <<: *est_base, cnpj_raiz: "00000007", cnpj_completo: "00000007000100" }
      - &naturezas
        input: ref('stg_rfb__naturezas')
        rows:
          - { codigo: "2062", descricao: "Sociedade Empresária Limitada" }
      - &cnaes_bd
        input: ref('stg_bd__cnaes')
        rows:
          - { subclasse: "4741500", descricao_subclasse: "Comércio varejista de tintas", descricao_grupo: "Comércio varejista de material de construção" }
      - &municipios_bd
        input: ref('stg_bd__municipios')
        rows:
          - id_municipio_rf: "5643"
            nome: "Fundão"
            nome_microrregiao: "Linhares"
            nome_mesorregiao: "Litoral Norte Espírito-santense"
            sigla_uf: "ES"
    expect:
      rows:
        - { cnpj_completo: "00000000000100", porte: "N/A" }
        - { cnpj_completo: "00000001000100", porte: "MICRO" }
        - { cnpj_completo: "00000003000100", porte: "PEQUENA" }
        - { cnpj_completo: "00000005000100", porte: "DEMAIS" }
        - { cnpj_completo: "00000009000100", porte: null }
        - { cnpj_completo: "00000007000100", porte: null }

  - name: test_bh_empresas_situacao_e_idade
    description: >
      Original AC 4–5: situação 2 -> ATIVA, qualquer outra -> INATIVA; idade só para ATIVA,
      `round(dias até data_referencia / 365.25, 1)` (linha A: 2022-10-15 -> 3.9; 365 dias -> 1.0;
      182 dias -> 0.5); INATIVA -> NULL. data_referencia = `_data_referencia` do mês (2026-09-12).
    model: bh_empresas
    given:
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "11111111", razao_social: "TINTAS FUNDAO LTDA", natureza_juridica_codigo: "2062", porte_codigo: 1 }
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000191", situacao_codigo: 2, dat_inicio_atividade: "2022-10-15" }
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000200", situacao_codigo: 2, dat_inicio_atividade: "2025-09-12" }
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000300", situacao_codigo: 2, dat_inicio_atividade: "2026-03-14" }
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000400", situacao_codigo: 8, dat_inicio_atividade: "2015-03-01" }
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000500", situacao_codigo: 4, dat_inicio_atividade: "2010-06-01" }
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000600", situacao_codigo: 1, dat_inicio_atividade: "2010-06-01" }
      - *naturezas
      - *cnaes_bd
      - *municipios_bd
    expect:
      rows:
        - { cnpj_completo: "11111111000191", situacao: "ATIVA", idade_atual: 3.9 }
        - { cnpj_completo: "11111111000200", situacao: "ATIVA", idade_atual: 1.0 }
        - { cnpj_completo: "11111111000300", situacao: "ATIVA", idade_atual: 0.5 }
        - { cnpj_completo: "11111111000400", situacao: "INATIVA", idade_atual: null }
        - { cnpj_completo: "11111111000500", situacao: "INATIVA", idade_atual: null }
        - { cnpj_completo: "11111111000600", situacao: "INATIVA", idade_atual: null }

  - name: test_bh_empresas_idade_usa_var_data_referencia
    description: "ADR-0004: com a var `data_referencia` definida, a idade é relativa a ela (não ao extrato nem a `now()`)."
    model: bh_empresas
    overrides:
      vars:
        data_referencia: "2032-10-15"
    given:
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "11111111", razao_social: "TINTAS FUNDAO LTDA", natureza_juridica_codigo: "2062", porte_codigo: 1 }
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000191", situacao_codigo: 2, dat_inicio_atividade: "2022-10-15" }
      - *naturezas
      - *cnaes_bd
      - *municipios_bd
    expect:
      rows:
        - { cnpj_completo: "11111111000191", idade_atual: 10.0 }

  - name: test_bh_empresas_nome_e_dominios
    description: >
      Original AC 6–7: `nome = upper(coalesce(nome_fantasia, razao_social))`; `grupo_cnae_principal` = grupo do CNAE (R2-13c); domínios em upper
      case (FUNDÃO, LINHARES, LITORAL NORTE ESPÍRITO-SANTENSE, ES); estabelecimento sem par em
      município BD sai (inner join).
    model: bh_empresas
    given:
      - input: ref('stg_rfb__empresas')
        rows:
          - { cnpj_raiz: "11111111", razao_social: "Tintas Fundao Ltda", natureza_juridica_codigo: "2062", porte_codigo: 1 }
          - { cnpj_raiz: "55555555", razao_social: "Tintas Capixaba", natureza_juridica_codigo: "2062", porte_codigo: null }
      - input: ref('stg_rfb__estabelecimentos')
        rows:
          - { <<: *est_base, cnpj_raiz: "11111111", cnpj_completo: "11111111000191", nome_fantasia: "Tintas Fundão" }
          - { <<: *est_base, cnpj_raiz: "55555555", cnpj_completo: "55555555000191", nome_fantasia: null }
          - { <<: *est_base, cnpj_raiz: "55555555", cnpj_completo: "55555555000200", municipio_rfb_codigo: "1182" }
      - *naturezas
      - *cnaes_bd
      - *municipios_bd
    expect:
      rows:
        - cnpj_completo: "11111111000191"
          nome: "TINTAS FUNDÃO"
          natureza_juridica: "SOCIEDADE EMPRESÁRIA LIMITADA"
          desc_cnae_principal: "COMÉRCIO VAREJISTA DE TINTAS"
          grupo_cnae_principal: "COMÉRCIO VAREJISTA DE MATERIAL DE CONSTRUÇÃO"
          municipio: "FUNDÃO"
          microrregiao_municipio: "LINHARES"
          mesorregiao_municipio: "LITORAL NORTE ESPÍRITO-SANTENSE"
          uf: "ES"
        - cnpj_completo: "55555555000191"
          nome: "TINTAS CAPIXABA"
          natureza_juridica: "SOCIEDADE EMPRESÁRIA LIMITADA"
          desc_cnae_principal: "COMÉRCIO VAREJISTA DE TINTAS"
          grupo_cnae_principal: "COMÉRCIO VAREJISTA DE MATERIAL DE CONSTRUÇÃO"
          municipio: "FUNDÃO"
          microrregiao_municipio: "LINHARES"
          mesorregiao_municipio: "LITORAL NORTE ESPÍRITO-SANTENSE"
          uf: "ES"

  - name: test_agg_empresas_agrupa_conta_e_tira_media
    description: >
      Original AC 8: agrupa pelas 10 dimensões; `qtd_empresas = count(cnpj_completo)`;
      `media_idade = avg(idade_atual)` ignora NULL (INATIVA). Dois ATIVA do mesmo estrato
      (3.0 e 4.0 -> 3.5), dois INATIVA (média NULL) e um estrato de outro município.
    model: agg_empresas
    given:
      - input: ref('bh_empresas')
        format: sql
        rows: |
          select
              'A1' as cnpj_completo, 'FUNDÃO' as municipio, 'LINHARES' as microrregiao_municipio,
              'LITORAL' as mesorregiao_municipio, 'ES' as uf, '4741500' as cnae_principal,
              'TINTAS' as desc_cnae_principal, 'COMÉRCIO' as grupo_cnae_principal,
              'LTDA' as natureza_juridica, 'MICRO' as porte, 'ATIVA' as situacao,
              3.0::double as idade_atual
          union all
          select 'A2', 'FUNDÃO', 'LINHARES', 'LITORAL', 'ES', '4741500', 'TINTAS', 'COMÉRCIO',
              'LTDA', 'MICRO', 'ATIVA', 4.0
          union all
          select 'I1', 'FUNDÃO', 'LINHARES', 'LITORAL', 'ES', '4741500', 'TINTAS', 'COMÉRCIO',
              'LTDA', 'MICRO', 'INATIVA', null
          union all
          select 'I2', 'FUNDÃO', 'LINHARES', 'LITORAL', 'ES', '4741500', 'TINTAS', 'COMÉRCIO',
              'LTDA', 'MICRO', 'INATIVA', null
          union all
          select 'S1', 'SERRA', 'VITÓRIA', 'METROPOLITANA', 'ES', '2071100', 'FABRICAÇÃO',
              'INDÚSTRIA', 'SA', null, 'ATIVA', 10.0
    expect:
      rows:
        - { municipio: "FUNDÃO", cnae_principal: "4741500", porte: "MICRO", situacao: "ATIVA", qtd_empresas: 2, media_idade: 3.5 }
        - { municipio: "FUNDÃO", cnae_principal: "4741500", porte: "MICRO", situacao: "INATIVA", qtd_empresas: 2, media_idade: null }
        - { municipio: "SERRA", cnae_principal: "2071100", porte: null, situacao: "ATIVA", qtd_empresas: 1, media_idade: 10.0 }

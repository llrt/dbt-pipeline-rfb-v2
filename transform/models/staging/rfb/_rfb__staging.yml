  - name: test_stg_rfb__municipios_var_nula_usa_o_maior_mes
    description: "Com `mes_referencia` nula, o staging lê só o maior mês retido no raw (Staging AC 15)."
    model: stg_rfb__municipios
    given:
      - input: source('rfb', 'municipios')
        format: sql
        rows: |
          select '5643' as codigo, 'FUNDAO ANTIGO' as descricao, '2026-08' as _mes_referencia
          union all
          select '5643', 'FUNDAO', '2026-09'
          union all
          select '5699', 'SERRA', '2026-09'
    expect:
      rows:
        - { codigo: "5643", descricao: "FUNDAO" }
        - { codigo: "5699", descricao: "SERRA" }


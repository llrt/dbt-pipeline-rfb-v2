      - name: motivos
        description: "Tabela de domínio: código e descrição de cada motivo de situação cadastral (notebook 2.1.1)."
        config:
          tags: [escopo_original]
          meta:
            escopo: original
            grao: "motivo de situação cadastral (`codigo`) por mês de referência"
            external_location: >-
              read_parquet('{{ env_var('RAIZ_DADOS', '../dados') }}/raw/rfb/motivos/mes_referencia=*/*.parquet',
              hive_partitioning=false)
        data_tests:
          # Raw retém múltiplos meses (atualização mensal): unicidade é por mês, não global.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [codigo, _mes_referencia]
              config: { meta: { escopo: original }, tags: [escopo_original] }
        columns:

version: 2

models:
  - name: stg_bd__municipios
    description: >
      Municípios da Base dos Dados, tipado e limpo: ids como texto (`texto_ou_nulo`),
      `id_municipio_rf` com 4 dígitos (`lpad_codigo`, como o código RFB), `latitude`/`longitude`
      extraídos do WKT `centroide` (`POINT(longitude latitude)`).
    columns:
      - name: id_municipio
        description: Código IBGE do município (7 dígitos).
        data_tests:
          - unique:
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
          - not_null:
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
      - name: id_municipio_rf
        description: >
          Código do município na classificação da RFB, 4 dígitos (o BD pode trazê-lo sem zeros à
          esquerda); casa direto com `stg_rfb__municipios.codigo` e
          `stg_rfb__estabelecimentos.municipio_rfb_codigo` (ver cobertura em
          `tests/cobertura_municipio_rfb_bd.sql`).
        data_tests:
          - tamanho_exato:
              arguments:
                tamanho: 4
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
      - name: nome
        description: Nome do município, acentuado.
      - name: sigla_uf
        description: Sigla da UF do município.
      - name: nome_uf
        description: Nome completo da UF.
      - name: nome_regiao
        description: Nome da grande região (Norte, Nordeste, Sudeste, Sul, Centro-Oeste).
      - name: id_microrregiao
        description: Código IBGE da microrregião.
      - name: nome_microrregiao
        description: Nome da microrregião.
      - name: id_mesorregiao
        description: Código IBGE da mesorregião.
      - name: nome_mesorregiao
        description: Nome da mesorregião.
      - name: id_regiao_imediata
        description: Código IBGE da região geográfica imediata.
      - name: nome_regiao_imediata
        description: Nome da região geográfica imediata.
      - name: id_regiao_intermediaria
        description: Código IBGE da região geográfica intermediária.
      - name: nome_regiao_intermediaria
        description: Nome da região geográfica intermediária.
      - name: latitude
        description: Latitude do centroide do município (extraída do WKT `centroide`).
      - name: longitude
        description: Longitude do centroide do município (extraída do WKT `centroide`).

  - name: stg_bd__cnaes
    description: >
      CNAEs (versão 2.x) da Base dos Dados, tipado e limpo: `subclasse` e demais códigos da
      hierarquia com zeros à esquerda preservados (`lpad_codigo`).
    columns:
      - name: subclasse
        description: Subclasse CNAE (7 dígitos; FK lógica para `stg_rfb__cnaes.codigo`).
        data_tests:
          - unique:
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
          - not_null:
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
          - tamanho_exato:
              arguments:
                tamanho: 7
              config: { meta: { escopo: adicao }, tags: [escopo_adicao] }
      - name: descricao_subclasse
        description: Descrição da subclasse.
      - name: classe
        description: Código da classe (5 dígitos).
      - name: descricao_classe
        description: Descrição da classe.
      - name: grupo
        description: Código do grupo (3 dígitos).
      - name: descricao_grupo
        description: Descrição do grupo.
      - name: divisao
        description: Código da divisão (2 dígitos).
      - name: descricao_divisao
        description: Descrição da divisão.
      - name: secao
        description: Letra da seção (agregado mais alto da hierarquia CNAE).
      - name: descricao_secao
        description: Descrição da seção.

  - name: stg_bd__populacao
    description: "População estimada por município e ano (adição), tipada: `ano` inteiro, `populacao` bigint."
    columns:
      - name: id_municipio
        description: Código IBGE do município (FK lógica para `stg_bd__municipios.id_municipio`).
      - name: sigla_uf
        description: Sigla da UF do município.
      - name: ano
        description: Ano de referência da estimativa populacional.
      - name: populacao
        description: População estimada no município e ano.

  - name: stg_bd__pib
    description: "PIB municipal e seus componentes (adição), tipados como `double`; `ano` inteiro."
    columns:
      - name: id_municipio
        description: Código IBGE do município (FK lógica para `stg_bd__municipios.id_municipio`).
      - name: ano
        description: Ano de referência do PIB.
      - name: pib
        description: PIB total do município no ano, em R$.
      - name: impostos_liquidos
        description: Impostos líquidos de subsídios, em R$.
      - name: va
        description: Valor adicionado total, em R$.
      - name: va_agropecuaria
        description: Valor adicionado da agropecuária, em R$.
      - name: va_industria
        description: Valor adicionado da indústria, em R$.
      - name: va_servicos
        description: Valor adicionado dos serviços, em R$.
      - name: va_adespss
        description: Valor adicionado da administração, defesa, educação e saúde públicas, em R$.

  # --- incremento: enriquecimento_bd (ADR-0015) ---
  - name: stg_bd__censo_2022_municipio
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    description: >
      Censo 2022 por município, tipado: contagens `bigint`, taxas `double`; `area` vira
      `area_km2`. Uma linha por município.
    columns:
      - name: id_municipio
        description: Código IBGE do município (7 dígitos).
        data_tests:
          - unique:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - tamanho_exato:
              arguments:
                tamanho: 7
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: sigla_uf
        description: Sigla da UF do município.
      - name: domicilios
        description: Domicílios (Censo 2022).
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: populacao
        description: População residente (Censo 2022).
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: area_km2
        description: Área territorial em km².
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, inclusive: false }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: taxa_alfabetizacao
        description: Taxa de alfabetização (fração de 0 a 1).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1 }
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: idade_mediana
        description: Idade mediana, em anos.
      - name: razao_sexo
        description: Razão de sexo (homens por 100 mulheres).
      - name: indice_envelhecimento
        description: Índice de envelhecimento (idosos por 100 jovens).
      - name: populacao_indigena
        description: População indígena.
      - name: populacao_indigena_terra_indigena
        description: População indígena residente em terras indígenas.
      - name: populacao_quilombola
        description: População quilombola.
      - name: populacao_quilombola_territorio_quilombola
        description: População quilombola residente em territórios quilombolas.

  - name: stg_bd__regioes_metropolitanas
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    description: >
      Região metropolitana de cada município, uma linha por município (a fonte pode listar um
      município em mais de uma região: fica a de tipo `RM`, depois a de menor nome). A `geometria`
      da fonte é descartada.
    columns:
      - name: id_municipio
        description: Código IBGE do município (7 dígitos).
        data_tests:
          - unique:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
          - tamanho_exato:
              arguments:
                tamanho: 7
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: sigla_uf
        description: Sigla da UF do município.
      - name: nome_regiao_metropolitana
        description: Nome da região metropolitana.
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: tipo
        description: "Tipo da unidade (`RM`, `RIDE`, `AGLO`, `CM`)."
      - name: subcategoria_metropolitana
        description: Subcategoria (núcleo, colar...); frequentemente nula.
      - name: legislacao
        description: Lei que instituiu a região.
      - name: data_legislacao
        description: Data da lei; nula quando ausente.

  - name: stg_bd__vizinhanca
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    description: >
      Pares de municípios vizinhos como publicados (um sentido, possíveis duplicatas e autopares
      em anos antigos), com `ano` inteiro. Ano mais recente e simetria: `int_vizinhanca__municipios`.
    columns:
      - name: ano
        description: Ano da malha municipal do par.
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: id_municipio_1
        description: Código IBGE de um município do par.
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }
      - name: id_municipio_2
        description: Código IBGE do município vizinho.
        data_tests:
          - not_null:
              config: { meta: { escopo: adicao, incremento: enriquecimento_bd }, tags: [escopo_adicao, incremento_enriquecimento_bd] }

unit_tests:
  - name: test_stg_bd__municipios_parse_centroide
    description: "Extrai latitude/longitude do WKT `POINT(longitude latitude)` de `centroide`."
    model: stg_bd__municipios
    given:
      # `source('basedosdados', 'municipio')` usa `external_location`; sem relação física para o
      # dbt introspeccionar tipos de coluna, então a fixture é SQL literal (não `rows` dict).
      - input: source('basedosdados', 'municipio')
        format: sql
        rows: |
          select
              '3202207' as id_municipio,
              '5643' as id_municipio_rf,
              'Fundão' as nome,
              'ES' as sigla_uf,
              'Espírito Santo' as nome_uf,
              'Sudeste' as nome_regiao,
              '32007' as id_microrregiao,
              'Linhares' as nome_microrregiao,
              '3202' as id_mesorregiao,
              'Litoral Norte Espírito-santense' as nome_mesorregiao,
              '320005' as id_regiao_imediata,
              'Vitória' as nome_regiao_imediata,
              '3202' as id_regiao_intermediaria,
              'Vitória' as nome_regiao_intermediaria,
              'POINT(-40.3557928987053 -19.9687204052472)' as centroide
    expect:
      rows:
        - id_municipio: "3202207"
          id_municipio_rf: "5643"
          nome: "Fundão"
          sigla_uf: "ES"
          nome_uf: "Espírito Santo"
          nome_regiao: "Sudeste"
          id_microrregiao: "32007"
          nome_microrregiao: "Linhares"
          id_mesorregiao: "3202"
          nome_mesorregiao: "Litoral Norte Espírito-santense"
          id_regiao_imediata: "320005"
          nome_regiao_imediata: "Vitória"
          id_regiao_intermediaria: "3202"
          nome_regiao_intermediaria: "Vitória"
          longitude: -40.3557928987053
          latitude: -19.9687204052472

  - name: test_stg_bd__municipios_lpad_id_municipio_rf
    description: "R2-13: `id_municipio_rf` sem zeros à esquerda no BD (`643`) sai com 4 dígitos (`0643`), casando com o código RFB."
    model: stg_bd__municipios
    given:
      - input: source('basedosdados', 'municipio')
        format: sql
        rows: |
          select
              '3200409' as id_municipio, '643' as id_municipio_rf, 'Alegre' as nome,
              'ES' as sigla_uf, null::varchar as nome_uf, null::varchar as nome_regiao,
              null::varchar as id_microrregiao, null::varchar as nome_microrregiao,
              null::varchar as id_mesorregiao, null::varchar as nome_mesorregiao,
              null::varchar as id_regiao_imediata, null::varchar as nome_regiao_imediata,
              null::varchar as id_regiao_intermediaria, null::varchar as nome_regiao_intermediaria,
              null::varchar as centroide
    expect:
      rows:
        - { id_municipio: "3200409", id_municipio_rf: "0643" }

  # --- incremento: enriquecimento_bd (ADR-0015) ---
  - name: test_stg_bd__regioes_metropolitanas_uma_por_municipio
    description: >
      Município em duas regiões: fica a de tipo `RM` (mesmo vindo depois na fonte); a geometria
      não vai para o staging.
    model: stg_bd__regioes_metropolitanas
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    given:
      - input: source('basedosdados', 'regiao_metropolitana_2017')
        format: sql
        rows: |
          select 'RM da Zona da Mata' as nome_regiao_metropolitana, 'AGLO' as tipo,
                 null as subcategoria_metropolitana, '2705507' as id_municipio, 'AL' as sigla_uf,
                 'Lei A' as legislacao, '2010-01-01' as data_legislacao, 'POLYGON((0 0))' as geometria
          union all
          select 'RM Maceió', 'RM', null, '2705507', 'AL', 'Lei B', '', 'POLYGON((1 1))'
          union all
          select 'RM Grande Vitória', 'RM', null, '3202207', 'ES', 'Lei Complementar 318',
                 '2005-01-18', 'POLYGON((2 2))'
    expect:
      format: sql
      rows: |
        select '2705507' as id_municipio, 'AL' as sigla_uf,
               'RM Maceió' as nome_regiao_metropolitana, 'RM' as tipo,
               null as subcategoria_metropolitana, 'Lei B' as legislacao,
               null::date as data_legislacao
        union all
        select '3202207', 'ES', 'RM Grande Vitória', 'RM', null, 'Lei Complementar 318',
               date '2005-01-18'

  - name: test_stg_bd__censo_2022_municipio_tipagem
    description: "Renomeia `area` para `area_km2` e converte contagens e taxas."
    model: stg_bd__censo_2022_municipio
    config:
      meta: { incremento: enriquecimento_bd }
      tags: [incremento_enriquecimento_bd]
    given:
      - input: source('basedosdados', 'censo_2022_municipio')
        format: sql
        rows: |
          select '3202207' as id_municipio, 'ES' as sigla_uf, '6715' as domicilios,
                 '17951' as populacao, '287' as area, '0.93371' as taxa_alfabetizacao,
                 '37' as idade_mediana, '97.67' as razao_sexo,
                 '67.68' as indice_envelhecimento, '30' as populacao_indigena,
                 '0' as populacao_indigena_terra_indigena, '0' as populacao_quilombola,
                 '0' as populacao_quilombola_territorio_quilombola
    expect:
      rows:
        - { id_municipio: "3202207", sigla_uf: ES, domicilios: 6715, populacao: 17951, area_km2: 287.0, taxa_alfabetizacao: 0.93371, idade_mediana: 37.0, razao_sexo: 97.67, indice_envelhecimento: 67.68, populacao_indigena: 30, populacao_indigena_terra_indigena: 0, populacao_quilombola: 0, populacao_quilombola_territorio_quilombola: 0 }

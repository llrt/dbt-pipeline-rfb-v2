      - name: regic_2018_atracao
        description: >
          REGIC 2018, aba `BD_MUN_QUEST` de `REGIC2018_Quest_Atracao_Municipios.xlsx` (mesmo zip das ligações): índice de atração de cada município que recebe deslocamentos, geral e por tema.
        config:
          tags: [escopo_adicao, incremento_enriquecimento_ibge]
          meta:
            escopo: adicao
            grao: "município (`codmun`)"
            origem_ibge: "geoftp REGIC2018_Municipios_Ligacoes_e_atracao_xlsx.zip / REGIC2018_Quest_Atracao_Municipios.xlsx, aba BD_MUN_QUEST"
            incremento: enriquecimento_ibge
            external_location: >-
              read_parquet('{{ env_var('RAIZ_DADOS', '../dados') }}/raw/ibge/regic_2018_atracao/*.parquet')
        columns:
          - name: codmun
            data_type: varchar
            config: { meta: { campo_ibge: "CODMUN" } }
            description: >-
              Geocódigo do município (formato numérico).
            data_tests:
              - unique
              - not_null
          - name: nome_mun
            data_type: varchar
            config: { meta: { campo_ibge: "NOME_MUN" } }
            description: >-
              Nome do município.
          - name: hierar_mun
            data_type: varchar
            config: { meta: { campo_ibge: "HIERAR_MUN" } }
            description: >-
              Hierarquia do município na REGIC 2018.
          - name: int_arr
            data_type: varchar
            config: { meta: { campo_ibge: "INT_ARR" } }
            description: >-
              `SIM` se o município integra arranjo populacional.
          - name: hierar_cid
            data_type: varchar
            config: { meta: { campo_ibge: "HIERAR_CID" } }
            description: >-
              Código da hierarquia da cidade.
          - name: nome_hierar_cid
            data_type: varchar
            config: { meta: { campo_ibge: "NOME_HIERAR_CID" } }
            description: >-
              Nome da hierarquia da cidade.
          - name: cod_arr
            data_type: varchar
            config: { meta: { campo_ibge: "COD_ARR" } }
            description: >-
              Geocódigo do arranjo (quando integra).
          - name: nome_arr

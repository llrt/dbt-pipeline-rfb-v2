version: 2

macros:
  - name: raiz_gold
    description: >
      Raiz do gold real (`RAIZ_DADOS/gold`), independente do `external_root` do target: o backfill de
      mês antigo (P22) usa um `external_root` temporário, e só a partição de `fct_resumo_mensal` e o
      histórico de DQ (RBP-12) gravam aqui.
    meta: { escopo: adicao }
  - name: raiz_serie
    description: >
      Raiz da série `fct_resumo_mensal`: `RFB_RAIZ_SERIE` se definida (backfill, R4-02: a partição vai
      para uma raiz temporária e o `rfb pipeline` a move para o gold só depois dos testes), senão
      `raiz_gold()`.
    meta: { escopo: adicao }
  - name: mascarar_cpf_no_nome
    description: >
      Troca todo trecho de exatamente 11 dígitos de um nome (o CPF do empresário individual/MEI na
      razão social) por `***.***.***-**`. Adaptação declarada (ADR-0008, emenda R4-01, decisão do
      usuário), aplicada em `bh_empresas`, `mart_fornecedores_proximos` e no alinhamento da paridade.
    meta: { escopo: adaptado }

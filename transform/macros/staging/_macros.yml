version: 2

macros:
  - name: data_rfb
    description: "`YYYYMMDD` -> DATE; `0`, `00000000` e datas inválidas viram NULL (`try_strptime`)."
    meta: { escopo: adicao }
  - name: lpad_codigo
    description: "Preenche com zeros à esquerda até `tamanho`, sem truncar códigos maiores."
    meta: { escopo: adicao }
  - name: texto_ou_nulo
    description: "`trim` + texto vazio -> NULL."
    meta: { escopo: adicao }
  - name: filtro_mes_referencia
    description: "Filtra `_mes_referencia` pela var `mes_referencia` ou pelo mês mais recente."
    meta: { escopo: adicao }
  - name: test_tamanho_exato
    description: "Teste genérico: valores não nulos da coluna têm exatamente `tamanho` caracteres."
    meta: { escopo: adicao }
  - name: decimal_rfb
    description: "Valor RFB com vírgula decimal -> DECIMAL(18,2) (`1000,50` -> 1000.50); inválido -> NULL."
    meta: { escopo: adicao }
  - name: data_referencia
    description: >
      Data de referência determinística (ADR-0004): var `data_referencia` ou `_data_referencia`
      do mês selecionado. Substitui `now()`/`current_date` em todos os modelos.
    meta: { escopo: adaptado }
  - name: empresa_preferida_por_raiz
    description: >
      Predicado de `QUALIFY` que mantém uma linha por `cnpj_raiz` e mês nas Empresas RFB, preferindo a
      linha com razão social e natureza informada (o extrato real 2026-09 tem uma raiz duplicada com uma
      linha "fantasma"). Usado no staging e na leitura da paridade. Escopo adaptado (ADR-0005).
    meta: { escopo: adicao }
  - name: inferschema_inteiro_ou_texto
    description: >
      Emula o `inferSchema` do Spark na paridade: a coluna vira inteiro (como texto, sem zeros à
      esquerda) só se todos os valores do mês forem inteiros; senão fica o texto original (CNPJ
      alfanumérico, extrato real 2026-09).
    meta: { escopo: adicao }

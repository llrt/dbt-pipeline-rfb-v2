[project]
name = "rfb-pipeline"
version = "0.1.0"
description = "Port do MVP RFB/CNPJ a dbt + DuckDB."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core",
    "dbt-duckdb",
    "duckdb>=1.5",
    "httpx",
    "boto3",
    "python-dotenv",
]

[project.scripts]
rfb = "rfb_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "moto[server]",
    "ruff",
    "sqlfluff",
    "sqlfluff-templater-dbt",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfb_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

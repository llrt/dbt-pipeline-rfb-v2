[project]
name = "rfb-pipeline"
version = "1.3.0"
description = "Port do MVP RFB/CNPJ a dbt + DuckDB."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.10,<2",
    "duckdb>=1.5,<2",
    "httpx",
    "boto3",
    "python-dotenv",
]

[project.scripts]
rfb = "rfb_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "moto[server]",
    "ruff",
    "sqlfluff",
    "sqlfluff-templater-dbt",
    "dbt-metricflow>=0.15,<0.16",  # CLI `mf`: valida e consulta a camada semântica (ADR-0018)
    "pre-commit",
    "rdflib>=7,<8",  # parseia a ontologia `docs/ontologia/rfb_cnpj.ttl` nos testes
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfb_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
